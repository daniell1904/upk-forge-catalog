id: calibre-web
name: Calibre-Web
version: 0.6.27
author: Community
category: Other
description: Calibre-web is a web app providing a clean interface for browsing, reading and downloading eBooks using an existing Calibre database. It is also possible to integrate google drive and edit metadata and your calibre library through the app itself.
homepage: https://github.com/janeczku/calibre-web
ugos:
  app_id: com.upkforge.docker.calibreweb
  version: 0.1.0
  port: 8083
  open_type: tab
  tag_type: utility
volumes:
- container_path: /config
  label: Config
  user_chosen: false
  default_host_subpath: data
- container_path: /books
  label: Books
  user_chosen: false
  default_host_subpath: books
