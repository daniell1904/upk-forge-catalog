id: planka-v2
name: Planka v2
author: Community
category: Productivity
description: The realtime kanban board for workgroups built with React and Redux.
ugos:
  app_id: com.upkforge.docker.plankav2
  version: 0.1.0
  port: 3001
  open_type: tab
  tag_type: utility
parameters:
- key: SECRET_KEY
  label: SECRET KEY
  type: password
- key: DEFAULT_ADMIN_PASSWORD
  label: DEFAULT ADMIN PASSWORD
  type: password
volumes:
- container_path: /app/data
  label: App data
  user_chosen: false
  default_host_subpath: data
- container_path: /app/public/background-images
  label: App public background images
  user_chosen: false
  default_host_subpath: background-images
- container_path: /app/public/user-avatars
  label: App public user avatars
  user_chosen: false
  default_host_subpath: user-avatars
- container_path: /app/public/project-background-images
  label: App public project background images
  user_chosen: false
  default_host_subpath: project-background-images
- container_path: /app/private/attachments
  label: App private attachments
  user_chosen: false
  default_host_subpath: attachments
- container_path: /var/lib/postgresql/data
  label: Var lib postgresql data
  user_chosen: false
  default_host_subpath: postgresql
