services:
  planka-v2:
    image: ghcr.io/plankanban/planka:2.2.1
    restart: unless-stopped
    ports:
      - 3001:1337
    volumes:
      - ${VOL_1}:/app/data
      - ${VOL_2}:/app/public/background-images
      - ${VOL_3}:/app/public/user-avatars
      - ${VOL_4}:/app/public/project-background-images
      - ${VOL_5}:/app/private/attachments
    environment:
      - BASE_URL=http://[YOUR_app_LAN_IP]:3001
      - DATABASE_URL=postgresql://postgres@planka-v2-postgres/planka
      - SECRET_KEY=${SECRET_KEY}
      - DEFAULT_ADMIN_EMAIL=demo@demo.demo
      - DEFAULT_ADMIN_PASSWORD=${DEFAULT_ADMIN_PASSWORD}
      - DEFAULT_ADMIN_NAME=Demo Demo
      - DEFAULT_ADMIN_USERNAME=${DEFAULT_ADMIN_PASSWORD}
  planka-v2-postgres:
    image: postgres:14-alpine@sha256:f1341c01408dc7278e9d365ed4f860cd3f87dd16b4464ac326fc0f422083a579
    restart: unless-stopped
    volumes:
      - ${VOL_6}:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=planka
      - POSTGRES_HOST_AUTH_METHOD=trust
