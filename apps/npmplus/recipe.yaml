id: npmplus
name: NPMPlus
author: Community
category: Networking
description: Docker container for managing Nginx proxy hosts with a simple, powerful interface
warnings:
- service uses host networking
ugos:
  app_id: com.upkforge.docker.npmplus
  version: 0.1.0
  port: 81
  open_type: tab
  tag_type: utility
parameters:
- key: VOL_1
  label: Data folder
  help: Folder on the NAS for NPMPlus's data. It is mounted into the container at /data; NPMPlus has full read and write access to it.
  label_de: Daten-Ordner
  help_de: Ordner auf der NAS für NPMPluss Daten. Wird im Container unter /data eingebunden; NPMPlus hat vollen Lese- und Schreibzugriff darauf.
  type: path
volumes:
- container_path: /data
  label: Data
  default_host_subpath: npmplus-data
