id: glance
name: Glance
author: Community
category: Others
description: Glance is a self-hosted dashboard that puts all your feeds in one place.
ugos:
  app_id: com.upkforge.docker.glance
  version: 0.1.0
  port: 8280
  open_type: tab
  tag_type: utility
parameters:
- key: VOL_1
  label: App config folder
  help: Folder on the NAS for Glance's app config. It is mounted into the container at /app/config; Glance has full read and write access to it.
  type: path
- key: VOL_2
  label: Var run docker.sock folder
  help: Folder on the NAS for Glance's var run docker.sock. It is mounted into the container at /var/run/docker.sock; Glance has full read and write access to it.
  type: path
volumes:
- container_path: /app/config
  label: App config
  default_host_subpath: app-app-config
- container_path: /var/run/docker.sock
  label: Var run docker.sock
  default_host_subpath: app-var-run-docker-sock
