id: glances
name: Glances
version: latest-full
author: nicolargo
category: System
description: Glances is an open-source system cross-platform monitoring tool. It allows real-time monitoring of various aspects of your system such as CPU, memory, disk, network usage etc.
homepage: https://nicolargo.github.io/glances/
warnings:
- dropped host bind mount /var/run/docker.sock:/var/run/docker.sock:ro
ugos:
  app_id: com.upkforge.docker.glances
  version: 0.1.0
  port: 61208
  open_type: tab
  tag_type: system
volumes:
- container_path: /etc/glances
  label: Glances
  user_chosen: false
  default_host_subpath: config
