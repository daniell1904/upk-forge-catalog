id: virt-manager
name: Virtual Machine Manager
author: mber5
category: Developer
description: A GTK Broadway web UI for libvirt and virt-manager, to run virtual machines using QEMU/KVM.
homepage: https://virt-manager.org
source_code: https://github.com/m-bers/docker-virt-manager
ugos:
  app_id: com.upkforge.docker.virtmanager
  version: 0.1.0
  port: 8185
  open_type: tab
  tag_type: devtool
parameters:
- key: VOL_1
  label: Var run libvirt libvirt sock folder
  help: Folder on the NAS for Virtual Machine Manager's var run libvirt libvirt sock. It is mounted into the container at /var/run/libvirt/libvirt-sock; Virtual Machine Manager has full read and write access to it.
  label_de: Var run libvirt libvirt sock-Ordner
  help_de: Ordner auf der NAS für Virtual Machine Managers Var run libvirt libvirt sock. Wird im Container unter /var/run/libvirt/libvirt-sock eingebunden; Virtual Machine Manager hat vollen Lese- und Schreibzugriff darauf.
  type: path
- key: VOL_2
  label: Var lib libvirt folder
  help: Folder on the NAS for Virtual Machine Manager's var lib libvirt. It is mounted into the container at /var/lib/libvirt; Virtual Machine Manager has full read and write access to it.
  label_de: Var lib libvirt-Ordner
  help_de: Ordner auf der NAS für Virtual Machine Managers Var lib libvirt. Wird im Container unter /var/lib/libvirt eingebunden; Virtual Machine Manager hat vollen Lese- und Schreibzugriff darauf.
  type: path
- key: VOL_3
  label: DATA Downloads folder
  help: Folder on the NAS for Virtual Machine Manager's data downloads. It is mounted into the container at /DATA/Downloads; Virtual Machine Manager has full read and write access to it.
  label_de: Daten Downloads-Ordner
  help_de: Ordner auf der NAS für Virtual Machine Managers Daten Downloads. Wird im Container unter /DATA/Downloads eingebunden; Virtual Machine Manager hat vollen Lese- und Schreibzugriff darauf.
  type: path
volumes:
- container_path: /var/run/libvirt/libvirt-sock
  label: Var run libvirt libvirt sock
  default_host_subpath: virt-manager-var-run-libvirt-libvirt-sock
- container_path: /var/lib/libvirt
  label: Var lib libvirt
  default_host_subpath: virt-manager-var-lib-libvirt
- container_path: /DATA/Downloads
  label: DATA Downloads
  default_host_subpath: virt-manager-data-downloads
