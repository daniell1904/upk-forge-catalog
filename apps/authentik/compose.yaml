services:
  authentik:
    image: ghcr.io/goauthentik/server:2026.8.2
    restart: unless-stopped
    command: server
    ports:
      - 19443:9443
    volumes:
      - ${VOL_1}:/media
      - ${VOL_2}:/templates
    environment:
      - AUTHENTIK_REDIS__HOST=authentik-redis
      - AUTHENTIK_POSTGRESQL__HOST=authentik-db
      - AUTHENTIK_POSTGRESQL__USER=authentik
      - AUTHENTIK_POSTGRESQL__NAME=authentik
      - AUTHENTIK_POSTGRESQL__PASSWORD=${AUTHENTIK_POSTGRESQL__PASSWORD}
      - AUTHENTIK_SECRET_KEY=${AUTHENTIK_SECRET_KEY}
  authentik-worker:
    image: ghcr.io/goauthentik/server:2026.8.2
    restart: unless-stopped
    command: worker
    volumes:
      - ${VOL_3}:/var/run/docker.sock
      - ${VOL_4}:/media
      - ${VOL_5}:/certs
      - ${VOL_6}:/templates
    environment:
      - AUTHENTIK_REDIS__HOST=authentik-redis
      - AUTHENTIK_POSTGRESQL__HOST=authentik-db
      - AUTHENTIK_POSTGRESQL__USER=authentik
      - AUTHENTIK_POSTGRESQL__NAME=authentik
      - AUTHENTIK_POSTGRESQL__PASSWORD=${AUTHENTIK_POSTGRESQL__PASSWORD}
      - AUTHENTIK_SECRET_KEY=${AUTHENTIK_SECRET_KEY}
  authentik-db:
    image: postgres:14-alpine@sha256:f1341c01408dc7278e9d365ed4f860cd3f87dd16b4464ac326fc0f422083a579
    restart: unless-stopped
    volumes:
      - ${VOL_7}:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=${AUTHENTIK_POSTGRESQL__PASSWORD}
      - POSTGRES_USER=authentik
      - POSTGRES_DB=authentik
  authentik-redis:
    image: redis:8.2.2-alpine@sha256:1c78f5e7512cc8b22b0edc95c20e7abd9e1fd832e5dfd5c3c6b59ce82fb238d0
    restart: unless-stopped
    command:
      - --save
      - "60"
      - "1"
      - --loglevel
      - warning
    volumes:
      - ${VOL_8}:/data
