id: fileflows
name: FileFlows
author: FileFlows
category: Media
description: >-
  Save storage space with efficient file processing.


  FileFlows lets you monitor and process any file type with custom flows. Videos, audio, images, archives, comics, eBooks—you name it!
homepage: https://fileflows.com/
ugos:
  app_id: com.upkforge.docker.fileflows
  version: 0.1.0
  port: 19200
  open_type: tab
  tag_type: media
parameters:
- key: VOL_1
  label: App Data folder
  help: Folder on the NAS for FileFlows's app data. It is mounted into the container at /app/Data; FileFlows has full read and write access to it.
  type: path
- key: VOL_2
  label: App Logs folder
  help: Folder on the NAS for FileFlows's app logs. It is mounted into the container at /app/Logs; FileFlows has full read and write access to it.
  type: path
- key: VOL_3
  label: App common folder
  help: Folder on the NAS for FileFlows's app common. It is mounted into the container at /app/common; FileFlows has full read and write access to it.
  type: path
- key: VOL_4
  label: Temp folder
  help: Folder on the NAS for FileFlows's temp. It is mounted into the container at /temp; FileFlows has full read and write access to it.
  type: path
- key: VOL_5
  label: Media folder
  help: Folder on the NAS for FileFlows's media. It is mounted into the container at /Media; FileFlows has full read and write access to it.
  type: path
- key: VOL_6
  label: Var run docker.sock folder
  help: Folder on the NAS for FileFlows's var run docker.sock. It is mounted into the container at /var/run/docker.sock; FileFlows has full read and write access to it.
  type: path
volumes:
- container_path: /app/Data
  label: App Data
  default_host_subpath: fileflows-app-data
- container_path: /app/Logs
  label: App Logs
  default_host_subpath: fileflows-app-logs
- container_path: /app/common
  label: App common
  default_host_subpath: fileflows-app-common
- container_path: /temp
  label: Temp
  default_host_subpath: fileflows-temp
- container_path: /Media
  label: Media
  default_host_subpath: fileflows-media
- container_path: /var/run/docker.sock
  label: Var run docker.sock
  default_host_subpath: fileflows-var-run-docker-sock
