services:
  fileflows:
    image: revenz/fileflows:stable
    restart: unless-stopped
    network_mode: bridge
    ports:
      - 19200:5000
    volumes:
      - ${VOL_1}:/app/Data
      - ${VOL_2}:/app/Logs
      - ${VOL_3}:/app/common
      - ${VOL_4}:/temp
      - ${VOL_5}:/Media
      - ${VOL_6}:/var/run/docker.sock
    environment:
      - PGID=1000
      - PUID=1000
      - TZ=$TZ
