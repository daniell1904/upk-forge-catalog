id: appsmith
name: Appsmith
author: Community
category: Developer
description: Low code project to build admin panels, internal tools, and dashboards, integrating 15+ databases.
ugos:
  app_id: com.upkforge.docker.appsmith
  version: 0.1.0
  port: 1080
  open_type: tab
  tag_type: devtool
parameters:
- key: VOL_1
  label: Appsmith stacks folder
  help: Folder on the NAS for Appsmith's appsmith stacks. It is mounted into the container at /appsmith-stacks; Appsmith has full read and write access to it.
  type: path
volumes:
- container_path: /appsmith-stacks
  label: Appsmith stacks
  default_host_subpath: app-appsmith-stacks
