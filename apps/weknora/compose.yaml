services:
  weknora:
    image: wechatopenai/weknora-ui:v0.2.14
    restart: unless-stopped
    ports:
      - 1080:80
    environment:
      - MAX_FILE_SIZE_MB=50
  app:
    image: wechatopenai/weknora-app:v0.2.14
    restart: unless-stopped
    volumes:
      - ./files:/data/files
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=jaeger:4317
      - OTEL_SERVICE_NAME=WeKnora
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_METRICS_EXPORTER=none
      - OTEL_LOGS_EXPORTER=none
      - OTEL_PROPAGATORS=tracecontext,baggage
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6334
      - QDRANT_COLLECTION=weknora_embeddings
      - QDRANT_API_KEY=
      - QDRANT_USE_TLS=false
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY_ID=${MINIO_SECRET_ACCESS_KEY}
      - MINIO_SECRET_ACCESS_KEY=${MINIO_SECRET_ACCESS_KEY}
      - MINIO_BUCKET_NAME=weknora
      - GIN_MODE=release
      - DISABLE_REGISTRATION=false
      - DB_DRIVER=postgres
      - DB_HOST=weknora-postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=WeKnora
      - TZ=$TZ
      - RETRIEVE_DRIVER=postgres
      - DOCREADER_ADDR=weknora-docreader:50051
      - STORAGE_TYPE=minio
      - LOCAL_STORAGE_BASE_DIR=/data/files
      - AUTO_RECOVER_DIRTY=true
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - STREAM_MANAGER_TYPE=redis
      - REDIS_ADDR=weknora-redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_DB=0
      - REDIS_PREFIX="stream:"
      - TENANT_AES_KEY=${TENANT_AES_KEY}
      - CONCURRENCY_POOL_SIZE=5
      - JWT_SECRET=${JWT_SECRET}
      - MAX_FILE_SIZE_MB=50
  weknora-docreader:
    image: wechatopenai/weknora-docreader:v0.2.14
    restart: unless-stopped
    environment:
      - MAX_FILE_SIZE_MB=50
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY_ID=${MINIO_SECRET_ACCESS_KEY}
      - MINIO_SECRET_ACCESS_KEY=${MINIO_SECRET_ACCESS_KEY}
      - MINIO_BUCKET_NAME=weknora
  weknora-postgres:
    image: paradedb/paradedb:v0.18.9-pg17
    restart: unless-stopped
    volumes:
      - ./data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=WeKnora
  weknora-redis:
    image: redis:7.0-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass redis123!@#
      - --appendonly
      - yes
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command:
      - server
      - /data
      - --console-address
      - :9001
    ports:
      - 19000:9000
      - 19001:9001
    volumes:
      - ./minio-data:/data
    environment:
      - MINIO_ROOT_USER=${MINIO_SECRET_ACCESS_KEY}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_ACCESS_KEY}
  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    restart: unless-stopped
    ports:
      - 46831:6831
      - 46832:6832
      - 45778:5778
      - 16686:16686
      - 44317:4317
      - 44318:4318
      - 14250:14250
      - 14268:14268
      - 49411:9411
    volumes:
      - ./jaeger:/var/lib/jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - COLLECTOR_ZIPKIN_HOST_PORT=:9411
  neo4j:
    image: neo4j:2025.10.1
    restart: unless-stopped
    ports:
      - 47474:7474
      - 47687:7687
    volumes:
      - ./neo4j-data:/data
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_import_file_use__neo4j__config=true
      - NEO4JLABS_PLUGINS=["apoc"]
  qdrant:
    image: qdrant/qdrant:v1.16.2
    restart: unless-stopped
    ports:
      - 46333:6333
      - 46334:6334
    volumes:
      - ./storage:/qdrant/storage
