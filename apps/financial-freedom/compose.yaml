services:
  app:
    image: serversideup/financial-freedom:v0.2.0-alpha1@sha256:e36fc6e42b8fd41f9f715b2a26461f1c2365355ff139b8d5d2cfdc60593ccdf2
    restart: unless-stopped
    ports:
      - 8080:80
      - 8443:443
    volumes:
      - ./logs:/var/www/html/storage/logs
      - ./sessions:/var/www/html/storage/framework/sessions
    environment:
      - APP_NAME="Financial Freedom"
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=http://[app_IP]:8080
      - APP_KEY=${APP_KEY}
      - DB_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - DB_HOST=mariadb
      - DB_DATABASE=financialfreedom
      - DB_USERNAME=app
      - DB_PASSWORD=${DB_PASSWORD}
      - MAIL_MAILER=smtp
      - MAIL_HOST=mailpit
      - MAIL_PORT=1025
      - MAIL_USERNAME=null
      - MAIL_PASSWORD=null
      - MAIL_ENCRYPTION=null
      - MAIL_FROM_ADDRESS=noreply@financialfreedom.dev.test
      - MAIL_FROM_NAME="Financial Freedom"
      - SSL_MODE=mixed
      - AUTORUN_ENABLED=true
      - AUTORUN_LARAVEL_EVENT_CACHE=false
      - AUTORUN_LARAVEL_ROUTE_CACHE=false
      - AUTORUN_LARAVEL_STORAGE_LINK=false
      - AUTORUN_LARAVEL_VIEW_CACHE=false
      - FINANCIAL_FREEDOM_ALLOW_REGISTRATION=false
      - LOG_CHANNEL=stack
      - BROADCAST_DRIVER=log
      - CACHE_DRIVER=file
      - QUEUE_CONNECTION=sync
      - SESSION_LIFETIME=120
      - SESSION_DRIVER=cookie
      - MYSQL_ROOT_PASSWORD="cd876479-f30b-43f2-8714-e52e040c657a"
      - MYSQL_DATABASE="financialfreedom"
      - MYSQL_USER="app"
      - MYSQL_PASSWORD="cd876479-f30b-43f2-8714-e52e040c657a"
  mariadb:
    image: mariadb:10.11@sha256:be981e4113326ada8d6004174dd09eeaefc03094037f811182a52d4f2e737350
    restart: unless-stopped
    volumes:
      - ./mariadb:/var/lib/mysql
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=financialfreedom
      - MYSQL_USER=app
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - REMOTE_SQL=
