id: medusa
name: Medusa
version: 1.0.26
author: pymedusa
category: Automation
description: Automatic Video Library Manager for TV Shows. It watches for new episodes of your favorite shows, and when they are posted it does its magic.
homepage: https://github.com/pymedusa/Medusa
ugos:
  app_id: com.upkforge.docker.medusa
  version: 0.1.0
  port: 8081
  open_type: tab
  tag_type: utility
parameters:
- key: VOL_1
  label: Downloads folder
  help: Folder on the NAS for Medusa's downloads. It is mounted into the container at /downloads; Medusa has full read and write access to it.
  label_de: Downloads-Ordner
  help_de: Ordner auf der NAS für Medusas Downloads. Wird im Container unter /downloads eingebunden; Medusa hat vollen Lese- und Schreibzugriff darauf.
  type: path
- key: VOL_2
  label: Tv folder
  help: Folder on the NAS for Medusa's tv. It is mounted into the container at /tv; Medusa has full read and write access to it.
  label_de: TV-Ordner
  help_de: Ordner auf der NAS für Medusas TV. Wird im Container unter /tv eingebunden; Medusa hat vollen Lese- und Schreibzugriff darauf.
  type: path
volumes:
- container_path: /config
  label: Config
  user_chosen: false
  default_host_subpath: config
- container_path: /downloads
  label: Downloads
- container_path: /tv
  label: Tv
