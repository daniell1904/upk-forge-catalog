services:
  emby:
    image: linuxserver/emby:4.9.5
    restart: unless-stopped
    network_mode: bridge
    ports:
      - 8096:8096
      - 8920:8920
    volumes:
      - ${VOL_1}:/config
      - ${VOL_2}:/data/tvshows
      - ${VOL_3}:/data/movies
    environment:
      - PGID=1000
      - PUID=1000
      - TZ=$TZ
