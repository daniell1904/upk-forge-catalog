id: dpanel
name: DPanel
version: 1.10.8
author: donknap
category: System
homepage: https://github.com/donknap/dpanel
warnings:
- dropped host bind mount /var/run/docker.sock:/var/run/docker.sock
ugos:
  app_id: com.upkforge.docker.dpanel
  version: 0.1.0
  port: 8807
  open_type: tab
  tag_type: system
volumes:
- container_path: /dpanel
  label: Dpanel
  user_chosen: false
  default_host_subpath: data
