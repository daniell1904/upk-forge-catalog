id: rocket-chat-v8
name: Rocket.Chat v8
author: Community
category: Social
description: 'Rocket.Chat v8 is an open-source fully customizable communications platform developed in JavaScript for organizations with high standards of data protection. This version requires MongoDB 8.2+ and includes significant updates including ABAC for private channels, Matrix federation support, and voice calling improvements. Note: This is a separate app from the legacy v6 version due to breaking changes including mandatory MongoDB 8.2+ upgrade, removal of multiple SMS providers (Twilio only), and elimination of built-in logging (requires Prometheus/Grafana).'
ugos:
  app_id: com.upkforge.docker.rocketchatv8
  version: 0.1.0
  port: 3100
  open_type: tab
  tag_type: utility
parameters:
- key: VOL_1
  label: Data db folder
  help: Folder on the NAS for Rocket.Chat v8's data db. It is mounted into the container at /data/db; Rocket.Chat v8 has full read and write access to it.
  label_de: Daten db-Ordner
  help_de: Ordner auf der NAS für Rocket.Chat v8s Daten db. Wird im Container unter /data/db eingebunden; Rocket.Chat v8 hat vollen Lese- und Schreibzugriff darauf.
  type: path
volumes:
- container_path: /data/db
  label: Data db
  default_host_subpath: db-data-db
