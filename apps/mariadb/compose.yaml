services:
  mariadb:
    image: linuxserver/mariadb:11.8.8
    restart: unless-stopped
    ports:
      - 3306:3306
    volumes:
      - ${VOL_1}:/config
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=$TZ
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_ROOT_PASSWORD}
      - MYSQL_USER=${MYSQL_ROOT_PASSWORD}
      - MYSQL_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - REMOTE_SQL=
