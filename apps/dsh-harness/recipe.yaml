id: dsh-harness
name: DeepSeekHarness
author: Team
category: AI
description: DeepSeek Harness (dsh) is an open-source agent harness developed by DeepSeek AI.
homepage: https://www.deepseek.com
source_code: https://github.com/deepseek-ai/deepseek-harness
ugos:
  app_id: com.upkforge.docker.dshharness
  version: 0.1.0
  port: 3080
  open_type: tab
  tag_type: utility
parameters:
- key: VOL_1
  label: Root .dsh folder
  help: Folder on the NAS for DeepSeekHarness's root .dsh. It is mounted into the container at /root/.dsh; DeepSeekHarness has full read and write access to it.
  type: path
volumes:
- container_path: /root/.dsh
  label: Root .dsh
  default_host_subpath: dsh-root-dsh
