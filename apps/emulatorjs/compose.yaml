services:
  emulatorjs:
    image: linuxserver/emulatorjs:1.9.2
    restart: unless-stopped
    network_mode: bridge
    ports:
      - 3001:3000
      - 4001:4001
      - 88:80
    volumes:
      - ${VOL_1}:/config
      - ${VOL_2}:/data
      - ${VOL_3}:/data/nes/roms
    environment:
      - PGID=1000
      - PUID=1000
      - SUBFOLDER=/
      - TZ=$TZ
