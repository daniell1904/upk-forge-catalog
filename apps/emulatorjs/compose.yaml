services:
  emulatorjs:
    image: linuxserver/emulatorjs:1.9.2
    restart: unless-stopped
    network_mode: bridge
    ports:
      - 3001:3000
      - 4001:4001
      - 88:80
    volumes:
      - ./config:/config
      - ./data:/data
      - ./emulatorjs-data-nes-roms:/data/nes/roms
    environment:
      - PGID=1000
      - PUID=1000
      - SUBFOLDER=/
      - TZ=$TZ
