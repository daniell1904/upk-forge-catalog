id: emulatorjs
name: emulatorjs
author: self
category: Media
description: EmulatorJS is a Docker-based emulator application that can simulate various operating systems and device environments within containers for development, testing, and learning purposes.
homepage: https://emulatorjs.org/
source_code: https://github.com/linuxserver/emulatorjs
warnings:
- service is privileged
ugos:
  app_id: com.upkforge.docker.emulatorjs
  version: 0.1.0
  port: 3001
  open_type: tab
  tag_type: media
parameters:
- key: VOL_1
  label: Config folder
  help: Folder on the NAS for emulatorjs's config. It is mounted into the container at /config; emulatorjs has full read and write access to it.
  label_de: Konfiguration-Ordner
  help_de: Ordner auf der NAS für emulatorjss Konfiguration. Wird im Container unter /config eingebunden; emulatorjs hat vollen Lese- und Schreibzugriff darauf.
  type: path
- key: VOL_2
  label: Data folder
  help: Folder on the NAS for emulatorjs's data. It is mounted into the container at /data; emulatorjs has full read and write access to it.
  label_de: Daten-Ordner
  help_de: Ordner auf der NAS für emulatorjss Daten. Wird im Container unter /data eingebunden; emulatorjs hat vollen Lese- und Schreibzugriff darauf.
  type: path
- key: VOL_3
  label: Data nes roms folder
  help: Folder on the NAS for emulatorjs's data nes roms. It is mounted into the container at /data/nes/roms; emulatorjs has full read and write access to it.
  label_de: Daten nes roms-Ordner
  help_de: Ordner auf der NAS für emulatorjss Daten nes roms. Wird im Container unter /data/nes/roms eingebunden; emulatorjs hat vollen Lese- und Schreibzugriff darauf.
  type: path
volumes:
- container_path: /config
  label: Config
  default_host_subpath: emulatorjs-config
- container_path: /data
  label: Data
  default_host_subpath: emulatorjs-data
- container_path: /data/nes/roms
  label: Data nes roms
  default_host_subpath: emulatorjs-data-nes-roms
