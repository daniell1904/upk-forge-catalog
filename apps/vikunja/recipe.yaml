id: vikunja
name: Vikunja (Legacy)
author: Community
category: Others
description: The open-source, self-hostable to-do app. Organize everything, on all platforms.
ugos:
  app_id: com.upkforge.docker.vikunja
  version: 0.1.0
  port: 8081
  open_type: tab
  tag_type: utility
parameters:
- key: VOL_1
  label: App vikunja files folder
  help: Folder on the NAS for Vikunja (Legacy)'s app vikunja files. It is mounted into the container at /app/vikunja/files; Vikunja (Legacy) has full read and write access to it.
  type: path
- key: VOL_2
  label: Var lib mysql folder
  help: Folder on the NAS for Vikunja (Legacy)'s var lib mysql. It is mounted into the container at /var/lib/mysql; Vikunja (Legacy) has full read and write access to it.
  type: path
- key: VIKUNJA_DATABASE_PASSWORD
  label: VIKUNJA DATABASE PASSWORD
  type: password
- key: VIKUNJA_SERVICE_JWTSECRET
  label: VIKUNJA SERVICE JWTSECRET
  type: password
- key: MYSQL_ROOT_PASSWORD
  label: MYSQL ROOT PASSWORD
  type: password
volumes:
- container_path: /app/vikunja/files
  label: App vikunja files
  default_host_subpath: vikunja-app-vikunja-files
- container_path: /var/lib/mysql
  label: Var lib mysql
  default_host_subpath: vikunja-db-var-lib-mysql
