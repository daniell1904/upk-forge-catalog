id: kopia
name: Kopia
author: Community
category: Networking
description: Kopia is a fast and secure open-source backup/restore tool that allows you to create encrypted snapshots of your data and save the snapshots to remote or cloud storage of your choice, to network-attached storage or server, or locally on your machine.
warnings:
- 'service adds capabilities: SYS_ADMIN'
ugos:
  app_id: com.upkforge.docker.kopia
  version: 0.1.0
  port: 51515
  open_type: tab
  tag_type: utility
parameters:
- key: KOPIA_UI_PASSWORD
  label: KOPIA UI PASSWORD
  type: password
volumes:
- container_path: /config
  label: Config
  user_chosen: false
  default_host_subpath: config
- container_path: /backups/home
  label: Backups home
  user_chosen: false
  default_host_subpath: home
- container_path: /backups/docker
  label: Backups docker
  user_chosen: false
  default_host_subpath: kopia-backups-docker
- container_path: /repository
  label: Repository
  user_chosen: false
  default_host_subpath: repository
- container_path: /var/run/docker.sock
  label: Var run docker.sock
  user_chosen: false
  default_host_subpath: kopia-var-run-docker-sock
