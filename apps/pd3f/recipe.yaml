id: pd3f
name: PD3F
author: Community
category: AI
description: pd3f is a PDF text extraction pipeline that is self-hosted, local-first and Docker-based. It reconstructs the original continuous text with the help of machine learning.
ugos:
  app_id: com.upkforge.docker.pd3f
  version: 0.1.0
  port: 1616
  open_type: tab
  tag_type: utility
parameters:
- key: VOL_1
  label: Uploads folder
  help: Folder on the NAS for PD3F's uploads. It is mounted into the container at /uploads/; PD3F has full read and write access to it.
  label_de: Uploads-Ordner
  help_de: Ordner auf der NAS für PD3Fs Uploads. Wird im Container unter /uploads/ eingebunden; PD3F hat vollen Lese- und Schreibzugriff darauf.
  type: path
- key: VOL_2
  label: Root .cache folder
  help: Folder on the NAS for PD3F's root .cache. It is mounted into the container at /root/.cache/; PD3F has full read and write access to it.
  label_de: Root .cache-Ordner
  help_de: Ordner auf der NAS für PD3Fs Root .cache. Wird im Container unter /root/.cache/ eingebunden; PD3F hat vollen Lese- und Schreibzugriff darauf.
  type: path
- key: VOL_3
  label: To ocr folder
  help: Folder on the NAS for PD3F's to ocr. It is mounted into the container at /to-ocr/; PD3F has full read and write access to it.
  label_de: To ocr-Ordner
  help_de: Ordner auf der NAS für PD3Fs To ocr. Wird im Container unter /to-ocr/ eingebunden; PD3F hat vollen Lese- und Schreibzugriff darauf.
  type: path
- key: VOL_4
  label: Uploads folder
  help: Folder on the NAS for PD3F's uploads. It is mounted into the container at /uploads/; PD3F has full read and write access to it.
  label_de: Uploads-Ordner
  help_de: Ordner auf der NAS für PD3Fs Uploads. Wird im Container unter /uploads/ eingebunden; PD3F hat vollen Lese- und Schreibzugriff darauf.
  type: path
- key: VOL_5
  label: To ocr folder
  help: Folder on the NAS for PD3F's to ocr. It is mounted into the container at /to-ocr/; PD3F has full read and write access to it.
  label_de: To ocr-Ordner
  help_de: Ordner auf der NAS für PD3Fs To ocr. Wird im Container unter /to-ocr/ eingebunden; PD3F hat vollen Lese- und Schreibzugriff darauf.
  type: path
volumes:
- container_path: /uploads/
  label: Uploads
  default_host_subpath: web-uploads
- container_path: /root/.cache/
  label: Root .cache
  default_host_subpath: worker-root-cache
- container_path: /to-ocr/
  label: To ocr
  default_host_subpath: worker-to-ocr
- container_path: /uploads/
  label: Uploads
  default_host_subpath: worker-uploads
- container_path: /to-ocr/
  label: To ocr
  default_host_subpath: ocr-worker-to-ocr
