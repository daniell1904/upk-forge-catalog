id: pd3f
name: PD3F
author: Community
category: AI
description: pd3f is a PDF text extraction pipeline that is self-hosted, local-first and Docker-based. It reconstructs the original continuous text with the help of machine learning.
ugos:
  app_id: com.upkforge.docker.pd3f
  version: 0.1.0
  port: 1616
  open_type: tab
  tag_type: utility
