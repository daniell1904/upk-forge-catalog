services:
  odysseus:
    image: bigbeartechworld/big-bear-odysseus:2026.07.13@sha256:ce30b8a2d72cd9b7c4ee1dbea0fedbde44b980c50fe43b17b714169428c57a62
    restart: unless-stopped
    ports:
      - 7000:7000
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - PUID=1000
      - PGID=1000
      - AUTH_ENABLED=true
      - ODYSSEUS_ADMIN_PASSWORD=${ODYSSEUS_ADMIN_PASSWORD}
      - SEARXNG_INSTANCE=http://searxng:8080
      - CHROMADB_HOST=chromadb
      - CHROMADB_PORT=8000
  chromadb:
    image: chromadb/chroma:1.5.9@sha256:1e0b73a187a28757c572acba508c46f48c9e8b0acaf5c20e6d95cdedce1acdf6
    restart: unless-stopped
    volumes:
      - ./chromadb:/chroma/chroma
    environment:
      - ANONYMIZED_TELEMETRY=FALSE
  searxng:
    image: searxng/searxng:2026.6.2-e964708c0@sha256:0872beb1d495d41f2dda73d7aea83746657afdd2be3010eb1b11f5a541555c9e
    restart: unless-stopped
    volumes:
      - ./searxng:/etc/searxng
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
      - SEARXNG_SECRET=${SEARXNG_SECRET}
  ntfy:
    image: binwiederhier/ntfy:v2.27.0@sha256:f2419f405127afa868f10985c1a41449e673477cee1eb19994339a5ae8b592e7
    restart: unless-stopped
    command: serve
    volumes:
      - ./ntfy:/var/cache/ntfy
    environment:
      - NTFY_BASE_URL=http://localhost:8091
