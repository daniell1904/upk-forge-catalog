id: peppermint
name: Peppermint
author: Community
category: Others
description: Peppermint is a central hub for your help desk. A powerfully easy system for tracking, prioritising, and solving customer support tickets.
ugos:
  app_id: com.upkforge.docker.peppermint
  version: 0.1.0
  port: 3000
  open_type: tab
  tag_type: utility
parameters:
- key: VOL_1
  label: Var lib postgresql data folder
  help: Folder on the NAS for Peppermint's var lib postgresql data. It is mounted into the container at /var/lib/postgresql/data; Peppermint has full read and write access to it.
  type: path
- key: DB_PASSWORD
  label: DB PASSWORD
  type: password
- key: SECRET
  label: SECRET
  type: password
volumes:
- container_path: /var/lib/postgresql/data
  label: Var lib postgresql data
  default_host_subpath: db-var-lib-postgresql-data
