services:
  app:
    image: pepperlabs/peppermint:latest@sha256:d13932713561c8d69baea49820ba2d42ea145b28193b6a7e33950a05812406fd
    restart: unless-stopped
    ports:
      - 3000:3000
      - 5003:5003
    environment:
      - API_URL=http://local.host:5003
      - DB_HOST=db
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_USERNAME=${DB_PASSWORD}
      - SECRET=${SECRET}
  db:
    image: postgres:15.5@sha256:15b7f8dd3b75bc8f86ba8e875e92e560c03fd6314fe0a4d1315e169421aace01
    restart: unless-stopped
    ports:
      - 5432:5432
    volumes:
      - ${VOL_1}:/var/lib/postgresql/data
    environment:
      - PGID=1000
      - POSTGRES_DB=${DB_PASSWORD}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_USER=${DB_PASSWORD}
      - PUID=1000
      - TZ=Etc/UTC
