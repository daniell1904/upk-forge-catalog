id: write-freely
name: Write Freely
author: Community
category: Social
description: WriteFreely is a clean, minimalist publishing platform made for writers. Start a blog, share knowledge within your organization, or build a community around the shared act of writing.
ugos:
  app_id: com.upkforge.docker.writefreely
  version: 0.1.0
  port: 70
  open_type: tab
  tag_type: utility
parameters:
- key: VOL_1
  label: Mnt config folder
  help: Folder on the NAS for Write Freely's mnt config. It is mounted into the container at /mnt/config; Write Freely has full read and write access to it.
  type: path
volumes:
- container_path: /mnt/config
  label: Mnt config
  default_host_subpath: write-freely-mnt-config
