services:
  clouddrive2:
    image: docker.io/cloudnas/clouddrive2:1.0.16
    ports:
      - "19798:19798"
    volumes:
      - ./data:/CloudNAS
      - ./config:/Config
    environment:
      - TZ=${TZ}
      - CLOUDDRIVE_HOME=/Config
    devices:
      - /dev/fuse:/dev/fuse
    pid: host
    cap_add:
      - SYS_ADMIN
    privileged: true
    restart: unless-stopped
