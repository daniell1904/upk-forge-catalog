id: anaconda3
name: Anaconda3
author: LisonEvf
category: AI
description: Your machine learning Env work with Jupyter Lab
homepage: https://www.anaconda.com
source_code: https://github.com/anaconda/docker-images
ugos:
  app_id: com.upkforge.docker.anaconda3
  version: 0.1.0
  port: 8888
  open_type: tab
  tag_type: utility
parameters:
- key: VOL_1
  label: Opt notebooks folder
  help: Folder on the NAS for Anaconda3's opt notebooks. It is mounted into the container at /opt/notebooks; Anaconda3 has full read and write access to it.
  label_de: Opt notebooks-Ordner
  help_de: Ordner auf der NAS für Anaconda3s Opt notebooks. Wird im Container unter /opt/notebooks eingebunden; Anaconda3 hat vollen Lese- und Schreibzugriff darauf.
  type: path
volumes:
- container_path: /opt/notebooks
  label: Opt notebooks
  default_host_subpath: anaconda3-opt-notebooks
