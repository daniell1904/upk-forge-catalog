id: stirling-pdf
name: Stirling-PDF
version: 2.14.3
author: Stirling-PDF
category: System
description: Stirling PDF - Local hosted web based PDF editor
homepage: https://stirlingpdf.io
ugos:
  app_id: com.upkforge.docker.stirlingpdf
  version: 0.1.0
  port: 18080
  open_type: tab
  tag_type: system
volumes:
- container_path: /configs
  label: Configs
  user_chosen: false
  default_host_subpath: config
- container_path: /customFiles
  label: CustomFiles
  user_chosen: false
  default_host_subpath: data
