id: cloudbeaver
name: CloudBeaver
author: joaobosconff
category: Developer
description: CloudBeaver is a web-based database GUI tool which provides rich web interface. You can use it to manage PostgreSQL, MySQL, MariaDB, SQL Server, Oracle, DB2, Firebird, H2, Trino.
homepage: https://dbeaver.com/download/cloudbeaver/
source_code: https://github.com/dbeaver/cloudbeaver
ugos:
  app_id: com.upkforge.docker.cloudbeaver
  version: 0.1.0
  port: 8978
  open_type: tab
  tag_type: devtool
parameters:
- key: VOL_1
  label: Opt cloudbeaver workspace folder
  help: Folder on the NAS for CloudBeaver's opt cloudbeaver workspace. It is mounted into the container at /opt/cloudbeaver/workspace; CloudBeaver has full read and write access to it.
  label_de: Opt cloudbeaver workspace-Ordner
  help_de: Ordner auf der NAS für CloudBeavers Opt cloudbeaver workspace. Wird im Container unter /opt/cloudbeaver/workspace eingebunden; CloudBeaver hat vollen Lese- und Schreibzugriff darauf.
  type: path
volumes:
- container_path: /opt/cloudbeaver/workspace
  label: Opt cloudbeaver workspace
  default_host_subpath: cloudbeaver-opt-cloudbeaver-workspace
