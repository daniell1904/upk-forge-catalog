services:
  semaphore:
    image: semaphoreui/semaphore:v2.19.14
    restart: unless-stopped
    ports:
      - 3000:3000
    volumes:
      - ${VOL_1}:/etc/semaphore
      - ${VOL_2}:/var/lib/semaphore
    environment:
      - SEMAPHORE_DB_USER=${SEMAPHORE_DB_PASS}
      - SEMAPHORE_DB_PASS=${SEMAPHORE_DB_PASS}
      - SEMAPHORE_DB_HOST=semaphore-db
      - SEMAPHORE_DB_PORT=3306
      - SEMAPHORE_DB_DIALECT=mysql
      - SEMAPHORE_DB=${SEMAPHORE_DB_PASS}
      - SEMAPHORE_ADMIN_PASSWORD=${SEMAPHORE_ADMIN_PASSWORD}
      - SEMAPHORE_ADMIN_NAME=admin
      - SEMAPHORE_ADMIN_EMAIL=admin@example.com
      - SEMAPHORE_ADMIN=admin
      - TZ=UTC
  semaphore-db:
    image: mysql:26.7.0
    restart: unless-stopped
    volumes:
      - ${VOL_3}:/var/lib/mysql
    environment:
      - MYSQL_RANDOM_ROOT_PASSWORD=${MYSQL_RANDOM_ROOT_PASSWORD}
      - MYSQL_DATABASE=${SEMAPHORE_DB_PASS}
      - MYSQL_USER=${SEMAPHORE_DB_PASS}
      - MYSQL_PASSWORD=${SEMAPHORE_DB_PASS}
