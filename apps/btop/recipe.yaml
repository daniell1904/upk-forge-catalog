id: btop
name: btop
author: Community
category: Others
description: A monitor of resources. Software made by Aristocratos at https://github.com/aristocratos/btop
warnings:
- service is privileged
ugos:
  app_id: com.upkforge.docker.btop
  version: 0.1.0
  port: 7681
  open_type: tab
  tag_type: utility
parameters:
- key: VOL_1
  label: Root .config btop folder
  help: Folder on the NAS for btop's root .config btop. It is mounted into the container at /root/.config/btop; btop has full read and write access to it.
  label_de: Root .config btop-Ordner
  help_de: Ordner auf der NAS für btops Root .config btop. Wird im Container unter /root/.config/btop eingebunden; btop hat vollen Lese- und Schreibzugriff darauf.
  type: path
- key: GOTTY_AUTH_PASS
  label: GOTTY AUTH PASS
  type: string
volumes:
- container_path: /root/.config/btop
  label: Root .config btop
  default_host_subpath: btop-root-config-btop
