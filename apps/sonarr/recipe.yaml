id: sonarr
name: Sonarr
author: Team
category: Media
description: Sonarr is a PVR for Usenet and BitTorrent users. It can monitor multiple RSS feeds for new episodes of your favorite shows and will grab, sort and rename them. It can also be configured to automatically upgrade the quality of files already downloaded when a better quality format becomes available.
homepage: https://sonarr.tv
source_code: https://github.com/Sonarr/Sonarr
ugos:
  app_id: com.upkforge.docker.sonarr
  version: 0.1.0
  port: 8989
  open_type: tab
  tag_type: media
parameters:
- key: VOL_1
  label: Config folder
  help: Folder on the NAS for Sonarr's config. It is mounted into the container at /config; Sonarr has full read and write access to it.
  label_de: Konfiguration-Ordner
  help_de: Ordner auf der NAS für Sonarrs Konfiguration. Wird im Container unter /config eingebunden; Sonarr hat vollen Lese- und Schreibzugriff darauf.
  type: path
- key: VOL_2
  label: Tv folder
  help: Folder on the NAS for Sonarr's tv. It is mounted into the container at /tv; Sonarr has full read and write access to it.
  label_de: TV-Ordner
  help_de: Ordner auf der NAS für Sonarrs TV. Wird im Container unter /tv eingebunden; Sonarr hat vollen Lese- und Schreibzugriff darauf.
  type: path
- key: VOL_3
  label: Downloads folder
  help: Folder on the NAS for Sonarr's downloads. It is mounted into the container at /downloads; Sonarr has full read and write access to it.
  label_de: Downloads-Ordner
  help_de: Ordner auf der NAS für Sonarrs Downloads. Wird im Container unter /downloads eingebunden; Sonarr hat vollen Lese- und Schreibzugriff darauf.
  type: path
volumes:
- container_path: /config
  label: Config
  default_host_subpath: sonarr-config
- container_path: /tv
  label: Tv
  default_host_subpath: sonarr-tv
- container_path: /downloads
  label: Downloads
  default_host_subpath: sonarr-downloads
