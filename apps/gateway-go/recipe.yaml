id: gateway-go
name: gateway-go
author: iotserv
category: Networking
description: A fast reverse proxy to help you expose a local server behind a NAT or firewall to your client, remote access all your / apps. Use OpenIoTHub to scan the following QR code add a gateway,then add host,add / host's web page port,finally, enjoy remote control
source_code: https://github.com/OpenIoTHub/gateway-go
warnings:
- service uses host networking
ugos:
  app_id: com.upkforge.docker.gatewaygo
  version: 0.1.0
  port: 34323
  open_type: tab
  tag_type: utility
parameters:
- key: VOL_1
  label: Root folder
  help: Folder on the NAS for gateway-go's root. It is mounted into the container at /root; gateway-go has full read and write access to it.
  type: path
volumes:
- container_path: /root
  label: Root
  default_host_subpath: gateway-go-root
