services:
  openhab:
    image: openhab/openhab:5.1.4
    restart: unless-stopped
    network_mode: host
    volumes:
      - /etc/localtime:/etc/localtime
      - /etc/timezone:/etc/timezone
      - ./addons:/openhab/addons
      - ./conf:/openhab/conf
      - ./userdata:/openhab/userdata
    environment:
      - CRYPTO_POLICY=unlimited
      - PGID=1000
      - PUID=1000
