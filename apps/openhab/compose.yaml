services:
  openhab:
    image: openhab/openhab:5.2.1
    restart: unless-stopped
    network_mode: host
    volumes:
      - /etc/localtime:/etc/localtime
      - /etc/timezone:/etc/timezone
      - ${VOL_1}:/openhab/addons
      - ${VOL_2}:/openhab/conf
      - ${VOL_3}:/openhab/userdata
    environment:
      - CRYPTO_POLICY=unlimited
      - PGID=1000
      - PUID=1000
