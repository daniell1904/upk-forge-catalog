id: music-assistant
name: Music Assistant
author: Tofil
category: Home
description: Music Assistant is a music library manager for your offline and online music sources which can easily stream your favourite music to a wide range of supported players and be combined with the power of Home Assistant!
warnings:
- service uses host networking
- 'service adds capabilities: SYS_ADMIN, DAC_READ_SEARCH'
ugos:
  app_id: com.upkforge.docker.musicassistant
  version: 0.1.0
  port: 8095
  open_type: tab
  tag_type: utility
parameters:
- key: VOL_1
  label: Data folder
  help: Folder on the NAS for Music Assistant's data. It is mounted into the container at /data; Music Assistant has full read and write access to it.
  label_de: Daten-Ordner
  help_de: Ordner auf der NAS für Music Assistants Daten. Wird im Container unter /data eingebunden; Music Assistant hat vollen Lese- und Schreibzugriff darauf.
  type: path
volumes:
- container_path: /data
  label: Data
  default_host_subpath: music-assistant-server-data
