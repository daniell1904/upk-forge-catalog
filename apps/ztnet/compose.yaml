services:
  ztnet:
    image: sinamics/ztnet:0.7.18
    restart: unless-stopped
    ports:
      - 3050:3000
    volumes:
      - ./ztnet-var-lib-zerotier-one:/var/lib/zerotier-one
    environment:
      - ZT_ADDR=http://172.17.0.1:9993
      - POSTGRES_HOST=ztnet-postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=ztnet
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=ztnet
      - NEXTAUTH_URL=http://0.0.0.0:3050
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL_INTERNAL=http://ztnet:3000
  ztnet-postgres:
    image: postgres:15.2-alpine
    restart: unless-stopped
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=ztnet
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=ztnet
