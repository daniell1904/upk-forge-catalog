id: blinko
name: Blinko
author: blinkospace
category: Productivity
description: >-
  Blinko is an open-source personal knowledge management and information recording platform, focused on providing users with a lightweight, efficient, and scalable note-taking and knowledge organization experience. Through modular design and a modern technology stack, it enables users to quickly capture ideas, organize knowledge, and build their own information system.


  The project emphasizes simplicity and customizability, supporting flexible combinations of various content types (text, tags, links, etc.), while its clear structured design helps users efficiently retrieve and connect information. Blinko also provides excellent extensibility, making it easy for developers to customize and enhance functionality according to their needs.


  In practical use, Blinko balances usability and functionality, offering a smooth experience for daily note-taking, knowledge accumulation, or project document management - an ideal knowledge tool for long-term personal growth.


  **Main features:**


  - Lightweight note system for quick content recording and editing

  - Tags and structured organization to improve information retrieval efficiency

  - Support for multiple content types (text, links, etc.)

  - Extensible architecture for custom functionality and plugin development

  - Clean interface design focused on content rather than complex operations


  **Learn more:**


  - [Blinko GitHub](https://github.com/blinkospace/blinko)
homepage: https://blinko.space/
source_code: https://github.com/blinkospace/blinko
ugos:
  app_id: com.upkforge.docker.blinko
  version: 0.1.0
  port: 1111
  open_type: tab
  tag_type: utility
parameters:
- key: VOL_1
  label: App .blinko folder
  help: Folder on the NAS for Blinko's app .blinko. It is mounted into the container at /app/.blinko; Blinko has full read and write access to it.
  label_de: App .blinko-Ordner
  help_de: Ordner auf der NAS für Blinkos App .blinko. Wird im Container unter /app/.blinko eingebunden; Blinko hat vollen Lese- und Schreibzugriff darauf.
  type: path
- key: VOL_2
  label: Var lib postgresql data folder
  help: Folder on the NAS for Blinko's var lib postgresql data. It is mounted into the container at /var/lib/postgresql/data; Blinko has full read and write access to it.
  label_de: Var lib postgresql Daten-Ordner
  help_de: Ordner auf der NAS für Blinkos Var lib postgresql Daten. Wird im Container unter /var/lib/postgresql/data eingebunden; Blinko hat vollen Lese- und Schreibzugriff darauf.
  type: path
- key: NEXTAUTH_SECRET
  label: NEXTAUTH SECRET
  type: password
- key: POSTGRES_PASSWORD
  label: POSTGRES PASSWORD
  type: password
volumes:
- container_path: /app/.blinko
  label: App .blinko
  default_host_subpath: blinko-app-blinko
- container_path: /var/lib/postgresql/data
  label: Var lib postgresql data
  default_host_subpath: blinko-postgres-var-lib-postgresql-data
