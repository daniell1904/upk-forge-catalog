services:
  farmos-v4:
    image: farmos/farmos:4.0.5
    restart: unless-stopped
    ports:
      - 8083:80
    volumes:
      - ${VOL_1}:/opt/drupal/web/sites
  farmos-v4-db:
    image: mariadb:10.6@sha256:114d40be36852d0a019afd8458f7e1cc63fd300403b115b1f32e31130d5f671b
    restart: unless-stopped
    ports:
      - 3307:3306
    volumes:
      - ${VOL_2}:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=app_farmos
      - MYSQL_USER=farmos
      - MYSQL_PASSWORD=${MYSQL_ROOT_PASSWORD}
