id: farmos-v4
name: FarmOS v4
author: Community
category: Social
description: farmOS is a web-based application for farm management, planning, and record keeping. It is developed by a community of volunteers and aims to provide a standard platform for farmers, developers, and researchers to build upon.
ugos:
  app_id: com.upkforge.docker.farmosv4
  version: 0.1.0
  port: 8083
  open_type: tab
  tag_type: utility
parameters:
- key: VOL_1
  label: Opt drupal web sites folder
  help: Folder on the NAS for FarmOS v4's opt drupal web sites. It is mounted into the container at /opt/drupal/web/sites; FarmOS v4 has full read and write access to it.
  type: path
- key: VOL_2
  label: Var lib mysql folder
  help: Folder on the NAS for FarmOS v4's var lib mysql. It is mounted into the container at /var/lib/mysql; FarmOS v4 has full read and write access to it.
  type: path
- key: MYSQL_ROOT_PASSWORD
  label: MYSQL ROOT PASSWORD
  type: password
volumes:
- container_path: /opt/drupal/web/sites
  label: Opt drupal web sites
  default_host_subpath: farmos-v4-opt-drupal-web-sites
- container_path: /var/lib/mysql
  label: Var lib mysql
  default_host_subpath: farmos-v4-db-var-lib-mysql
