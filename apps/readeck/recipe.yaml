id: readeck
name: Readeck
author: Community
category: Productivity
description: Readeck is a simple web application that lets you save the precious readable content of web pages you like and want to keep forever. It is a self-hosted alternative to Instapaper and Wallabag with a modern interface and powerful features for managing your bookmarks and reading list.
ugos:
  app_id: com.upkforge.docker.readeck
  version: 0.1.0
  port: 8000
  open_type: tab
  tag_type: utility
parameters:
- key: VOL_1
  label: Readeck folder
  help: Folder on the NAS for Readeck's readeck. It is mounted into the container at /readeck; Readeck has full read and write access to it.
  label_de: Readeck-Ordner
  help_de: Ordner auf der NAS für Readecks Readeck. Wird im Container unter /readeck eingebunden; Readeck hat vollen Lese- und Schreibzugriff darauf.
  type: path
volumes:
- container_path: /readeck
  label: Readeck
  default_host_subpath: readeck-readeck
