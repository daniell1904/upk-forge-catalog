id: discopanel
name: DiscoPanel
author: Community
category: Developer
description: DiscoPanel is a game server panel for Minecraft. It provides a clean interface for creating and managing Minecraft servers, installing modpacks, and running each server as its own Docker container. Features include modpack browsing and installation, per-server configuration, backups, and real-time server management.
warnings:
- service uses host networking
ugos:
  app_id: com.upkforge.docker.discopanel
  version: 0.1.0
  port: 8080
  open_type: tab
  tag_type: devtool
parameters:
- key: VOL_1
  label: Var run docker.sock folder
  help: Folder on the NAS for DiscoPanel's var run docker.sock. It is mounted into the container at /var/run/docker.sock; DiscoPanel has full read and write access to it.
  type: path
- key: VOL_2
  label: App data folder
  help: Folder on the NAS for DiscoPanel's app data. It is mounted into the container at /app/data; DiscoPanel has full read and write access to it.
  type: path
- key: VOL_3
  label: App backups folder
  help: Folder on the NAS for DiscoPanel's app backups. It is mounted into the container at /app/backups; DiscoPanel has full read and write access to it.
  type: path
- key: VOL_4
  label: App tmp folder
  help: Folder on the NAS for DiscoPanel's app tmp. It is mounted into the container at /app/tmp; DiscoPanel has full read and write access to it.
  type: path
volumes:
- container_path: /var/run/docker.sock
  label: Var run docker.sock
  default_host_subpath: discopanel-var-run-docker-sock
- container_path: /app/data
  label: App data
  default_host_subpath: discopanel-app-data
- container_path: /app/backups
  label: App backups
  default_host_subpath: discopanel-app-backups
- container_path: /app/tmp
  label: App tmp
  default_host_subpath: discopanel-app-tmp
