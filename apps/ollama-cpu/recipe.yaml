id: ollama-cpu
name: Ollama - CPU
author: Community
category: AI
description: Get up and running with Llama 3, Mistral, Gemma, and other large language models.
ugos:
  app_id: com.upkforge.docker.ollamacpu
  version: 0.1.0
  port: 11434
  open_type: tab
  tag_type: utility
parameters:
- key: VOL_1
  label: Root .ollama folder
  help: Folder on the NAS for Ollama - CPU's root .ollama. It is mounted into the container at /root/.ollama; Ollama - CPU has full read and write access to it.
  type: path
volumes:
- container_path: /root/.ollama
  label: Root .ollama
  default_host_subpath: ollama-cpu-root-ollama
