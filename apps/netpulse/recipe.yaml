id: netpulse
name: NetPulse
author: Community
category: Networking
description: A self-hosted network monitoring dashboard that runs real Ookla speedtests on a schedule, pings continuously to track uptime, and shows the history as graphs you can actually reflect on — not just a live number that resets every refresh.
warnings:
- service uses host networking
ugos:
  app_id: com.upkforge.docker.netpulse
  version: 0.1.0
  port: 8077
  open_type: tab
  tag_type: utility
parameters:
- key: VOL_1
  label: Data folder
  help: Folder on the NAS for NetPulse's data. It is mounted into the container at /data; NetPulse has full read and write access to it.
  label_de: Daten-Ordner
  help_de: Ordner auf der NAS für NetPulses Daten. Wird im Container unter /data eingebunden; NetPulse hat vollen Lese- und Schreibzugriff darauf.
  type: path
- key: NETPULSE_PASSWORD
  label: NETPULSE PASSWORD
  type: password
volumes:
- container_path: /data
  label: Data
  default_host_subpath: netpulse-data
