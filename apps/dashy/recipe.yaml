id: dashy
name: Dashy (Legacy)
author: Community
category: Others
description: Dashy helps you organize your self-hosted services by making them accessible from a single place
ugos:
  app_id: com.upkforge.docker.dashy
  version: 0.1.0
  port: 4000
  open_type: tab
  tag_type: utility
parameters:
- key: VOL_1
  label: App public folder
  help: Folder on the NAS for Dashy (Legacy)'s app public. It is mounted into the container at /app/public; Dashy (Legacy) has full read and write access to it.
  type: path
volumes:
- container_path: /app/public
  label: App public
  default_host_subpath: dashy-app-public
