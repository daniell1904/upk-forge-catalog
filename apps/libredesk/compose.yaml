services:
  libredesk:
    image: libredesk/libredesk:v0.7.4-alpha@sha256:61dc7cea8d46d40d75b90a9ea0e4276d7d3092388e36ab7578049784fb96b57e
    restart: unless-stopped
    command:
      - sh
      - -c
      - ./libredesk --install --idempotent-install --yes --config /libredesk/config/config.toml && ./libredesk --upgrade --yes --config /libredesk/config/config.toml && ./libredesk --config /libredesk/config/config.toml
    ports:
      - 9000:9000
    volumes:
      - ./uploads:/libredesk/uploads
      - ./config:/libredesk/config
    environment:
      - LIBREDESK_SYSTEM_USER_PASSWORD=${LIBREDESK_SYSTEM_USER_PASSWORD}
  libredesk-db:
    image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    restart: unless-stopped
    ports:
      - 5432:5432
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${POSTGRES_PASSWORD}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=app_libredesk
  libredesk-redis:
    image: redis:7.4.6-alpine@sha256:7a7c6b5c49a6896d0a58ee0c6dc0dcabe14f30f0a2f7d2d1362d276fa2d43166
    restart: unless-stopped
    ports:
      - 6379:6379
    volumes:
      - ./data/redis:/data
