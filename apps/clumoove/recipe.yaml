id: clumoove
name: Clumoove
author: Marcel Meyer
category: Productivity
description: >-
  Clumoove is a modern, self-hosted cloud data migration and synchronization platform for files, calendars, and contacts.


  Easily connect, transfer, and synchronize data between cloud storage providers including Nextcloud, Google Drive, Dropbox, OneDrive, HiDrive, S3, WebDAV, SMB, SFTP, FTP, Immich, Seafile, Koofr, MEGA, and local storage.


  Key Features:

  - Zero-disk streaming transfers (no local temporary storage retention during migration)

  - Multi-threaded background migrations and cron-based synchronization schedules

  - Robust 3-way hash integrity verification & flexible conflict resolution

  - Integrated cloud file manager with multi-format previews and thumbnails

  - Multi-channel notification delivery (Gotify, ntfy, Telegram, Discord, Email)

  - Enterprise-grade security with AES-256-GCM encryption, TOTP 2FA, and audit logging
homepage: https://clumoove.com
source_code: https://github.com/xXRoxXeRXx/clumoove
ugos:
  app_id: com.upkforge.docker.clumoove
  version: 0.1.0
  port: 8380
  open_type: tab
  tag_type: utility
parameters:
- key: VOL_1
  label: Clumoove folder
  help: Folder on the NAS for Clumoove's clumoove. It is mounted into the container at /clumoove; Clumoove has full read and write access to it.
  type: path
- key: VOL_2
  label: Clumoove folder
  help: Folder on the NAS for Clumoove's clumoove. It is mounted into the container at /clumoove; Clumoove has full read and write access to it.
  type: path
- key: VOL_3
  label: Var lib postgresql data folder
  help: Folder on the NAS for Clumoove's var lib postgresql data. It is mounted into the container at /var/lib/postgresql/data; Clumoove has full read and write access to it.
  type: path
- key: VOL_4
  label: Data folder
  help: Folder on the NAS for Clumoove's data. It is mounted into the container at /data; Clumoove has full read and write access to it.
  type: path
- key: ENCRYPTION_SECRET_KEY
  label: ENCRYPTION SECRET KEY
  type: password
- key: JWT_SECRET_KEY
  label: JWT SECRET KEY
  type: password
- key: POSTGRES_PASSWORD
  label: POSTGRES PASSWORD
  type: password
volumes:
- container_path: /clumoove
  label: Clumoove
  default_host_subpath: api-backend-clumoove
- container_path: /clumoove
  label: Clumoove
  default_host_subpath: migration-worker-clumoove
- container_path: /var/lib/postgresql/data
  label: Var lib postgresql data
  default_host_subpath: postgres-db-var-lib-postgresql-data
- container_path: /data
  label: Data
  default_host_subpath: redis-queue-data
