id: myspeed
name: MySpeed
author: joaobosconff
category: Networking
description: MySpeed is a speed test analysis software that stores the speed of your internet for up to 30 days. This can also be useful if you want to know when your network might have drops or if you want to check if your internet matches the booked values from your contract.
homepage: https://myspeed.dev
source_code: https://github.com/gnmyt/myspeed
ugos:
  app_id: com.upkforge.docker.myspeed
  version: 0.1.0
  port: 5216
  open_type: tab
  tag_type: utility
parameters:
- key: VOL_1
  label: Myspeed data folder
  help: Folder on the NAS for MySpeed's myspeed data. It is mounted into the container at /myspeed/data; MySpeed has full read and write access to it.
  label_de: Myspeed Daten-Ordner
  help_de: Ordner auf der NAS für MySpeeds Myspeed Daten. Wird im Container unter /myspeed/data eingebunden; MySpeed hat vollen Lese- und Schreibzugriff darauf.
  type: path
volumes:
- container_path: /myspeed/data
  label: Myspeed data
  default_host_subpath: myspeed-myspeed-data
