id: alist-sync
name: Alist-Sync
author: xjxjin
category: Productivity
description: Alist-Sync is a storage synchronization tool based on the Web interface. It can achieve data synchronization and mutual backup among multiple network disks, and also has practical functions such as multi-task management, scheduled synchronization and difference handling.
source_code: https://github.com/xjxjin/alist-sync
ugos:
  app_id: com.upkforge.docker.alistsync
  version: 0.1.0
  port: 52441
  open_type: tab
  tag_type: utility
parameters:
- key: VOL_1
  label: App data folder
  help: Directory where the alist-sync application stores its data.
  label_de: App Daten-Ordner
  help_de: Ordner auf der NAS für Alist-Syncs App Daten. Wird im Container unter /app/data eingebunden; Alist-Sync hat vollen Lese- und Schreibzugriff darauf.
  type: path
volumes:
- container_path: /app/data
  label: App data
  default_host_subpath: alist-sync-app-data
