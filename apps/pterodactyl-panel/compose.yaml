services:
  app:
    image: ghcr.io/pterodactyl/panel:v1.15.1
    restart: unless-stopped
    ports:
      - 1180:80
      - 11443:443
    volumes:
      - ${VOL_1}:/app/var/
      - ${VOL_2}:/etc/nginx/http.d/
      - ${VOL_3}:/etc/letsencrypt/
      - ${VOL_4}:/app/storage/logs
    environment:
      - APP_URL=http://example.com
      - APP_TIMEZONE=UTC
      - APP_SERVICE_AUTHOR=noreply@example.com
      - MAIL_FROM=noreply@example.com
      - MAIL_DRIVER=smtp
      - MAIL_HOST=mail
      - MAIL_PORT=1025
      - MAIL_USERNAME=
      - MAIL_PASSWORD=
      - MAIL_ENCRYPTION=true
      - APP_ENV=production
      - APP_ENVIRONMENT_ONLY=false
      - CACHE_DRIVER=redis
      - SESSION_DRIVER=redis
      - QUEUE_DRIVER=redis
      - REDIS_HOST=cache
      - DB_HOST=database
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_PORT=3306
      - DB_CONNECTION=mariadb
  database:
    image: mariadb:12.3.3
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - ${VOL_5}:/var/lib/mysql
    environment:
      - MYSQL_DATABASE=panel
      - MYSQL_USER=pterodactyl
      - MYSQL_PASSWORD=${DB_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
  cache:
    image: redis:8.2.2-alpine@sha256:1c78f5e7512cc8b22b0edc95c20e7abd9e1fd832e5dfd5c3c6b59ce82fb238d0
    restart: unless-stopped
