id: dockpeek
name: Dockpeek
author: Community
category: Developer
description: A lightweight, self-hosted Docker dashboard that provides quick access to all running containers and their exposed ports with one-click access to web apps.
ugos:
  app_id: com.upkforge.docker.dockpeek
  version: 0.1.0
  port: 3420
  open_type: tab
  tag_type: devtool
parameters:
- key: VOL_1
  label: Var run docker.sock folder
  help: Folder on the NAS for Dockpeek's var run docker.sock. It is mounted into the container at /var/run/docker.sock; Dockpeek has full read and write access to it.
  type: path
- key: SECRET_KEY
  label: SECRET KEY
  type: password
- key: PASSWORD
  label: PASSWORD
  type: password
volumes:
- container_path: /var/run/docker.sock
  label: Var run docker.sock
  default_host_subpath: dockpeek-var-run-docker-sock
