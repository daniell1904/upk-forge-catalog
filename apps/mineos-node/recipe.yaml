id: mineos-node
name: MineOS
author: Chàra Rose
category: Media
description: MineOS is a server front-end to ease managing Minecraft administrative tasks. This iteration using Node.js aims to enhance previous MineOS scripts (Python-based), by leveraging the event-triggering, asyncronous model of Node.JS and websockets.
homepage: https://www.mineos.net/
source_code: https://github.com/hexparrot/mineos-node
ugos:
  app_id: com.upkforge.docker.mineosnode
  version: 0.1.0
  port: 8444
  open_type: tab
  tag_type: media
parameters:
- key: VOL_1
  label: Var games minecraft folder
  help: Folder on the NAS for MineOS's var games minecraft. It is mounted into the container at /var/games/minecraft; MineOS has full read and write access to it.
  label_de: Var games minecraft-Ordner
  help_de: Ordner auf der NAS für MineOSs Var games minecraft. Wird im Container unter /var/games/minecraft eingebunden; MineOS hat vollen Lese- und Schreibzugriff darauf.
  type: path
- key: USER_PASSWORD
  label: USER PASSWORD
  type: password
volumes:
- container_path: /var/games/minecraft
  label: Var games minecraft
  default_host_subpath: mineos-var-games-minecraft
