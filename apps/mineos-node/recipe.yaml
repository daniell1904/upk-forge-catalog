id: mineos-node
name: MineOS
author: Chàra Rose
category: Media
description: MineOS is a server front-end to ease managing Minecraft administrative tasks. This iteration using Node.js aims to enhance previous MineOS scripts (Python-based), by leveraging the event-triggering, asyncronous model of Node.JS and websockets.
homepage: https://www.mineos.net/
source_code: https://github.com/hexparrot/mineos-node
ugos:
  app_id: com.upkforge.docker.mineosnode
  version: 0.1.0
  port: 8444
  open_type: tab
  tag_type: media
volumes:
- container_path: /var/games/minecraft
  label: Var games minecraft
  user_chosen: false
  default_host_subpath: mineos-var-games-minecraft
