services:
  openvpn-as:
    image: openvpn/openvpn-as:2.13.1-d8cdeb9c-Ubuntu22@sha256:609aa2238acef1cb3b277c1e7f293e21da1033fb2eb1b52f51e8b22d6ee7227c
    restart: unless-stopped
    network_mode: bridge
    ports:
      - 943:943
      - 443:443
      - 1194:1194
    volumes:
      - ${VOL_1}:/openvpn
    environment:
      - PGID=1000
      - PUID=1000
      - TZ=Europe/Rome
