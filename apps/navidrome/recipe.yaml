id: navidrome
name: Navidrome
author: The Navidrome Authors
category: Media
description: Navidrome is an open source web-based music collection server and streamer. It gives you freedom to listen to your music collection from any browser or mobile device. It's like your personal Spotify!
homepage: https://www.navidrome.org
source_code: https://github.com/navidrome/navidrome
ugos:
  app_id: com.upkforge.docker.navidrome
  version: 0.1.0
  port: 4533
  open_type: tab
  tag_type: media
parameters:
- key: VOL_1
  label: Data folder
  help: Folder on the NAS for Navidrome's data. It is mounted into the container at /data; Navidrome has full read and write access to it.
  label_de: Daten-Ordner
  help_de: Ordner auf der NAS für Navidromes Daten. Wird im Container unter /data eingebunden; Navidrome hat vollen Lese- und Schreibzugriff darauf.
  type: path
- key: VOL_2
  label: Music folder
  help: Folder on the NAS for Navidrome's music. It is mounted into the container at /music; Navidrome has full read and write access to it.
  label_de: Musik-Ordner
  help_de: Ordner auf der NAS für Navidromes Musik. Wird im Container unter /music eingebunden; Navidrome hat vollen Lese- und Schreibzugriff darauf.
  type: path
volumes:
- container_path: /data
  label: Data
  default_host_subpath: navidrome-data
- container_path: /music
  label: Music
  default_host_subpath: navidrome-music
