services:
  komf:
    image: sndxr/komf:2.0.1
    restart: unless-stopped
    ports:
      - 8085:8085
    volumes:
      - ${VOL_1}:/config
    environment:
      - KOMF_KOMGA_BASE_URI=http://komga:25600
      - KOMF_KOMGA_USER=admin@example.org
      - KOMF_KOMGA_PASSWORD=${KOMF_KOMGA_PASSWORD}
      - KOMF_KAVITA_BASE_URI=http://kavita:5000
      - KOMF_KAVITA_API_KEY=${KOMF_KAVITA_API_KEY}
      - KOMF_LOG_LEVEL=INFO
