id: dashdot
name: Dashdot
author: Community
category: Others
description: About A simple, modern server dashboard, primarily used by smaller private servers.
warnings:
- service is privileged
ugos:
  app_id: com.upkforge.docker.dashdot
  version: 0.1.0
  port: 3001
  open_type: tab
  tag_type: utility
parameters:
- key: VOL_1
  label: Mnt host folder
  help: Folder on the NAS for Dashdot's mnt host. It is mounted into the container at /mnt/host; Dashdot has full read and write access to it.
  label_de: Mnt host-Ordner
  help_de: Ordner auf der NAS für Dashdots Mnt host. Wird im Container unter /mnt/host eingebunden; Dashdot hat vollen Lese- und Schreibzugriff darauf.
  type: path
volumes:
- container_path: /mnt/host
  label: Mnt host
  default_host_subpath: app-mnt-host
