id: ddns-updater
name: ddns-updater
author: rstuhlmuller
category: Networking
description: Program to keep DNS A and/or AAAA records updated for multiple DNS providers
source_code: https://github.com/qdm12/ddns-updater
ugos:
  app_id: com.upkforge.docker.ddnsupdater
  version: 0.1.0
  port: 8000
  open_type: tab
  tag_type: utility
parameters:
- key: VOL_1
  label: Updater data folder
  help: Folder on the NAS for ddns-updater's updater data. It is mounted into the container at /updater/data; ddns-updater has full read and write access to it.
  type: path
volumes:
- container_path: /updater/data
  label: Updater data
  default_host_subpath: ddns-updater-updater-data
