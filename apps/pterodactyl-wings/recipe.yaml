id: pterodactyl-wings
name: Pterodactyl Wings
author: Community
category: Developer
description: Wings is Pterodactyl's server control plane, built for the rapidly changing gaming industry and designed to be highly performant and secure. Wings provides an HTTP API allowing you to interface directly with running server instances, fetch server logs, generate backups, and control all aspects of the server lifecycle.
ugos:
  app_id: com.upkforge.docker.pterodactylwings
  version: 0.1.0
  port: 8080
  open_type: tab
  tag_type: devtool
parameters:
- key: VOL_1
  label: Var run docker.sock folder
  help: Folder on the NAS for Pterodactyl Wings's var run docker.sock. It is mounted into the container at /var/run/docker.sock; Pterodactyl Wings has full read and write access to it.
  type: path
- key: VOL_2
  label: Var lib docker containers folder
  help: Folder on the NAS for Pterodactyl Wings's var lib docker containers. It is mounted into the container at /var/lib/docker/containers/; Pterodactyl Wings has full read and write access to it.
  type: path
- key: VOL_3
  label: Etc ssl certs folder
  help: Folder on the NAS for Pterodactyl Wings's etc ssl certs. It is mounted into the container at /etc/ssl/certs; Pterodactyl Wings has full read and write access to it.
  type: path
- key: VOL_4
  label: Etc pterodactyl folder
  help: Folder on the NAS for Pterodactyl Wings's etc pterodactyl. It is mounted into the container at /etc/pterodactyl/; Pterodactyl Wings has full read and write access to it.
  type: path
- key: VOL_5
  label: Var log pterodactyl folder
  help: Folder on the NAS for Pterodactyl Wings's var log pterodactyl. It is mounted into the container at /var/log/pterodactyl/; Pterodactyl Wings has full read and write access to it.
  type: path
- key: VOL_6
  label: Var lib pterodactyl folder
  help: Folder on the NAS for Pterodactyl Wings's var lib pterodactyl. It is mounted into the container at /var/lib/pterodactyl/; Pterodactyl Wings has full read and write access to it.
  type: path
volumes:
- container_path: /var/run/docker.sock
  label: Var run docker.sock
  default_host_subpath: app-var-run-docker-sock
- container_path: /var/lib/docker/containers/
  label: Var lib docker containers
  default_host_subpath: app-var-lib-docker-containers
- container_path: /etc/ssl/certs
  label: Etc ssl certs
  default_host_subpath: app-etc-ssl-certs
- container_path: /etc/pterodactyl/
  label: Etc pterodactyl
  default_host_subpath: app-etc-pterodactyl
- container_path: /var/log/pterodactyl/
  label: Var log pterodactyl
  default_host_subpath: app-var-log-pterodactyl
- container_path: /var/lib/pterodactyl/
  label: Var lib pterodactyl
  default_host_subpath: app-var-lib-pterodactyl
