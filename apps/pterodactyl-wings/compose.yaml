services:
  app:
    image: ghcr.io/pterodactyl/wings:v1.13.3
    restart: unless-stopped
    ports:
      - 8080:8080
      - 2022:2022
    volumes:
      - ${VOL_1}:/var/run/docker.sock
      - ${VOL_2}:/var/lib/docker/containers/
      - ${VOL_3}:/etc/ssl/certs
      - /tmp/pterodactyl:/tmp/pterodactyl/
      - ${VOL_4}:/etc/pterodactyl/
      - ${VOL_5}:/var/log/pterodactyl/
      - ${VOL_6}:/var/lib/pterodactyl/
    environment:
      - TZ=UTC
      - WINGS_UID=988
      - WINGS_GID=988
      - WINGS_USERNAME=pterodactyl
