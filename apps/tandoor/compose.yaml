services:
  tandoor:
    image: ghcr.io/tandoorrecipes/recipes:2.6.15
    restart: unless-stopped
    ports:
      - 8080:8080
    volumes:
      - ${VOL_1}:/opt/recipes/staticfiles
      - ${VOL_2}:/opt/recipes/mediafiles
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - DB_ENGINE=django.db.backends.postgresql
      - POSTGRES_HOST=tandoor-db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=tandoor
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=tandoordb
  tandoor-db:
    image: postgres:15-alpine@sha256:3d0f7584ed7d04e27fa050d6683a74746608faf21f202be78460d679cc56461f
    restart: unless-stopped
    volumes:
      - ${VOL_3}:/var/lib/postgresql/data
    environment:
      - POSTGRES_PORT=5432
      - POSTGRES_USER=tandoor
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=tandoordb
