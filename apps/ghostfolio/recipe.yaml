id: ghostfolio
name: Ghostfolio
author: Community
category: Others
description: "Open Source Wealth Management Software. Angular + NestJS + Prisma + Nx + TypeScript \U0001F90D"
ugos:
  app_id: com.upkforge.docker.ghostfolio
  version: 0.1.0
  port: 3333
  open_type: tab
  tag_type: utility
parameters:
- key: VOL_1
  label: Var lib postgresql data folder
  help: Folder on the NAS for Ghostfolio's var lib postgresql data. It is mounted into the container at /var/lib/postgresql/data; Ghostfolio has full read and write access to it.
  type: path
- key: VOL_2
  label: Data folder
  help: Folder on the NAS for Ghostfolio's data. It is mounted into the container at /data; Ghostfolio has full read and write access to it.
  type: path
- key: JWT_SECRET_KEY
  label: JWT SECRET KEY
  type: password
- key: POSTGRES_PASSWORD
  label: POSTGRES PASSWORD
  type: password
- key: REDIS_PASSWORD
  label: REDIS PASSWORD
  type: password
volumes:
- container_path: /var/lib/postgresql/data
  label: Var lib postgresql data
  default_host_subpath: ghostfolio-db-var-lib-postgresql-data
- container_path: /data
  label: Data
  default_host_subpath: ghostfolio-redis-data
