services:
  ghostfolio:
    image: ghostfolio/ghostfolio:3.69.0
    restart: unless-stopped
    ports:
      - 3333:3333
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=3333
      - ACCESS_TOKEN_SALT=5a7f9e0d-0e64-4c19-8279-bbe8b4c590f4
      - DATABASE_URL=postgresql://ghostfolio:apppassword@ghostfolio-db:5432/ghostfolio
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - POSTGRES_DB=ghostfolio
      - POSTGRES_USER=ghostfolio
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - REDIS_HOST=ghostfolio-redis
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_PORT=6379
  ghostfolio-db:
    image: postgres:15.4-alpine@sha256:35ce2187f2f7fb75e8e79493e13743596c21eb3789ff41ece145ae04d06e93a5
    restart: unless-stopped
    volumes:
      - ${VOL_1}:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=ghostfolio
      - POSTGRES_USER=ghostfolio
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - PGDATA=/var/lib/postgresql/data
  ghostfolio-redis:
    image: redis:7.4.6-alpine@sha256:7a7c6b5c49a6896d0a58ee0c6dc0dcabe14f30f0a2f7d2d1362d276fa2d43166
    restart: unless-stopped
    command: >
      --requirepass appredispassword
    volumes:
      - ${VOL_2}:/data
