id: netronome
name: Netronome
author: autobrr
category: Networking
description: Netronome is a complete network performance monitoring solution with speed tests, continuous packet-loss monitoring, distributed server agents, automated alerts, visualizations, and historical tracking.
homepage: https://netrono.me
source_code: https://github.com/autobrr/netronome
warnings:
- 'service adds capabilities: NET_RAW'
ugos:
  app_id: com.upkforge.docker.netronome
  version: 0.1.0
  port: 7575
  open_type: tab
  tag_type: utility
parameters:
- key: VOL_1
  label: Data folder
  help: Folder on the NAS for Netronome's data. It is mounted into the container at /data; Netronome has full read and write access to it.
  label_de: Daten-Ordner
  help_de: Ordner auf der NAS für Netronomes Daten. Wird im Container unter /data eingebunden; Netronome hat vollen Lese- und Schreibzugriff darauf.
  type: path
- key: config
  label: Config
  type: string
volumes:
- container_path: /data
  label: Data
  default_host_subpath: netronome-data
