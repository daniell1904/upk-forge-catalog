services:
  netronome:
    image: ghcr.io/autobrr/netronome:v0.14.0
    restart: unless-stopped
    command:
      - >-
        config=/data/.config/netronome/config.toml

        if [ ! -f "$$config" ]; then
          netronome generate-config
        fi

        exec netronome serve
    ports:
      - 7575:7575
    volumes:
      - ${VOL_1}:/data
    environment:
      - TZ=$TZ
      - NETRONOME__HOST=0.0.0.0
      - NETRONOME__PORT=7575
