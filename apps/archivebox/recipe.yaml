id: archivebox
name: ArchiveBox
author: ArchiveBox
category: Productivity
description: >-
  ArchiveBox is a powerful, self-hosted internet archiving solution that allows you to create your own personal archive of web pages, PDFs, videos, and more. It functions as a personal internet archive, saving content in multiple formats for long-term preservation.


  The system consists of multiple components:

  - **ArchiveBox**: The main application providing the web interface and archiving capabilities

  - **Sonic**: A fast search backend for full-text search across archived content

  - **ArchiveBox Scheduler**: A background service for scheduled archiving tasks

  - **NoVNC**: A web-based VNC client for browser-based archiving


  **Key Features:**

  - Save web pages in multiple formats (HTML, PDF, screenshots, etc.)

  - Full-text search across all archived content

  - Scheduled archiving of websites and RSS feeds

  - Browser-based archiving with NoVNC

  - User authentication and access control

  - Extract and save media files (videos, audio, PDFs, etc.)


  **Learn More:**

  - [ArchiveBox Official Website](https://archivebox.io)

  - [ArchiveBox GitHub Repository](https://github.com/ArchiveBox/ArchiveBox)

  - [ArchiveBox Documentation](https://github.com/ArchiveBox/ArchiveBox/wiki)
homepage: https://archivebox.io
source_code: https://github.com/ArchiveBox/ArchiveBox
ugos:
  app_id: com.upkforge.docker.archivebox
  version: 0.1.0
  port: 18010
  open_type: tab
  tag_type: utility
parameters:
- key: VOL_1
  label: Data folder
  help: Folder on the NAS for ArchiveBox's data. It is mounted into the container at /data; ArchiveBox has full read and write access to it.
  type: path
- key: VOL_2
  label: Data folder
  help: Folder on the NAS for ArchiveBox's data. It is mounted into the container at /data; ArchiveBox has full read and write access to it.
  type: path
- key: VOL_3
  label: Var lib sonic store folder
  help: Folder on the NAS for ArchiveBox's var lib sonic store. It is mounted into the container at /var/lib/sonic/store; ArchiveBox has full read and write access to it.
  type: path
- key: ADMIN_PASSWORD
  label: ADMIN PASSWORD
  type: password
- key: SEARCH_BACKEND_PASSWORD
  label: SEARCH BACKEND PASSWORD
  type: password
volumes:
- container_path: /data
  label: Data
  default_host_subpath: archivebox-data
- container_path: /data
  label: Data
  default_host_subpath: archivebox-scheduler-data
- container_path: /var/lib/sonic/store
  label: Var lib sonic store
  default_host_subpath: archivebox-sonic-var-lib-sonic-store
