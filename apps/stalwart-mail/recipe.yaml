id: stalwart-mail
name: Stalwart Mail
author: Community
category: Others
description: Stalwart Mail Server is an open-source mail server solution with JMAP, IMAP4, POP3, and SMTP support and a wide range of modern features. It is written in Rust and designed to be secure, fast, robust and scalable.
ugos:
  app_id: com.upkforge.docker.stalwartmail
  version: 0.1.0
  port: 8080
  open_type: tab
  tag_type: utility
parameters:
- key: VOL_1
  label: Opt stalwart folder
  help: Folder on the NAS for Stalwart Mail's opt stalwart. It is mounted into the container at /opt/stalwart; Stalwart Mail has full read and write access to it.
  label_de: Opt stalwart-Ordner
  help_de: Ordner auf der NAS für Stalwart Mails Opt stalwart. Wird im Container unter /opt/stalwart eingebunden; Stalwart Mail hat vollen Lese- und Schreibzugriff darauf.
  type: path
volumes:
- container_path: /opt/stalwart
  label: Opt stalwart
  default_host_subpath: stalwart-mail-opt-stalwart
