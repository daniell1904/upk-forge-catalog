id: overseerr
name: Overseerr
author: WisdomSky
category: Media
description: Overseerr is a free and open source software application for managing requests for your media library. It integrates with your existing services, such as Sonarr, Radarr, and Plex!
homepage: https://overseerr.dev
source_code: https://github.com/sct/overseerr
ugos:
  app_id: com.upkforge.docker.overseerr
  version: 0.1.0
  port: 5055
  open_type: tab
  tag_type: media
parameters:
- key: VOL_1
  label: Config folder
  help: Folder on the NAS for Overseerr's config. It is mounted into the container at /config; Overseerr has full read and write access to it.
  label_de: Konfiguration-Ordner
  help_de: Ordner auf der NAS für Overseerrs Konfiguration. Wird im Container unter /config eingebunden; Overseerr hat vollen Lese- und Schreibzugriff darauf.
  type: path
volumes:
- container_path: /config
  label: Config
  default_host_subpath: overseerr-config
