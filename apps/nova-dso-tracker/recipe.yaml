id: nova-dso-tracker
name: Nova DSO Tracker
author: mrantonSG
category: Media
description: Nova DSO Tracker is a tool for astrophotographers to track Deep Space Objects, check observability, and manage imaging sessions.
ugos:
  app_id: com.upkforge.docker.novadsotracker
  version: 0.1.0
  port: 5001
  open_type: tab
  tag_type: media
parameters:
- key: VOL_1
  label: App instance folder
  help: Folder on the NAS for Nova DSO Tracker's app instance. It is mounted into the container at /app/instance; Nova DSO Tracker has full read and write access to it.
  type: path
volumes:
- container_path: /app/instance
  label: App instance
  default_host_subpath: nova-app-instance
