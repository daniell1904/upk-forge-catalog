services:
  crafty:
    image: registry.gitlab.com/crafty-controller/crafty-4:4.10.8
    restart: unless-stopped
    ports:
      - 8111:8443
      - 8112:8123
      - 19132:19132
    volumes:
      - ${VOL_1}:/crafty/backups
      - ${VOL_2}:/crafty/logs
      - ${VOL_3}:/crafty/servers
      - ${VOL_4}:/crafty/app/config
      - ${VOL_5}:/crafty/import
    environment:
      - TZ=Etc/UTC
