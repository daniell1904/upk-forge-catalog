services:
  syncthing:
    image: linuxserver/syncthing:2.1.5
    restart: unless-stopped
    network_mode: bridge
    ports:
      - 8384:8384
      - 22000:22000
      - 22000:22000
      - 21027:21027
    volumes:
      - ${VOL_1}:/config
      - ${VOL_2}:/DATA
    environment:
      - PGID=1000
      - PUID=1000
      - TZ=$TZ
