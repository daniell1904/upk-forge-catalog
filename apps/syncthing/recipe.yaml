id: syncthing
name: Syncthing
author: Team
category: Productivity
description: "# Unlocking the True Potential of Data Backup Say goodbye to traditional cloud backup limitations and embrace the future with Syncthing. Unlike conventional cloud services that often come with privacy concerns and storage restrictions, Syncthing provides a secure, real-time file synchronization solution that keeps your data exclusively in your hands. Whether you're syncing work documents or personal photos, you have complete control over where and how your files are stored and shared. # Features That Make a Difference Syncthing offers a seamless, user-friendly experience with powerful features designed for everyday users. Enjoy continuous file synchronization between multiple devices without any subscription fees. Experience peace of mind knowing that your data is encrypted and protected from unauthorized access. Syncthing’s open-source nature means no hidden costs, providing a truly transparent and cost-effective solution for your file management needs. # The Power of Syncthing on Deploying Syncthing on private cloud devices unlocks unparalleled convenience: enjoy unlimited storage capacity, ensure the privacy of your data, and benefit from blazing local network speeds. Transform your data management and synchronization with the perfect combination of Syncthing’s capabilities and ’s powerful infrastructure."
homepage: https://syncthing.net
source_code: https://github.com/syncthing/syncthing
ugos:
  app_id: com.upkforge.docker.syncthing
  version: 0.1.0
  port: 8384
  open_type: tab
  tag_type: utility
parameters:
- key: VOL_1
  label: Config folder
  help: Folder on the NAS for Syncthing's config. It is mounted into the container at /config; Syncthing has full read and write access to it.
  label_de: Konfiguration-Ordner
  help_de: Ordner auf der NAS für Syncthings Konfiguration. Wird im Container unter /config eingebunden; Syncthing hat vollen Lese- und Schreibzugriff darauf.
  type: path
- key: VOL_2
  label: DATA folder
  help: Folder on the NAS for Syncthing's data. It is mounted into the container at /DATA; Syncthing has full read and write access to it.
  label_de: Daten-Ordner
  help_de: Ordner auf der NAS für Syncthings Daten. Wird im Container unter /DATA eingebunden; Syncthing hat vollen Lese- und Schreibzugriff darauf.
  type: path
volumes:
- container_path: /config
  label: Config
  default_host_subpath: syncthing-config
- container_path: /DATA
  label: DATA
  default_host_subpath: syncthing-data
