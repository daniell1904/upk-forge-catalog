id: poste-io
name: Poste.io
author: Community
category: Others
description: Full stack mail server solution with SSL TLS support. POP3s, SMTP(s), IMAPs, RSPAMD, Clamav, Roundcube(HTTPS), SPF, DKIM with easy installation and web administration.
warnings:
- service uses host networking
ugos:
  app_id: com.upkforge.docker.posteio
  version: 0.1.0
  port: 10080
  open_type: tab
  tag_type: utility
parameters:
- key: VOL_1
  label: Data folder
  help: Folder on the NAS for Poste.io's data. It is mounted into the container at /data; Poste.io has full read and write access to it.
  type: path
volumes:
- container_path: /data
  label: Data
  default_host_subpath: poste-io-data
