services:
  openclaw:
    image: icewhaletech/openclaw:2026.5.7
    restart: unless-stopped
    command:
      - /bin/bash
      - -c
      - /app/start.sh && node dist/index.js gateway --bind lan --allow-unconfigured --port '18789'
    network_mode: bridge
    ports:
      - 24190:18789
      - 18790:18790
    volumes:
      - ${VOL_1}:/home/node/.openclaw
    environment:
      - HOME=/home/node
      - TERM=xterm-256color
      - OPENCLAW_GATEWAY_TOKEN=${OPENCLAW_GATEWAY_TOKEN}
