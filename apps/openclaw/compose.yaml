services:
  openclaw:
    image: app/openclaw:2026.5.7
    restart: unless-stopped
    network_mode: bridge
    ports:
      - 24190:18789
      - 18790:18790
    volumes:
      - ./openclaw-home-node-openclaw:/home/node/.openclaw
    environment:
      - HOME=/home/node
      - TERM=xterm-256color
      - OPENCLAW_GATEWAY_TOKEN=app
