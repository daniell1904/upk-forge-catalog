id: note-mark-aio
name: Note Mark AIO
author: Community
category: Productivity
description: Note Mark Aio is a self-hosted note taking app that allows you to create, organize, and share notes. It's a fork of the popular note-mark app with a focus on simplicity and ease of use.
ugos:
  app_id: com.upkforge.docker.notemarkaio
  version: 0.1.0
  port: 8000
  open_type: tab
  tag_type: utility
parameters:
- key: VOL_1
  label: Data folder
  help: Folder on the NAS for Note Mark AIO's data. It is mounted into the container at /data; Note Mark AIO has full read and write access to it.
  label_de: Daten-Ordner
  help_de: Ordner auf der NAS für Note Mark AIOs Daten. Wird im Container unter /data eingebunden; Note Mark AIO hat vollen Lese- und Schreibzugriff darauf.
  type: path
- key: JWT_SECRET
  label: JWT SECRET
  type: password
volumes:
- container_path: /data
  label: Data
  default_host_subpath: note-mark-aio-data
