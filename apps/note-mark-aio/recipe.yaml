id: note-mark-aio
name: Note Mark AIO
author: Community
category: Productivity
description: Note Mark Aio is a self-hosted note taking app that allows you to create, organize, and share notes. It's a fork of the popular note-mark app with a focus on simplicity and ease of use.
ugos:
  app_id: com.upkforge.docker.notemarkaio
  version: 0.1.0
  port: 8000
  open_type: tab
  tag_type: utility
volumes:
- container_path: /data
  label: Data
  user_chosen: false
  default_host_subpath: data
