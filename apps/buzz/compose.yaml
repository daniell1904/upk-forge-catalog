services:
  relay:
    image: ghcr.io/block/buzz:main@sha256:15adee3700f1b1364f66a843739d63937fccd6576504ef65eff01ae9f23bb427
    restart: unless-stopped
    ports:
      - 3000:3000
    volumes:
      - ./git_data:/data/git
    environment:
      - BUZZ_BIND_ADDR=0.0.0.0:3000
      - BUZZ_HEALTH_PORT=8080
      - BUZZ_METRICS_PORT=9102
      - DATABASE_URL=postgres://buzz:change-me-pg-7Kd2mQ9xR4vT@postgres:5432/buzz
      - REDIS_URL=redis://:change-me-redis-3Fn8pL5wZ6yB@redis:6379
      - BUZZ_S3_ENDPOINT=http://minio:9000
      - BUZZ_S3_ADDRESSING_STYLE=path
      - BUZZ_S3_ACCESS_KEY=${BUZZ_S3_ACCESS_KEY}
      - BUZZ_S3_SECRET_KEY=${BUZZ_S3_SECRET_KEY}
      - BUZZ_S3_BUCKET=buzz-media
      - BUZZ_GIT_REPO_PATH=/data/git
      - BUZZ_AUTO_MIGRATE=${BUZZ_REQUIRE_AUTH_TOKEN}
      - BUZZ_GIT_CONFORMANCE_PROBE=${BUZZ_REQUIRE_AUTH_TOKEN}
      - BUZZ_REQUIRE_AUTH_TOKEN=${BUZZ_REQUIRE_AUTH_TOKEN}
      - BUZZ_REQUIRE_RELAY_MEMBERSHIP=false
      - BUZZ_RELAY_PRIVATE_KEY=${BUZZ_RELAY_PRIVATE_KEY}
      - BUZZ_SERVE_GIT_WEB_GUI=${BUZZ_REQUIRE_AUTH_TOKEN}
      - RELAY_URL=ws://localhost:3000
      - BUZZ_MEDIA_BASE_URL=http://localhost:3000/media
  postgres:
    image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    restart: unless-stopped
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=buzz
      - POSTGRES_USER=buzz
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - PGDATA=/var/lib/postgresql/data/pgdata
  redis:
    image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - yes
      - --requirepass
      - change-me-redis-3Fn8pL5wZ6yB
    volumes:
      - ./redis_data:/data
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    restart: unless-stopped
    command: server /data --console-address ":9001"
    volumes:
      - ./minio_data:/data
    environment:
      - MINIO_ROOT_USER=${BUZZ_S3_ACCESS_KEY}
      - MINIO_ROOT_PASSWORD=${BUZZ_S3_SECRET_KEY}
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    restart: unless-stopped
    environment:
      - BUZZ_S3_ACCESS_KEY=${BUZZ_S3_ACCESS_KEY}
      - BUZZ_S3_SECRET_KEY=${BUZZ_S3_SECRET_KEY}
      - BUZZ_S3_BUCKET=buzz-media
