id: buzz
name: Buzz
author: Community
category: Developer
description: Buzz is a self-hostable workspace for humans and agents from Block. It runs a Nostr relay, a REST bridge, git-over-object-storage, and a web interface from a single Rust binary, so you can host your own community and agent infrastructure.
ugos:
  app_id: com.upkforge.docker.buzz
  version: 0.1.0
  port: 3000
  open_type: tab
  tag_type: devtool
parameters:
- key: VOL_1
  label: Data git folder
  help: Folder on the NAS for Buzz's data git. It is mounted into the container at /data/git; Buzz has full read and write access to it.
  type: path
- key: VOL_2
  label: Var lib postgresql data folder
  help: Folder on the NAS for Buzz's var lib postgresql data. It is mounted into the container at /var/lib/postgresql/data; Buzz has full read and write access to it.
  type: path
- key: VOL_3
  label: Data folder
  help: Folder on the NAS for Buzz's data. It is mounted into the container at /data; Buzz has full read and write access to it.
  type: path
- key: VOL_4
  label: Data folder
  help: Folder on the NAS for Buzz's data. It is mounted into the container at /data; Buzz has full read and write access to it.
  type: path
- key: BUZZ_S3_ACCESS_KEY
  label: BUZZ S3 ACCESS KEY
  type: password
- key: BUZZ_S3_SECRET_KEY
  label: BUZZ S3 SECRET KEY
  type: password
- key: BUZZ_REQUIRE_AUTH_TOKEN
  label: BUZZ REQUIRE AUTH TOKEN
  type: password
- key: BUZZ_RELAY_PRIVATE_KEY
  label: BUZZ RELAY PRIVATE KEY
  type: password
- key: POSTGRES_PASSWORD
  label: POSTGRES PASSWORD
  type: password
- key: REDIS_PASSWORD
  label: REDIS PASSWORD
  type: password
volumes:
- container_path: /data/git
  label: Data git
  default_host_subpath: relay-data-git
- container_path: /var/lib/postgresql/data
  label: Var lib postgresql data
  default_host_subpath: postgres-var-lib-postgresql-data
- container_path: /data
  label: Data
  default_host_subpath: redis-data
- container_path: /data
  label: Data
  default_host_subpath: minio-data
