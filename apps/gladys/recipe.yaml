id: gladys
name: Gladys Assistant
author: Community
category: Others
description: Gladys Assistant is a modern, privacy-first & open-source home automation software that runs anywhere.
warnings:
- service is privileged
- service uses host networking
ugos:
  app_id: com.upkforge.docker.gladys
  version: 0.1.0
  port: 1080
  open_type: tab
  tag_type: utility
parameters:
- key: VOL_1
  label: Var run docker.sock folder
  help: Folder on the NAS for Gladys Assistant's var run docker.sock. It is mounted into the container at /var/run/docker.sock; Gladys Assistant has full read and write access to it.
  label_de: Var run docker.sock-Ordner
  help_de: Ordner auf der NAS für Gladys Assistants Var run docker.sock. Wird im Container unter /var/run/docker.sock eingebunden; Gladys Assistant hat vollen Lese- und Schreibzugriff darauf.
  type: path
- key: VOL_2
  label: Var lib gladysassistant folder
  help: Folder on the NAS for Gladys Assistant's var lib gladysassistant. It is mounted into the container at /var/lib/gladysassistant; Gladys Assistant has full read and write access to it.
  label_de: Var lib gladysassistant-Ordner
  help_de: Ordner auf der NAS für Gladys Assistants Var lib gladysassistant. Wird im Container unter /var/lib/gladysassistant eingebunden; Gladys Assistant hat vollen Lese- und Schreibzugriff darauf.
  type: path
volumes:
- container_path: /var/run/docker.sock
  label: Var run docker.sock
  default_host_subpath: app-var-run-docker-sock
- container_path: /var/lib/gladysassistant
  label: Var lib gladysassistant
  default_host_subpath: app-var-lib-gladysassistant
