id: watchyourlan
name: WatchYourLAN
author: Community
category: Networking
description: Lightweight network IP scanner. Can be used to notify about new hosts and monitor host online/offline history
warnings:
- service uses host networking
ugos:
  app_id: com.upkforge.docker.watchyourlan
  version: 0.1.0
  port: 8840
  open_type: tab
  tag_type: utility
parameters:
- key: VOL_1
  label: Data WatchYourLAN folder
  help: Folder on the NAS for WatchYourLAN's data watchyourlan. It is mounted into the container at /data/WatchYourLAN; WatchYourLAN has full read and write access to it.
  label_de: Daten WatchYourLAN-Ordner
  help_de: Ordner auf der NAS für WatchYourLANs Daten WatchYourLAN. Wird im Container unter /data/WatchYourLAN eingebunden; WatchYourLAN hat vollen Lese- und Schreibzugriff darauf.
  type: path
volumes:
- container_path: /data/WatchYourLAN
  label: Data WatchYourLAN
  default_host_subpath: watchyourlan-data-watchyourlan
