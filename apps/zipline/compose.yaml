services:
  zipline:
    image: ghcr.io/diced/zipline:4.7.0
    restart: unless-stopped
    ports:
      - 3000:3000
    volumes:
      - ${VOL_1}:/zipline/uploads
      - ${VOL_2}:/zipline/public
    environment:
      - CORE_RETURN_HTTPS=false
      - CORE_SECRET=${CORE_SECRET}
      - CORE_HOST=0.0.0.0
      - CORE_PORT=3000
      - CORE_DATABASE_URL=postgres://postgres:postgrespassword@zipline-db/zipline
      - CORE_LOGGER=true
  zipline-db:
    image: postgres:15@sha256:bcab099bfaab33333a73a2ebe8c1d615c9f4c2402dd43452f989a36c6da9a5ba
    restart: unless-stopped
    volumes:
      - ${VOL_3}:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DATABASE=zipline
