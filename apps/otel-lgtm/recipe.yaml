id: otel-lgtm
name: OTEL LGTM
author: Konrad Botor (Forinil)
category: Developer
description: An OpenTelemetry Backend in a Docker Image.
ugos:
  app_id: com.upkforge.docker.otellgtm
  version: 0.1.0
  port: 3000
  open_type: tab
  tag_type: devtool
parameters:
- key: VOL_1
  label: Data folder
  help: Folder on the NAS for OTEL LGTM's data. It is mounted into the container at /data; OTEL LGTM has full read and write access to it.
  label_de: Daten-Ordner
  help_de: Ordner auf der NAS für OTEL LGTMs Daten. Wird im Container unter /data eingebunden; OTEL LGTM hat vollen Lese- und Schreibzugriff darauf.
  type: path
volumes:
- container_path: /data
  label: Data
  default_host_subpath: otel-lgtm-data
