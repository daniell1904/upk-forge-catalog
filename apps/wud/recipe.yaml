id: wud
name: What's Up Docker
author: Community
category: Developer
description: Gets you notified when new versions of your Docker containers are available and lets you react the way you want.
ugos:
  app_id: com.upkforge.docker.wud
  version: 0.1.0
  port: 3000
  open_type: tab
  tag_type: devtool
parameters:
- key: VOL_1
  label: Var run docker.sock folder
  help: Folder on the NAS for What's Up Docker's var run docker.sock. It is mounted into the container at /var/run/docker.sock; What's Up Docker has full read and write access to it.
  type: path
volumes:
- container_path: /var/run/docker.sock
  label: Var run docker.sock
  default_host_subpath: app-var-run-docker-sock
