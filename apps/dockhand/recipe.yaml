id: dockhand
name: Dockhand
author: Community
category: Developer
description: Modern, efficient Docker management application providing real-time container management, Compose stack orchestration, and multi-environment support. Features include interactive terminal access, file browser, Git integration, and SSO via OIDC. All in a lightweight, secure and privacy-focused package.
ugos:
  app_id: com.upkforge.docker.dockhand
  version: 0.1.0
  port: 3003
  open_type: tab
  tag_type: devtool
volumes:
- container_path: /var/run/docker.sock
  label: Var run docker.sock
  user_chosen: false
  default_host_subpath: app-var-run-docker-sock
- container_path: /app/data
  label: App data
  user_chosen: false
  default_host_subpath: data
