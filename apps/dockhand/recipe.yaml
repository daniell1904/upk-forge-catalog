id: dockhand
name: Dockhand
author: Community
category: Developer
description: Modern, efficient Docker management application providing real-time container management, Compose stack orchestration, and multi-environment support. Features include interactive terminal access, file browser, Git integration, and SSO via OIDC. All in a lightweight, secure and privacy-focused package.
ugos:
  app_id: com.upkforge.docker.dockhand
  version: 0.1.0
  port: 3003
  open_type: tab
  tag_type: devtool
parameters:
- key: VOL_1
  label: Var run docker.sock folder
  help: Folder on the NAS for Dockhand's var run docker.sock. It is mounted into the container at /var/run/docker.sock; Dockhand has full read and write access to it.
  label_de: Var run docker.sock-Ordner
  help_de: Ordner auf der NAS für Dockhands Var run docker.sock. Wird im Container unter /var/run/docker.sock eingebunden; Dockhand hat vollen Lese- und Schreibzugriff darauf.
  type: path
- key: VOL_2
  label: App data folder
  help: Folder on the NAS for Dockhand's app data. It is mounted into the container at /app/data; Dockhand has full read and write access to it.
  label_de: App Daten-Ordner
  help_de: Ordner auf der NAS für Dockhands App Daten. Wird im Container unter /app/data eingebunden; Dockhand hat vollen Lese- und Schreibzugriff darauf.
  type: path
volumes:
- container_path: /var/run/docker.sock
  label: Var run docker.sock
  default_host_subpath: app-var-run-docker-sock
- container_path: /app/data
  label: App data
  default_host_subpath: app-app-data
