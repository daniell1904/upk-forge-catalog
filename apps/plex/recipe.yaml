id: plex
name: Plex
author: Team
category: Media
description: Transform your home into a cinematic oasis with your very own media server. Unlike streaming platforms that compress and limit the quality of your content, a Plex server in your home allows you to maintain the pristine, high-bitrate glory of Blu-ray and beyond. Imagine pairing this high-fidelity, uninterrupted media access with cutting-edge home theater tech like VR headsets, 75-inch UHD TVs, or 100-inch laser projectors. The result? A breathtaking visual and auditory experience that streams seamlessly across TVs and mobile devices alike, right from the comfort of your couch. Deploy Plex on a devices and unlock the ultimate in home entertainment convenience. Enjoy ALMOST limitless storage capacity for your entire media library, lightning-fast local network speeds, and the ability to stream content effortlessly to any device in your home. Experience a world where your favorite shows and movies are always just a click away, stored securely and privately on your own terms.
homepage: https://www.plex.tv
source_code: https://github.com/linuxserver/docker-plex
warnings:
- service uses host networking
ugos:
  app_id: com.upkforge.docker.plex
  version: 0.1.0
  port: 32400
  open_type: tab
  tag_type: media
parameters:
- key: VOL_1
  label: Config folder
  help: Folder on the NAS for Plex's config. It is mounted into the container at /config; Plex has full read and write access to it.
  label_de: Konfiguration-Ordner
  help_de: Ordner auf der NAS für Plexs Konfiguration. Wird im Container unter /config eingebunden; Plex hat vollen Lese- und Schreibzugriff darauf.
  type: path
- key: VOL_2
  label: Media folder
  help: Folder on the NAS for Plex's media. It is mounted into the container at /Media; Plex has full read and write access to it.
  label_de: Medien-Ordner
  help_de: Ordner auf der NAS für Plexs Medien. Wird im Container unter /Media eingebunden; Plex hat vollen Lese- und Schreibzugriff darauf.
  type: path
volumes:
- container_path: /config
  label: Config
  default_host_subpath: plex-config
- container_path: /Media
  label: Media
  default_host_subpath: plex-media
