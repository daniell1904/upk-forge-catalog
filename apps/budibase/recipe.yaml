id: budibase
name: Budibase
author: Community
category: Developer
description: "Low code platform for creating internal tools, workflows, and admin panels in minutes. Supports PostgreSQL, MySQL, MSSQL, MongoDB, Rest API, Docker, K8s, and more \U0001F680. Budibase, the low code platform you'll enjoy using ⚡"
ugos:
  app_id: com.upkforge.docker.budibase
  version: 0.1.0
  port: 8080
  open_type: tab
  tag_type: devtool
parameters:
- key: VOL_1
  label: Data folder
  help: Folder on the NAS for Budibase's data. It is mounted into the container at /data; Budibase has full read and write access to it.
  label_de: Daten-Ordner
  help_de: Ordner auf der NAS für Budibases Daten. Wird im Container unter /data eingebunden; Budibase hat vollen Lese- und Schreibzugriff darauf.
  type: path
volumes:
- container_path: /data
  label: Data
  default_host_subpath: budibase-data
