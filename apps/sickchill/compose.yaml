services:
  sickchill:
    image: linuxserver/sickchill:2024.3.1
    restart: unless-stopped
    network_mode: bridge
    ports:
      - 8081:8081
    volumes:
      - ${VOL_1}:/config
      - ${VOL_2}:/downloads
      - ${VOL_3}:/tv
    environment:
      - PGID=1000
      - PUID=1000
      - TZ=Europe/London
