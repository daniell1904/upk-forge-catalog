services:
  sickchill:
    image: linuxserver/sickchill:2023.6.27
    restart: unless-stopped
    network_mode: bridge
    ports:
      - 8081:8081
    volumes:
      - ./config:/config
      - ${VOL_1}:/downloads
      - ${VOL_2}:/tv
    environment:
      - PGID=1000
      - PUID=1000
      - TZ=Europe/London
