id: cloudflared-web
name: Cloudflared Web
author: Community
category: Networking
description: Cloudflared-web is a docker image that packages both cloudflared cli and a simple Web UI to easily start or stop remotely-managed Cloudflare tunnel.
warnings:
- service uses host networking
ugos:
  app_id: com.upkforge.docker.cloudflaredweb
  version: 0.1.0
  port: 14333
  open_type: tab
  tag_type: utility
parameters:
- key: VOL_1
  label: Config folder
  help: Folder on the NAS for Cloudflared Web's config. It is mounted into the container at /config; Cloudflared Web has full read and write access to it.
  label_de: Konfiguration-Ordner
  help_de: Ordner auf der NAS für Cloudflared Webs Konfiguration. Wird im Container unter /config eingebunden; Cloudflared Web hat vollen Lese- und Schreibzugriff darauf.
  type: path
- key: BASIC_AUTH_PASS
  label: BASIC AUTH PASS
  type: string
volumes:
- container_path: /config
  label: Config
  default_host_subpath: cloudflared-web-config
