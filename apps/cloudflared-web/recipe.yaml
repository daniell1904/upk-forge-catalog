id: cloudflared-web
name: Cloudflared Web
author: Community
category: Networking
description: Cloudflared-web is a docker image that packages both cloudflared cli and a simple Web UI to easily start or stop remotely-managed Cloudflare tunnel.
warnings:
- service uses host networking
ugos:
  app_id: com.upkforge.docker.cloudflaredweb
  version: 0.1.0
  port: 14333
  open_type: tab
  tag_type: utility
parameters:
- key: BASIC_AUTH_PASS
  label: BASIC AUTH PASS
  type: string
volumes:
- container_path: /config
  label: Config
  user_chosen: false
  default_host_subpath: config
