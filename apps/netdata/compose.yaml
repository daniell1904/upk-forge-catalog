services:
  netdata:
    image: docker.io/netdata/netdata:v2.11.0
    ports:
      - "19999:19999"
    volumes:
      - ./data:/etc/netdata
      - ./lib:/var/lib/netdata
      - ./cache:/var/cache/netdata
    environment:
      - TZ=${TZ}
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    restart: unless-stopped
