id: joplin
name: joplin
author: Community
category: Productivity
description: Note taking and to-do application with synchronisation
ugos:
  app_id: com.upkforge.docker.joplin
  version: 0.1.0
  port: 22300
  open_type: tab
  tag_type: utility
parameters:
- key: VOL_1
  label: Var lib postgresql data folder
  help: Folder on the NAS for joplin's var lib postgresql data. It is mounted into the container at /var/lib/postgresql/data; joplin has full read and write access to it.
  type: path
- key: POSTGRES_PASSWORD
  label: POSTGRES PASSWORD
  type: password
volumes:
- container_path: /var/lib/postgresql/data
  label: Var lib postgresql data
  default_host_subpath: joplin-db-var-lib-postgresql-data
