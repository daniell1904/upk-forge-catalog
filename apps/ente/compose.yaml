services:
  ente:
    image: ghcr.io/ente-io/server:latest
    depends_on:
      - ente-db
      - ente-minio
    ports:
      - "8510:8080"
    volumes:
      - ./data:/data
    environment:
      - ENTE_DB_HOST=ente-db
      - ENTE_DB_PORT=5432
      - ENTE_DB_NAME=ente
      - ENTE_DB_USER=ente
      - ENTE_DB_PASSWORD=${ENTE_DB_PASSWORD}
      - ENTE_S3_ARE_LOCAL_BUCKETS=true
      - ENTE_S3_B2_EU_CEN_KEY=${ENTE_S3_B2_EU_CEN_KEY}
      - ENTE_S3_B2_EU_CEN_SECRET=${ENTE_S3_B2_EU_CEN_SECRET}
      - ENTE_S3_B2_EU_CEN_ENDPOINT=${wizard_s3_endpoint}:3200
      - ENTE_S3_B2_EU_CEN_REGION=eu-central-2
      - ENTE_S3_B2_EU_CEN_BUCKET=b2-eu-cen
    restart: unless-stopped

  ente-db:
    image: docker.io/postgres:15-alpine
    volumes:
      - ./db:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=ente
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=ente
    restart: unless-stopped

  ente-minio:
    image: docker.io/minio/minio:latest-cicd
    command: server /data --address ":3200" --console-address ":3201"
    ports:
      - "3200:3200"
    volumes:
      - ./minio:/data
    environment:
      - MINIO_ROOT_USER=ente
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    restart: unless-stopped

  ente-minio-init:
    image: docker.io/minio/mc:RELEASE.2025-08-13T08-35-41Z-cpuv1
    depends_on:
      - ente-minio
    entrypoint: ["/bin/sh", "-c", "until mc alias set local http://ente-minio:3200 ente ente-minio-secret 2>/dev/null; do echo 'waiting for minio...'; sleep 1; done; mc ls local/b2-eu-cen >/dev/null 2>&1 || mc mb local/b2-eu-cen || exit 1; echo 'bucket b2-eu-cen ready'; tail -f /dev/null"]
    restart: unless-stopped
