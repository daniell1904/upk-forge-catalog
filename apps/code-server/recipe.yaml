id: code-server
name: Code Server
author: Community
category: Developer
description: Run VS Code on any machine anywhere and access it in the browser.
ugos:
  app_id: com.upkforge.docker.codeserver
  version: 0.1.0
  port: 8080
  open_type: tab
  tag_type: devtool
parameters:
- key: VOL_1
  label: Config folder
  help: Folder on the NAS for Code Server's config. It is mounted into the container at /config; Code Server has full read and write access to it.
  label_de: Konfiguration-Ordner
  help_de: Ordner auf der NAS für Code Servers Konfiguration. Wird im Container unter /config eingebunden; Code Server hat vollen Lese- und Schreibzugriff darauf.
  type: path
- key: VOL_2
  label: Projects folder
  help: Folder on the NAS for Code Server's projects. It is mounted into the container at /projects; Code Server has full read and write access to it.
  label_de: Projects-Ordner
  help_de: Ordner auf der NAS für Code Servers Projects. Wird im Container unter /projects eingebunden; Code Server hat vollen Lese- und Schreibzugriff darauf.
  type: path
- key: PASSWORD
  label: PASSWORD
  type: password
- key: SUDO_PASSWORD
  label: SUDO PASSWORD
  type: password
volumes:
- container_path: /config
  label: Config
  default_host_subpath: app-config
- container_path: /projects
  label: Projects
  default_host_subpath: app-projects
