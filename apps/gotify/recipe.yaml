id: gotify
name: Gotify
author: Community
category: Social
description: a simple server for sending and receiving messages
ugos:
  app_id: com.upkforge.docker.gotify
  version: 0.1.0
  port: 8091
  open_type: tab
  tag_type: utility
parameters:
- key: VOL_1
  label: App data folder
  help: Folder on the NAS for Gotify's app data. It is mounted into the container at /app/data; Gotify has full read and write access to it.
  type: path
- key: GOTIFY_DEFAULTUSER_PASS
  label: GOTIFY DEFAULTUSER PASS
  type: string
volumes:
- container_path: /app/data
  label: App data
  default_host_subpath: app-app-data
