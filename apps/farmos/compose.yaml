services:
  farmos:
    image: farmos/farmos:4.0.5
    restart: unless-stopped
    ports:
      - 8080:80
    volumes:
      - ${VOL_1}:/opt/drupal/web/sites
  farmos-db:
    image: mariadb:10@sha256:be981e4113326ada8d6004174dd09eeaefc03094037f811182a52d4f2e737350
    restart: unless-stopped
    ports:
      - 3306:3306
    volumes:
      - ${VOL_2}:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=app_farmos
      - MYSQL_USER=farmos
      - MYSQL_PASSWORD=${MYSQL_ROOT_PASSWORD}
