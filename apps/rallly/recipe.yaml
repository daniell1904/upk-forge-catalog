id: rallly
name: Rallly
author: Community
category: Others
description: Rallly is an open-source scheduling and collaboration tool designed to make organizing events and meetings easier.
ugos:
  app_id: com.upkforge.docker.rallly
  version: 0.1.0
  port: 3000
  open_type: tab
  tag_type: utility
parameters:
- key: VOL_1
  label: Var lib postgresql data folder
  help: Folder on the NAS for Rallly's var lib postgresql data. It is mounted into the container at /var/lib/postgresql/data; Rallly has full read and write access to it.
  label_de: Var lib postgresql Daten-Ordner
  help_de: Ordner auf der NAS für Ralllys Var lib postgresql Daten. Wird im Container unter /var/lib/postgresql/data eingebunden; Rallly hat vollen Lese- und Schreibzugriff darauf.
  type: path
- key: SECRET_PASSWORD
  label: SECRET PASSWORD
  type: password
- key: POSTGRES_PASSWORD
  label: POSTGRES PASSWORD
  type: password
volumes:
- container_path: /var/lib/postgresql/data
  label: Var lib postgresql data
  default_host_subpath: rallly-db-var-lib-postgresql-data
