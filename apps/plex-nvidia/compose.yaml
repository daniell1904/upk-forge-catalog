services:
  plex:
    image: lscr.io/linuxserver/plex:1.43.4
    restart: unless-stopped
    network_mode: host
    volumes:
      - ${VOL_1}:/config
      - ${VOL_2}:/Media
    environment:
      - PGID=1000
      - PUID=1000
      - VERSION=docker
      - CPU_FALLBACK=true
      - NVIDIA_VISIBLE_DEVICES=all
