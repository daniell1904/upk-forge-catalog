services:
  plex:
    image: lscr.io/linuxserver/plex:1.41.3
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./config:/config
      - ${VOL_1}:/Media
    environment:
      - PGID=1000
      - PUID=1000
      - VERSION=docker
      - CPU_FALLBACK=true
      - NVIDIA_VISIBLE_DEVICES=all
