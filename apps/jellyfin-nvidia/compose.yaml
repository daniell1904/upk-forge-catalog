services:
  jellyfin:
    image: linuxserver/jellyfin:10.10.6
    restart: unless-stopped
    network_mode: bridge
    ports:
      - 8097:8096
      - 8921:8920
      - 7359:7359
      - 1901:1900
    volumes:
      - ${VOL_1}:/config
      - ${VOL_2}:/Media
      - ${VOL_3}:/opt/vc/lib
    environment:
      - PGID=1000
      - PUID=1000
      - TZ=$TZ
      - CPU_FALLBACK=true
      - NVIDIA_VISIBLE_DEVICES=all
