id: jellyfin-nvidia
name: Jellyfin (linuxserver/jellyfin, Nvidia GPU)
author: Team
category: Media
description: Imagine having all your movies, TV shows, and music at your fingertips, ready on any device. Jellyfin transforms your media collection into a personalized entertainment hub, surpassing traditional photo albums. Your media is accessible anywhere and beautifully organized. Jellyfin is free and open-source, offering high-quality streaming, detailed metadata, and personalized recommendations. Multiple users can have their own media libraries. Deploying Jellyfin on private cloud devices like provides virtually unlimited storage, seamless streaming, and secure, multi-device access. It's perfect for NAS enthusiasts looking to enhance their home media setup.
homepage: https://jellyfin.org/
source_code: https://github.com/jellyfin/jellyfin
ugos:
  app_id: com.upkforge.docker.jellyfinnvidia
  version: 0.1.0
  port: 8097
  open_type: tab
  tag_type: media
parameters:
- key: VOL_1
  label: Config folder
  help: Folder on the NAS for Jellyfin(Nvidia GPU)'s config. It is mounted into the container at /config; Jellyfin(Nvidia GPU) has full read and write access to it.
  label_de: Konfiguration-Ordner
  help_de: Ordner auf der NAS für Jellyfin(Nvidia GPU)s Konfiguration. Wird im Container unter /config eingebunden; Jellyfin(Nvidia GPU) hat vollen Lese- und Schreibzugriff darauf.
  type: path
- key: VOL_2
  label: Media folder
  help: Folder on the NAS for Jellyfin(Nvidia GPU)'s media. It is mounted into the container at /Media; Jellyfin(Nvidia GPU) has full read and write access to it.
  label_de: Medien-Ordner
  help_de: Ordner auf der NAS für Jellyfin(Nvidia GPU)s Medien. Wird im Container unter /Media eingebunden; Jellyfin(Nvidia GPU) hat vollen Lese- und Schreibzugriff darauf.
  type: path
- key: VOL_3
  label: Opt vc lib folder
  help: Folder on the NAS for Jellyfin(Nvidia GPU)'s opt vc lib. It is mounted into the container at /opt/vc/lib; Jellyfin(Nvidia GPU) has full read and write access to it.
  label_de: Opt vc lib-Ordner
  help_de: Ordner auf der NAS für Jellyfin(Nvidia GPU)s Opt vc lib. Wird im Container unter /opt/vc/lib eingebunden; Jellyfin(Nvidia GPU) hat vollen Lese- und Schreibzugriff darauf.
  type: path
volumes:
- container_path: /config
  label: Config
  default_host_subpath: jellyfin-config
- container_path: /Media
  label: Media
  default_host_subpath: jellyfin-media
- container_path: /opt/vc/lib
  label: Opt vc lib
  default_host_subpath: jellyfin-opt-vc-lib
