id: onedev
name: OneDev
author: Community
category: Developer
description: Self-hosted Git Server with Kanban and CI/CD
ugos:
  app_id: com.upkforge.docker.onedev
  version: 0.1.0
  port: 6610
  open_type: tab
  tag_type: devtool
parameters:
- key: VOL_1
  label: Opt onedev folder
  help: Folder on the NAS for OneDev's opt onedev. It is mounted into the container at /opt/onedev; OneDev has full read and write access to it.
  type: path
- key: VOL_2
  label: Var run docker.sock folder
  help: Folder on the NAS for OneDev's var run docker.sock. It is mounted into the container at /var/run/docker.sock; OneDev has full read and write access to it.
  type: path
- key: VOL_3
  label: Var lib postgresql data folder
  help: Folder on the NAS for OneDev's var lib postgresql data. It is mounted into the container at /var/lib/postgresql/data; OneDev has full read and write access to it.
  type: path
- key: hibernate_connection_password
  label: Hibernate connection password
  type: password
- key: initial_password
  label: Initial password
  type: password
volumes:
- container_path: /opt/onedev
  label: Opt onedev
  default_host_subpath: onedev-opt-onedev
- container_path: /var/run/docker.sock
  label: Var run docker.sock
  default_host_subpath: onedev-var-run-docker-sock
- container_path: /var/lib/postgresql/data
  label: Var lib postgresql data
  default_host_subpath: onedev-db-var-lib-postgresql-data
