id: octoprint
name: OctoPrint
author: Community
category: Home
description: OctoPrint is the snappy web interface for your 3D printer!
ugos:
  app_id: com.upkforge.docker.octoprint
  version: 0.1.0
  port: 1080
  open_type: tab
  tag_type: utility
parameters:
- key: VOL_1
  label: Octoprint folder
  help: Folder on the NAS for OctoPrint's octoprint. It is mounted into the container at /octoprint; OctoPrint has full read and write access to it.
  label_de: Octoprint-Ordner
  help_de: Ordner auf der NAS für OctoPrints Octoprint. Wird im Container unter /octoprint eingebunden; OctoPrint hat vollen Lese- und Schreibzugriff darauf.
  type: path
volumes:
- container_path: /octoprint
  label: Octoprint
  default_host_subpath: app-octoprint
