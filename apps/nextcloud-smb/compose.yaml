services:
  nextcloud-smb:
    image: bigbeartechworld/big-bear-nextcloud-with-smbclient:34.0.3
    restart: unless-stopped
    ports:
      - 7580:80
    volumes:
      - ${VOL_1}:/var/www/html
    environment:
      - POSTGRES_HOST=nextcloud-smb-db
      - REDIS_HOST=nextcloud-smb-redis
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_PASSWORD}
      - POSTGRES_DB=nextcloud
      - NEXTCLOUD_ADMIN_USER=${POSTGRES_PASSWORD}
      - NEXTCLOUD_ADMIN_PASSWORD=${POSTGRES_PASSWORD}
      - TRUSTED_PROXIES=
      - OVERWRITEPROTOCOL=http
      - PHP_MEMORY_LIMIT=1024M
      - PHP_UPLOAD_LIMIT=1024M
  nextcloud-smb-db:
    image: postgres:14.2@sha256:2c954f8c5d03da58f8b82645b783b56c1135df17e650b186b296fa1bb71f9cfd
    restart: unless-stopped
    volumes:
      - ${VOL_2}:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_PASSWORD}
      - POSTGRES_DB=nextcloud
  nextcloud-smb-redis:
    image: redis:8.10.1
    restart: unless-stopped
    volumes:
      - ${VOL_3}:/data
  nextcloud-smb-cron:
    image: bigbeartechworld/big-bear-nextcloud-with-smbclient:34.0.3
    restart: unless-stopped
    volumes:
      - ${VOL_4}:/var/www/html
