id: nextcloud-smb
name: Nextcloud with SMB (Legacy)
author: Community
category: Media
description: This is legacy and you should use the Nextcloud instead. Nextcloud puts your data at your fingertips, under your control. Store your documents, calendar, contacts and photos on a server at home, at one of our providers or in a data center you trust.
ugos:
  app_id: com.upkforge.docker.nextcloudsmb
  version: 0.1.0
  port: 7580
  open_type: tab
  tag_type: media
parameters:
- key: VOL_1
  label: Var www html folder
  help: Folder on the NAS for Nextcloud with SMB (Legacy)'s var www html. It is mounted into the container at /var/www/html; Nextcloud with SMB (Legacy) has full read and write access to it.
  type: path
- key: VOL_2
  label: Var lib postgresql data folder
  help: Folder on the NAS for Nextcloud with SMB (Legacy)'s var lib postgresql data. It is mounted into the container at /var/lib/postgresql/data; Nextcloud with SMB (Legacy) has full read and write access to it.
  type: path
- key: VOL_3
  label: Data folder
  help: Folder on the NAS for Nextcloud with SMB (Legacy)'s data. It is mounted into the container at /data; Nextcloud with SMB (Legacy) has full read and write access to it.
  type: path
- key: VOL_4
  label: Var www html folder
  help: Folder on the NAS for Nextcloud with SMB (Legacy)'s var www html. It is mounted into the container at /var/www/html; Nextcloud with SMB (Legacy) has full read and write access to it.
  type: path
- key: POSTGRES_PASSWORD
  label: POSTGRES PASSWORD
  type: password
volumes:
- container_path: /var/www/html
  label: Var www html
  default_host_subpath: nextcloud-smb-var-www-html
- container_path: /var/lib/postgresql/data
  label: Var lib postgresql data
  default_host_subpath: nextcloud-smb-db-var-lib-postgresql-data
- container_path: /data
  label: Data
  default_host_subpath: nextcloud-smb-redis-data
- container_path: /var/www/html
  label: Var www html
  default_host_subpath: nextcloud-smb-cron-var-www-html
