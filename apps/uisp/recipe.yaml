id: uisp
name: UISP
author: Community
category: Developer
description: All-in-one docker image for Ubiquiti UISP (formerly UNMS). Supports x86_64 and ARM (Raspberry Pi).
ugos:
  app_id: com.upkforge.docker.uisp
  version: 0.1.0
  port: 8080
  open_type: tab
  tag_type: devtool
parameters:
- key: VOL_1
  label: Config folder
  help: Folder on the NAS for UISP's config. It is mounted into the container at /config; UISP has full read and write access to it.
  type: path
volumes:
- container_path: /config
  label: Config
  default_host_subpath: uisp-config
