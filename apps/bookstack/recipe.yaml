id: bookstack
name: bookstack
author: Community
category: Others
description: BookStack is a simple, self-hosted, easy-to-use platform for organising and storing information. Default login admin@admin.com password password
ugos:
  app_id: com.upkforge.docker.bookstack
  version: 0.1.0
  port: 8080
  open_type: tab
  tag_type: utility
parameters:
- key: VOL_1
  label: Config folder
  help: Folder on the NAS for bookstack's config. It is mounted into the container at /config; bookstack has full read and write access to it.
  label_de: Konfiguration-Ordner
  help_de: Ordner auf der NAS für bookstacks Konfiguration. Wird im Container unter /config eingebunden; bookstack hat vollen Lese- und Schreibzugriff darauf.
  type: path
- key: VOL_2
  label: Config folder
  help: Folder on the NAS for bookstack's config. It is mounted into the container at /config; bookstack has full read and write access to it.
  label_de: Konfiguration-Ordner
  help_de: Ordner auf der NAS für bookstacks Konfiguration. Wird im Container unter /config eingebunden; bookstack hat vollen Lese- und Schreibzugriff darauf.
  type: path
- key: APP_KEY
  label: APP KEY
  type: password
- key: DB_PASSWORD
  label: DB PASSWORD
  type: password
- key: MYSQL_ROOT_PASSWORD
  label: MYSQL ROOT PASSWORD
  type: password
volumes:
- container_path: /config
  label: Config
  default_host_subpath: bookstack-config
- container_path: /config
  label: Config
  default_host_subpath: bookstack-db-config
