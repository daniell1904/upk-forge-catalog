id: netalertx
name: NetAlertX (Legacy)
author: Community
category: Networking
description: 'WIFI / LAN intruder detector. Scans for devices connected to your network and alerts you if new and unknown devices are found. NOTE: This is the legacy version (frozen at 25.11.29). For new installs, use NetAlertX v26 which has improved security and updated volume paths.'
warnings:
- service is privileged
- service uses host networking
ugos:
  app_id: com.upkforge.docker.netalertx
  version: 0.1.0
  port: 8080
  open_type: tab
  tag_type: utility
parameters:
- key: VOL_1
  label: App config folder
  help: Folder on the NAS for NetAlertX (Legacy)'s app config. It is mounted into the container at /app/config; NetAlertX (Legacy) has full read and write access to it.
  label_de: App Konfiguration-Ordner
  help_de: Ordner auf der NAS für NetAlertX (Legacy)s App Konfiguration. Wird im Container unter /app/config eingebunden; NetAlertX (Legacy) hat vollen Lese- und Schreibzugriff darauf.
  type: path
- key: VOL_2
  label: App db folder
  help: Folder on the NAS for NetAlertX (Legacy)'s app db. It is mounted into the container at /app/db; NetAlertX (Legacy) has full read and write access to it.
  label_de: App db-Ordner
  help_de: Ordner auf der NAS für NetAlertX (Legacy)s App db. Wird im Container unter /app/db eingebunden; NetAlertX (Legacy) hat vollen Lese- und Schreibzugriff darauf.
  type: path
volumes:
- container_path: /app/config
  label: App config
  default_host_subpath: netalertx-app-config
- container_path: /app/db
  label: App db
  default_host_subpath: netalertx-app-db
