id: umbrel
name: Umbrel OS
author: Community
category: Others
description: Umbrel is a personal server OS that makes self-hosting accessible to everyone.
ugos:
  app_id: com.upkforge.docker.umbrel
  version: 0.1.0
  port: 8080
  open_type: tab
  tag_type: utility
parameters:
- key: VOL_1
  label: Data folder
  help: Folder on the NAS for Umbrel OS's data. It is mounted into the container at /data; Umbrel OS has full read and write access to it.
  label_de: Daten-Ordner
  help_de: Ordner auf der NAS für Umbrel OSs Daten. Wird im Container unter /data eingebunden; Umbrel OS hat vollen Lese- und Schreibzugriff darauf.
  type: path
- key: VOL_2
  label: Var run docker.sock folder
  help: Folder on the NAS for Umbrel OS's var run docker.sock. It is mounted into the container at /var/run/docker.sock; Umbrel OS has full read and write access to it.
  label_de: Var run docker.sock-Ordner
  help_de: Ordner auf der NAS für Umbrel OSs Var run docker.sock. Wird im Container unter /var/run/docker.sock eingebunden; Umbrel OS hat vollen Lese- und Schreibzugriff darauf.
  type: path
volumes:
- container_path: /data
  label: Data
  default_host_subpath: umbrel-data
- container_path: /var/run/docker.sock
  label: Var run docker.sock
  default_host_subpath: umbrel-var-run-docker-sock
