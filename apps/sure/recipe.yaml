id: sure
name: Sure
author: we-promise
category: Finance
description: >-
  Sure is a personal finance management application designed to help you track your expenses, income, and investments in one place. With an intuitive interface and powerful features, Sure makes it easy to understand your financial situation and make informed decisions about your money.


  **Key Features:**

  - **Expense Tracking**: Easily log and categorize your expenses

  - **Income Management**: Track multiple income sources

  - **Investment Monitoring**: Keep an eye on your investments and their performance

  - **Budget Planning**: Create and maintain budgets to control your spending

  - **Financial Reports**: Generate detailed reports to understand your financial habits

  - **AI-Powered Insights**: Get personalized financial advice using AI technology


  **Use Cases:**

  - Personal budget management

  - Expense tracking and categorization

  - Investment portfolio monitoring

  - Financial goal setting and tracking

  - Cash flow analysis


  **Learn More:**

  - [Sure GitHub Repository](https://github.com/we-promise/sure)
homepage: https://sure.am
source_code: https://github.com/we-promise/sure
ugos:
  app_id: com.upkforge.docker.sure
  version: 0.1.0
  port: 23000
  open_type: tab
  tag_type: utility
parameters:
- key: VOL_1
  label: Rails storage folder
  help: Folder on the NAS for Sure's rails storage. It is mounted into the container at /rails/storage; Sure has full read and write access to it.
  type: path
- key: VOL_2
  label: Rails storage folder
  help: Folder on the NAS for Sure's rails storage. It is mounted into the container at /rails/storage; Sure has full read and write access to it.
  type: path
- key: VOL_3
  label: Var lib postgresql data folder
  help: Folder on the NAS for Sure's var lib postgresql data. It is mounted into the container at /var/lib/postgresql/data; Sure has full read and write access to it.
  type: path
- key: VOL_4
  label: Data folder
  help: Folder on the NAS for Sure's data. It is mounted into the container at /data; Sure has full read and write access to it.
  type: path
- key: POSTGRES_PASSWORD
  label: POSTGRES PASSWORD
  type: password
- key: OPENAI_ACCESS_TOKEN
  label: OPENAI ACCESS TOKEN
  type: password
volumes:
- container_path: /rails/storage
  label: Rails storage
  default_host_subpath: sure-web-rails-storage
- container_path: /rails/storage
  label: Rails storage
  default_host_subpath: sure-worker-rails-storage
- container_path: /var/lib/postgresql/data
  label: Var lib postgresql data
  default_host_subpath: sure-db-var-lib-postgresql-data
- container_path: /data
  label: Data
  default_host_subpath: sure-redis-data
