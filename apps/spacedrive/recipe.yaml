id: spacedrive
name: Spacedrive
author: Community
category: Others
description: Spacedrive is an open source cross-platform file explorer, powered by a virtual distributed filesystem written in Rust.
ugos:
  app_id: com.upkforge.docker.spacedrive
  version: 0.1.0
  port: 8080
  open_type: tab
  tag_type: utility
parameters:
- key: VOL_1
  label: Var spacedrive folder
  help: Folder on the NAS for Spacedrive's var spacedrive. It is mounted into the container at /var/spacedrive; Spacedrive has full read and write access to it.
  type: path
volumes:
- container_path: /var/spacedrive
  label: Var spacedrive
  default_host_subpath: spacedrive-var-spacedrive
