id: zigbee2mqtt
name: Zigbee to MQTT bridge
author: Community
category: Home
description: Zigbee to MQTT bridge, get rid of your proprietary Zigbee bridges
ugos:
  app_id: com.upkforge.docker.zigbee2mqtt
  version: 0.1.0
  port: 8080
  open_type: tab
  tag_type: utility
parameters:
- key: VOL_1
  label: App data folder
  help: Folder on the NAS for Zigbee to MQTT bridge's app data. It is mounted into the container at /app/data; Zigbee to MQTT bridge has full read and write access to it.
  label_de: App Daten-Ordner
  help_de: Ordner auf der NAS für Zigbee to MQTT bridges App Daten. Wird im Container unter /app/data eingebunden; Zigbee to MQTT bridge hat vollen Lese- und Schreibzugriff darauf.
  type: path
volumes:
- container_path: /app/data
  label: App data
  default_host_subpath: zigbee2mqtt-app-data
