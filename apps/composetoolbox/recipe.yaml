id: composetoolbox
name: Compose Toolbox
author: Community
category: Developer
description: Self-hosted tool to edit, validate, and get suggestions for docker-compose.yml files.
ugos:
  app_id: com.upkforge.docker.composetoolbox
  version: 0.1.0
  port: 3002
  open_type: tab
  tag_type: devtool
parameters:
- key: VOL_1
  label: App data folder
  help: Folder on the NAS for Compose Toolbox's app data. It is mounted into the container at /app/data; Compose Toolbox has full read and write access to it.
  type: path
volumes:
- container_path: /app/data
  label: App data
  default_host_subpath: composetoolbox-app-data
