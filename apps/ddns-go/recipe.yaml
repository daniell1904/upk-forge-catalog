id: ddns-go
name: ddns-go
author: zxxhz,Cp0204
category: Networking
description: A simple and easy-to-use DDNS tool. Automatically updates domain name resolution to your public IP (supports Alibaba Cloud, Tencent Cloud, Dnspod, Cloudflare, Callback, Huawei Cloud, Baidu Cloud, Porkbun, GoDaddy, and Google Domain). Deploy DDNS-go on, and you can bind the public IP of your device to your domain name. This way, you can access your device via the domain name while you are away.
source_code: https://github.com/jeessy2/ddns-go
ugos:
  app_id: com.upkforge.docker.ddnsgo
  version: 0.1.0
  port: 9876
  open_type: tab
  tag_type: utility
parameters:
- key: VOL_1
  label: Root folder
  help: Folder on the NAS for ddns-go's root. It is mounted into the container at /root; ddns-go has full read and write access to it.
  label_de: Root-Ordner
  help_de: Ordner auf der NAS für ddns-gos Root. Wird im Container unter /root eingebunden; ddns-go hat vollen Lese- und Schreibzugriff darauf.
  type: path
volumes:
- container_path: /root
  label: Root
  default_host_subpath: ddns-go-root
