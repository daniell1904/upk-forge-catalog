services:
  frigate:
    image: ghcr.io/blakeblackshear/frigate:0.17.2
    ports:
      - "8971:8971"
      - "8554:8554/tcp"
      - "1935:1935/tcp"
    volumes:
      - ./config:/config
      - ./media:/media/frigate
    environment:
      - TZ=${TZ}
    devices:
      - /dev/dri:/dev/dri
    shm_size: "256mb"
    restart: unless-stopped
