id: rustfs
name: RustFS
author: Community
category: AI
description: RustFS is a high-performance, distributed object storage system built in Rust. It combines the simplicity of MinIO with the memory safety and raw performance of Rust. It offers full S3 compatibility, is completely open-source under Apache 2.0 license, and is optimized for data lakes, AI, and big data workloads.
ugos:
  app_id: com.upkforge.docker.rustfs
  version: 0.1.0
  port: 9000
  open_type: tab
  tag_type: utility
parameters:
- key: VOL_1
  label: Data folder
  help: Folder on the NAS for RustFS's data. It is mounted into the container at /data; RustFS has full read and write access to it.
  label_de: Daten-Ordner
  help_de: Ordner auf der NAS für RustFSs Daten. Wird im Container unter /data eingebunden; RustFS hat vollen Lese- und Schreibzugriff darauf.
  type: path
- key: VOL_2
  label: Logs folder
  help: Folder on the NAS for RustFS's logs. It is mounted into the container at /logs; RustFS has full read and write access to it.
  label_de: Protokolle-Ordner
  help_de: Ordner auf der NAS für RustFSs Protokolle. Wird im Container unter /logs eingebunden; RustFS hat vollen Lese- und Schreibzugriff darauf.
  type: path
- key: RUSTFS_ACCESS_KEY
  label: RUSTFS ACCESS KEY
  type: password
- key: RUSTFS_SECRET_KEY
  label: RUSTFS SECRET KEY
  type: password
volumes:
- container_path: /data
  label: Data
  default_host_subpath: app-data
- container_path: /logs
  label: Logs
  default_host_subpath: app-logs
