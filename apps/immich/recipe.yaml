id: immich
name: Immich
version: 3.2
author: Immich
category: Media
description: Self-hosted photo and video backup, organised by an ML-powered search accelerated by the NAS's Intel GPU (OpenVINO). Pick where your library goes — everything else is Immich's own storage.
description_de: Selbstgehostetes Foto- und Video-Backup mit KI-gestützter Suche, beschleunigt durch die Intel-GPU (OpenVINO) der NAS. Nur die Mediathek wird abgefragt — den Rest verwaltet Immich selbst.
homepage: https://immich.app
source_code: https://github.com/immich-app/immich
license: https://github.com/immich-app/immich/blob/main/LICENSE
ugos:
  app_id: com.upkforge.docker.immich
  version: 0.1.0
  port: 2283
  open_type: tab
  tag_type: media
parameters:
- key: VOL_1
  label: Library folder
  help: Your photos and videos. Immich stores the originals, thumbnails and everything it generates here — point this at where you want the library kept.
  label_de: Mediathek
  help_de: Deine Fotos und Videos. Immich speichert hier die Originale, Vorschaubilder und alles, was es selbst erzeugt — wähle den Ordner, in dem die Mediathek liegen soll.
  type: path
- key: IMMICH_DB_PASSWORD
  label: Database password
  type: password
  changeable: false
  generate_bytes: 32
volumes:
- container_path: /var/lib/postgresql/data
  label: Database
  user_chosen: false
  default_host_subpath: immich/db
- container_path: /cache
  label: Machine learning cache
  user_chosen: false
  default_host_subpath: immich/model-cache
- container_path: /data
  label: Library
  label_de: Mediathek
