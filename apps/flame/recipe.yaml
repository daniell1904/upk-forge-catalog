id: flame
name: Flame
author: Community
category: Others
description: Flame is a self-hosted startpage for your server. Its design is heavily inspired by SUI. Flame is user-friendly and easy to set up. With its built-in editors, users can quickly establish their own application hub without any file editing.
ugos:
  app_id: com.upkforge.docker.flame
  version: 0.1.0
  port: 5005
  open_type: tab
  tag_type: utility
parameters:
- key: VOL_1
  label: App data folder
  help: Folder on the NAS for Flame's app data. It is mounted into the container at /app/data; Flame has full read and write access to it.
  type: path
- key: VOL_2
  label: Var run docker.sock folder
  help: Folder on the NAS for Flame's var run docker.sock. It is mounted into the container at /var/run/docker.sock; Flame has full read and write access to it.
  type: path
- key: PASSWORD
  label: PASSWORD
  type: password
volumes:
- container_path: /app/data
  label: App data
  default_host_subpath: app-app-data
- container_path: /var/run/docker.sock
  label: Var run docker.sock
  default_host_subpath: app-var-run-docker-sock
