services:
  frontend:
    image: taskingai/taskingai-console:v0.3.0
    restart: unless-stopped
  backend-inference:
    image: taskingai/taskingai-inference:v0.3.6
    restart: unless-stopped
    environment:
      - AES_ENCRYPTION_KEY=${AES_ENCRYPTION_KEY}
      - ICON_URL_PREFIX=http://nginx:3080
      - PROJECT_ID=taskingai
  backend-plugin:
    image: taskingai/taskingai-plugin:v0.2.13
    restart: unless-stopped
    volumes:
      - ${VOL_1}:/var/lib/data
    environment:
      - AES_ENCRYPTION_KEY=${AES_ENCRYPTION_KEY}
      - ICON_URL_PREFIX=http://nginx:3080
      - OBJECT_STORAGE_TYPE=local
      - HOST_URL=http://nginx:3080
      - PATH_TO_VOLUME=/var/lib/data
      - PROJECT_ID=taskingai
  backend-api:
    image: taskingai/taskingai-server:v0.3.0
    restart: unless-stopped
    volumes:
      - ${VOL_2}:/var/lib/data
    environment:
      - POSTGRES_URL=postgres://postgres:TaskingAI321@db:5432/taskingai
      - REDIS_URL=redis://:TaskingAI321@cache:6379/0
      - TASKINGAI_INFERENCE_URL=http://backend-inference:8000
      - TASKINGAI_PLUGIN_URL=http://backend-plugin:8000
      - AES_ENCRYPTION_KEY=${AES_ENCRYPTION_KEY}
      - OBJECT_STORAGE_TYPE=local
      - HOST_URL=http://nginx:3080
      - PATH_TO_VOLUME=/var/lib/data
      - PROJECT_ID=taskingai
  backend-web:
    image: taskingai/taskingai-server:v0.3.0
    restart: unless-stopped
    volumes:
      - ${VOL_3}:/var/lib/data
    environment:
      - POSTGRES_URL=postgres://postgres:TaskingAI321@db:5432/taskingai
      - REDIS_URL=redis://:TaskingAI321@cache:6379/0
      - TASKINGAI_INFERENCE_URL=http://backend-inference:8000
      - TASKINGAI_PLUGIN_URL=http://backend-plugin:8000
      - AES_ENCRYPTION_KEY=${AES_ENCRYPTION_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - PURPOSE=WEB
      - DEFAULT_ADMIN_USERNAME=admin
      - DEFAULT_ADMIN_PASSWORD=${DEFAULT_ADMIN_PASSWORD}
      - OBJECT_STORAGE_TYPE=local
      - HOST_URL=http://nginx:3080
      - PATH_TO_VOLUME=/var/lib/data
      - PROJECT_ID=taskingai
  db:
    image: ankane/pgvector:v0.5.1
    restart: unless-stopped
    volumes:
      - ${VOL_4}:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=taskingai
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DEFAULT_ADMIN_PASSWORD}
  cache:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - TaskingAI321
    volumes:
      - ${VOL_5}:/data
  nginx:
    image: nginx:1.31.5
    restart: unless-stopped
    ports:
      - 3080:80
    volumes:
      - ${VOL_6}:/var/cache/nginx
