id: taskingai
name: TaskingAI
author: Team
category: AI
description: The developer-friendly cloud platform for building and running LLM agents for AI-native applications.
homepage: https://docs.tasking.ai/
source_code: https://github.com/TaskingAI/TaskingAI
ugos:
  app_id: com.upkforge.docker.taskingai
  version: 0.1.0
  port: 3080
  open_type: tab
  tag_type: utility
parameters:
- key: VOL_1
  label: Var lib data folder
  help: Folder on the NAS for TaskingAI's var lib data. It is mounted into the container at /var/lib/data; TaskingAI has full read and write access to it.
  label_de: Var lib Daten-Ordner
  help_de: Ordner auf der NAS für TaskingAIs Var lib Daten. Wird im Container unter /var/lib/data eingebunden; TaskingAI hat vollen Lese- und Schreibzugriff darauf.
  type: path
- key: VOL_2
  label: Var lib data folder
  help: Folder on the NAS for TaskingAI's var lib data. It is mounted into the container at /var/lib/data; TaskingAI has full read and write access to it.
  label_de: Var lib Daten-Ordner
  help_de: Ordner auf der NAS für TaskingAIs Var lib Daten. Wird im Container unter /var/lib/data eingebunden; TaskingAI hat vollen Lese- und Schreibzugriff darauf.
  type: path
- key: VOL_3
  label: Var lib data folder
  help: Folder on the NAS for TaskingAI's var lib data. It is mounted into the container at /var/lib/data; TaskingAI has full read and write access to it.
  label_de: Var lib Daten-Ordner
  help_de: Ordner auf der NAS für TaskingAIs Var lib Daten. Wird im Container unter /var/lib/data eingebunden; TaskingAI hat vollen Lese- und Schreibzugriff darauf.
  type: path
- key: VOL_4
  label: Var lib postgresql data folder
  help: Folder on the NAS for TaskingAI's var lib postgresql data. It is mounted into the container at /var/lib/postgresql/data; TaskingAI has full read and write access to it.
  label_de: Var lib postgresql Daten-Ordner
  help_de: Ordner auf der NAS für TaskingAIs Var lib postgresql Daten. Wird im Container unter /var/lib/postgresql/data eingebunden; TaskingAI hat vollen Lese- und Schreibzugriff darauf.
  type: path
- key: VOL_5
  label: Data folder
  help: Folder on the NAS for TaskingAI's data. It is mounted into the container at /data; TaskingAI has full read and write access to it.
  label_de: Daten-Ordner
  help_de: Ordner auf der NAS für TaskingAIs Daten. Wird im Container unter /data eingebunden; TaskingAI hat vollen Lese- und Schreibzugriff darauf.
  type: path
- key: VOL_6
  label: Var cache nginx folder
  help: Folder on the NAS for TaskingAI's var cache nginx. It is mounted into the container at /var/cache/nginx; TaskingAI has full read and write access to it.
  label_de: Var Cache nginx-Ordner
  help_de: Ordner auf der NAS für TaskingAIs Var Cache nginx. Wird im Container unter /var/cache/nginx eingebunden; TaskingAI hat vollen Lese- und Schreibzugriff darauf.
  type: path
- key: AES_ENCRYPTION_KEY
  label: AES ENCRYPTION KEY
  type: password
- key: JWT_SECRET_KEY
  label: JWT SECRET KEY
  type: password
- key: DEFAULT_ADMIN_PASSWORD
  label: DEFAULT ADMIN PASSWORD
  type: password
volumes:
- container_path: /var/lib/data
  label: Var lib data
  default_host_subpath: backend-plugin-var-lib-data
- container_path: /var/lib/data
  label: Var lib data
  default_host_subpath: backend-api-var-lib-data
- container_path: /var/lib/data
  label: Var lib data
  default_host_subpath: backend-web-var-lib-data
- container_path: /var/lib/postgresql/data
  label: Var lib postgresql data
  default_host_subpath: db-var-lib-postgresql-data
- container_path: /data
  label: Data
  default_host_subpath: cache-data
- container_path: /var/cache/nginx
  label: Var cache nginx
  default_host_subpath: nginx-var-cache-nginx
