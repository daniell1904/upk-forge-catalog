id: invoice-ninja
name: Invoice Ninja
author: Community
category: Finance
description: Invoice Ninja is a free and open-source invoice and expense management system. It is a web-based application that allows you to create, manage, and track invoices and expenses.
ugos:
  app_id: com.upkforge.docker.invoiceninja
  version: 0.1.0
  port: 8080
  open_type: tab
  tag_type: utility
parameters:
- key: VOL_1
  label: Var www app public folder
  help: Folder on the NAS for Invoice Ninja's var www app public. It is mounted into the container at /var/www/app/public; Invoice Ninja has full read and write access to it.
  label_de: Var www App public-Ordner
  help_de: Ordner auf der NAS für Invoice Ninjas Var www App public. Wird im Container unter /var/www/app/public eingebunden; Invoice Ninja hat vollen Lese- und Schreibzugriff darauf.
  type: path
- key: VOL_2
  label: Var www app storage folder
  help: Folder on the NAS for Invoice Ninja's var www app storage. It is mounted into the container at /var/www/app/storage; Invoice Ninja has full read and write access to it.
  label_de: Var www App Speicher-Ordner
  help_de: Ordner auf der NAS für Invoice Ninjas Var www App Speicher. Wird im Container unter /var/www/app/storage eingebunden; Invoice Ninja hat vollen Lese- und Schreibzugriff darauf.
  type: path
- key: VOL_3
  label: Usr local etc php php.ini folder
  help: Folder on the NAS for Invoice Ninja's usr local etc php php.ini. It is mounted into the container at /usr/local/etc/php/php.ini; Invoice Ninja has full read and write access to it.
  label_de: Usr local etc php php.ini-Ordner
  help_de: Ordner auf der NAS für Invoice Ninjas Usr local etc php php.ini. Wird im Container unter /usr/local/etc/php/php.ini eingebunden; Invoice Ninja hat vollen Lese- und Schreibzugriff darauf.
  type: path
- key: VOL_4
  label: Usr local etc php php cli.ini folder
  help: Folder on the NAS for Invoice Ninja's usr local etc php php cli.ini. It is mounted into the container at /usr/local/etc/php/php-cli.ini; Invoice Ninja has full read and write access to it.
  label_de: Usr local etc php php cli.ini-Ordner
  help_de: Ordner auf der NAS für Invoice Ninjas Usr local etc php php cli.ini. Wird im Container unter /usr/local/etc/php/php-cli.ini eingebunden; Invoice Ninja hat vollen Lese- und Schreibzugriff darauf.
  type: path
- key: VOL_5
  label: Etc nginx conf.d default.conf folder
  help: Folder on the NAS for Invoice Ninja's etc nginx conf.d default.conf. It is mounted into the container at /etc/nginx/conf.d/default.conf; Invoice Ninja has full read and write access to it.
  label_de: Etc nginx conf.d default.conf-Ordner
  help_de: Ordner auf der NAS für Invoice Ninjas Etc nginx conf.d default.conf. Wird im Container unter /etc/nginx/conf.d/default.conf eingebunden; Invoice Ninja hat vollen Lese- und Schreibzugriff darauf.
  type: path
- key: VOL_6
  label: Var www app public folder
  help: Folder on the NAS for Invoice Ninja's var www app public. It is mounted into the container at /var/www/app/public; Invoice Ninja has full read and write access to it.
  label_de: Var www App public-Ordner
  help_de: Ordner auf der NAS für Invoice Ninjas Var www App public. Wird im Container unter /var/www/app/public eingebunden; Invoice Ninja hat vollen Lese- und Schreibzugriff darauf.
  type: path
- key: VOL_7
  label: Var lib mysql folder
  help: Folder on the NAS for Invoice Ninja's var lib mysql. It is mounted into the container at /var/lib/mysql; Invoice Ninja has full read and write access to it.
  label_de: Var lib mysql-Ordner
  help_de: Ordner auf der NAS für Invoice Ninjas Var lib mysql. Wird im Container unter /var/lib/mysql eingebunden; Invoice Ninja hat vollen Lese- und Schreibzugriff darauf.
  type: path
- key: IN_PASSWORD
  label: IN PASSWORD
  type: password
- key: APP_KEY
  label: APP KEY
  type: password
- key: DB_PASSWORD
  label: DB PASSWORD
  type: password
volumes:
- container_path: /var/www/app/public
  label: Var www app public
  default_host_subpath: invoice-ninja-var-www-app-public
- container_path: /var/www/app/storage
  label: Var www app storage
  default_host_subpath: invoice-ninja-var-www-app-storage
- container_path: /usr/local/etc/php/php.ini
  label: Usr local etc php php.ini
  default_host_subpath: invoice-ninja-usr-local-etc-php-php-ini
- container_path: /usr/local/etc/php/php-cli.ini
  label: Usr local etc php php cli.ini
  default_host_subpath: invoice-ninja-usr-local-etc-php-php-cli-ini
- container_path: /etc/nginx/conf.d/default.conf
  label: Etc nginx conf.d default.conf
  default_host_subpath: invoice-ninja-web-etc-nginx-conf-d-default-conf
- container_path: /var/www/app/public
  label: Var www app public
  default_host_subpath: invoice-ninja-web-var-www-app-public
- container_path: /var/lib/mysql
  label: Var lib mysql
  default_host_subpath: invoice-ninja-db-var-lib-mysql
