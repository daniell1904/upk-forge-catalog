id: kiwix-serve
name: Kiwix Server
author: Community
category: Others
description: Kiwix Server is a web server for hosting .zim files
ugos:
  app_id: com.upkforge.docker.kiwixserve
  version: 0.1.0
  port: 8080
  open_type: tab
  tag_type: utility
parameters:
- key: VOL_1
  label: Data folder
  help: Folder on the NAS for Kiwix Server's data. It is mounted into the container at /data; Kiwix Server has full read and write access to it.
  type: path
volumes:
- container_path: /data
  label: Data
  default_host_subpath: kiwix-serve-data
