id: smokeping
name: Smokeping
author: Team
category: Networking
description: keeps track of your network latency.
homepage: https://oss.oetiker.ch/smokeping/
source_code: https://github.com/oetiker/SmokePing
ugos:
  app_id: com.upkforge.docker.smokeping
  version: 0.1.0
  port: 10280
  open_type: tab
  tag_type: utility
parameters:
- key: VOL_1
  label: Config folder
  help: Folder on the NAS for Smokeping's config. It is mounted into the container at /config; Smokeping has full read and write access to it.
  label_de: Konfiguration-Ordner
  help_de: Ordner auf der NAS für Smokepings Konfiguration. Wird im Container unter /config eingebunden; Smokeping hat vollen Lese- und Schreibzugriff darauf.
  type: path
- key: VOL_2
  label: Data folder
  help: Folder on the NAS for Smokeping's data. It is mounted into the container at /data; Smokeping has full read and write access to it.
  label_de: Daten-Ordner
  help_de: Ordner auf der NAS für Smokepings Daten. Wird im Container unter /data eingebunden; Smokeping hat vollen Lese- und Schreibzugriff darauf.
  type: path
volumes:
- container_path: /config
  label: Config
  default_host_subpath: smokeping-config
- container_path: /data
  label: Data
  default_host_subpath: smokeping-data
