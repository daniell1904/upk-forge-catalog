id: deluge
name: Deluge
author: Team
category: Media
description: Deluge contains the common features to BitTorrent clients such as Protocol Encryption, DHT, Local Peer Discovery (LSD), Peer Exchange (PEX), UPnP, NAT-PMP, Proxy support, Web seeds, global and per-torrent speed limits. As Deluge heavily utilises the ​libtorrent library it has a comprehensive list of the ​features provided.
homepage: https://deluge-torrent.org
source_code: https://github.com/deluge-torrent/deluge
ugos:
  app_id: com.upkforge.docker.deluge
  version: 0.1.0
  port: 8112
  open_type: tab
  tag_type: media
parameters:
- key: VOL_1
  label: Config folder
  help: Folder on the NAS for Deluge's config. It is mounted into the container at /config; Deluge has full read and write access to it.
  type: path
- key: VOL_2
  label: DATA folder
  help: Folder on the NAS for Deluge's data. It is mounted into the container at /DATA; Deluge has full read and write access to it.
  type: path
volumes:
- container_path: /config
  label: Config
  default_host_subpath: deluge-config
- container_path: /DATA
  label: DATA
  default_host_subpath: deluge-data
