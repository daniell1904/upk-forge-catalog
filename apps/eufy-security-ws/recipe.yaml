id: eufy-security-ws
name: Eufy Security WS
author: Community
category: Others
description: eufy-security-ws is a small server wrapper around the eufy-security-client library to access it via a WebSocket. It allows you to control Eufy security devices by connecting to the Eufy cloud servers and local/remote stations.
warnings:
- service uses host networking
ugos:
  app_id: com.upkforge.docker.eufysecurityws
  version: 0.1.0
  port: 3000
  open_type: tab
  tag_type: utility
parameters:
- key: VOL_1
  label: Data folder
  help: Folder on the NAS for Eufy Security WS's data. It is mounted into the container at /data; Eufy Security WS has full read and write access to it.
  label_de: Daten-Ordner
  help_de: Ordner auf der NAS für Eufy Security WSs Daten. Wird im Container unter /data eingebunden; Eufy Security WS hat vollen Lese- und Schreibzugriff darauf.
  type: path
- key: PASSWORD
  label: PASSWORD
  type: password
volumes:
- container_path: /data
  label: Data
  default_host_subpath: eufy-security-ws-data
