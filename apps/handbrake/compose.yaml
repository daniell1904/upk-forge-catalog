services:
  handbrake:
    image: docker.io/jlesage/handbrake:v26.08.2
    ports:
      - "5800:5800"
    volumes:
      - ./config:/config
      - ${STORAGE_PATH}:/storage:ro
      - ./watch:/watch
      - ./output:/output
    environment:
      - USER_ID=1000
      - GROUP_ID=1000
      - TZ=${TZ}
      - KEEP_APP_RUNNING=1
    devices:
      - /dev/dri:/dev/dri
    restart: unless-stopped
