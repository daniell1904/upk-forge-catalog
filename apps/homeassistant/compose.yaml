services:
  homeassistant:
    image: lscr.io/linuxserver/homeassistant:2026.9.1
    network_mode: host
    privileged: true
    volumes:
      - ./config:/config
    environment:
      - TZ=${TZ}
      - PUID=1000
      - PGID=1000
      - PIP_INDEX_URL=https://pypi.tuna.tsinghua.edu.cn/simple
    restart: unless-stopped
