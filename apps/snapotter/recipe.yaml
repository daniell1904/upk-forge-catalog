id: snapotter
name: SnapOtter
author: SnapOtter
category: Productivity
description: SnapOtter is an open-source, self-hosted file manipulation suite with 200+ tools across images, video, audio, PDFs, and files. It includes batch processing, reusable pipelines, local AI tools, a browser image editor, and a REST API so files stay on your own server. This package uses SnapOtter's single-container embedded mode for an easy install. PostgreSQL 17 and Redis 8 run inside the container when DATABASE_URL and REDIS_URL are left unset, with persistent data stored under /data. Default login is admin / admin. SnapOtter asks you to change the default password after first login.
homepage: https://snapotter.com
source_code: https://github.com/snapotter-hq/SnapOtter
ugos:
  app_id: com.upkforge.docker.snapotter
  version: 0.1.0
  port: 1349
  open_type: tab
  tag_type: utility
parameters:
- key: DEFAULT_PASSWORD
  label: DEFAULT PASSWORD
  type: password
volumes:
- container_path: /data
  label: Data
  user_chosen: false
  default_host_subpath: data
