id: linkstack
name: LinkStack
author: Community
category: Others
description: LinkStack is a link-in-bio tool that allows you to create a personalized and easily customizable page that houses all the important links you want to share with your audience.
ugos:
  app_id: com.upkforge.docker.linkstack
  version: 0.1.0
  port: 8080
  open_type: tab
  tag_type: utility
parameters:
- key: VOL_1
  label: Data folder
  help: Folder on the NAS for LinkStack's data. It is mounted into the container at /data; LinkStack has full read and write access to it.
  type: path
volumes:
- container_path: /data
  label: Data
  default_host_subpath: linkstack-data
