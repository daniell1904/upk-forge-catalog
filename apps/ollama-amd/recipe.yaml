id: ollama-amd
name: Ollama - AMD
author: Community
category: AI
description: Get up and running with Llama 3, Mistral, Gemma, and other large language models.
ugos:
  app_id: com.upkforge.docker.ollamaamd
  version: 0.1.0
  port: 11434
  open_type: tab
  tag_type: utility
parameters:
- key: VOL_1
  label: Root .ollama folder
  help: Folder on the NAS for Ollama - AMD's root .ollama. It is mounted into the container at /root/.ollama; Ollama - AMD has full read and write access to it.
  type: path
volumes:
- container_path: /root/.ollama
  label: Root .ollama
  default_host_subpath: ollama-amd-root-ollama
