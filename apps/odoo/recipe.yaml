id: odoo
name: Odoo
author: Community
category: Finance
description: Open-source business management software suite designed to streamline various aspects of business operations. With its modular structure, users can choose and integrate specific applications such as accounting, inventory, and sales. Odoo provides a user-friendly interface, scalability for businesses of all sizes, and is available in both community (free) and enterprise editions. Its integrated approach and customization options make it a popular choice for comprehensive ERP (Enterprise Resource Planning) solutions.
ugos:
  app_id: com.upkforge.docker.odoo
  version: 0.1.0
  port: 8069
  open_type: tab
  tag_type: utility
parameters:
- key: VOL_1
  label: Etc odoo folder
  help: Folder on the NAS for Odoo's etc odoo. It is mounted into the container at /etc/odoo; Odoo has full read and write access to it.
  label_de: Etc odoo-Ordner
  help_de: Ordner auf der NAS für Odoos Etc odoo. Wird im Container unter /etc/odoo eingebunden; Odoo hat vollen Lese- und Schreibzugriff darauf.
  type: path
- key: VOL_2
  label: Mnt extra addons folder
  help: Folder on the NAS for Odoo's mnt extra addons. It is mounted into the container at /mnt/extra-addons; Odoo has full read and write access to it.
  label_de: Mnt extra addons-Ordner
  help_de: Ordner auf der NAS für Odoos Mnt extra addons. Wird im Container unter /mnt/extra-addons eingebunden; Odoo hat vollen Lese- und Schreibzugriff darauf.
  type: path
- key: VOL_3
  label: Var lib postgresql data folder
  help: Folder on the NAS for Odoo's var lib postgresql data. It is mounted into the container at /var/lib/postgresql/data; Odoo has full read and write access to it.
  label_de: Var lib postgresql Daten-Ordner
  help_de: Ordner auf der NAS für Odoos Var lib postgresql Daten. Wird im Container unter /var/lib/postgresql/data eingebunden; Odoo hat vollen Lese- und Schreibzugriff darauf.
  type: path
- key: PASSWORD
  label: PASSWORD
  type: password
volumes:
- container_path: /etc/odoo
  label: Etc odoo
  default_host_subpath: odoo-etc-odoo
- container_path: /mnt/extra-addons
  label: Mnt extra addons
  default_host_subpath: odoo-mnt-extra-addons
- container_path: /var/lib/postgresql/data
  label: Var lib postgresql data
  default_host_subpath: odoo-db-var-lib-postgresql-data
