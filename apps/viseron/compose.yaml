services:
  viseron:
    image: roflcoopter/viseron:3.6.2
    restart: unless-stopped
    ports:
      - 8888:8888
    volumes:
      - ${VOL_1}:/segments
      - ${VOL_2}:/snapshots
      - ${VOL_3}:/thumbnails
      - ${VOL_4}:/event_clips
      - ${VOL_5}:/config
      - /etc/localtime:/etc/localtime
    environment:
      - PUID=1000
      - PGID=1000
