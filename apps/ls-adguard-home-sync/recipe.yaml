id: ls-adguard-home-sync
name: LS Adguard Home Sync
author: Community
category: Networking
description: "\U0001F6E1️ Synchronize AdGuard Home config to replicas. This is the LinuxServer version."
ugos:
  app_id: com.upkforge.docker.lsadguardhomesync
  version: 0.1.0
  port: 8080
  open_type: tab
  tag_type: utility
parameters:
- key: VOL_1
  label: Config folder
  help: Folder on the NAS for LS Adguard Home Sync's config. It is mounted into the container at /config; LS Adguard Home Sync has full read and write access to it.
  type: path
- key: ORIGIN_PASSWORD
  label: ORIGIN PASSWORD
  type: password
volumes:
- container_path: /config
  label: Config
  default_host_subpath: ls-adguard-home-sync-config
