services:
  ls-adguard-home-sync:
    image: linuxserver/adguardhome-sync:0.9.2@sha256:395fb6503cc932767b9e92cfed0be93cf0273317bec117e37c54a9b491e0591f
    restart: unless-stopped
    ports:
      - 8080:8080
    volumes:
      - ${VOL_1}:/config
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - LOG_LEVEL=info
      - ORIGIN_URL=https://192.168.1.2:3000
      - ORIGIN_USERNAME=${ORIGIN_PASSWORD}
      - ORIGIN_PASSWORD=${ORIGIN_PASSWORD}
      - REPLICA_URL=https://192.168.1.3:3000
      - REPLICA_USERNAME=${ORIGIN_PASSWORD}
      - REPLICA_PASSWORD=${ORIGIN_PASSWORD}
      - CRON="0 */2 * * *"
      - RUN_ON_START=true
      - API_PORT=8080
