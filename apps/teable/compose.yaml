services:
  teable:
    image: teableio/teable:sha-ffd5d196f1904c85c38c0722bb4e0a4e2af028c6-amd64
    restart: unless-stopped
    ports:
      - 3200:3000
    volumes:
      - ${VOL_1}:/app/.assets
    environment:
      - TZ=$TZ
      - NEXT_ENV_IMAGES_ALL_REMOTE=true
      - PUBLIC_ORIGIN=http://127.0.0.1:3000
      - PRISMA_DATABASE_URL=postgresql://example:example@teable-db:5432/teable-db
      - BACKEND_CACHE_PROVIDER=redis
      - BACKEND_CACHE_REDIS_URI=redis://default:password@teable-cache:6379/0
  teable-db:
    image: postgres:15
    restart: unless-stopped
    volumes:
      - ${VOL_2}:/var/lib/postgresql/data
    environment:
      - TZ=$TZ
      - POSTGRES_DB=teable-db
      - POSTGRES_USER=${POSTGRES_PASSWORD}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
  teable-cache:
    image: redis:8.10.1
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass password
    volumes:
      - ${VOL_3}:/data
