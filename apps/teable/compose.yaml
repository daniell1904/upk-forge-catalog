services:
  teable:
    image: teableio/teable:latest
    restart: unless-stopped
    ports:
      - 3200:3000
    volumes:
      - ./assets:/app/.assets
    environment:
      - TZ=$TZ
      - NEXT_ENV_IMAGES_ALL_REMOTE=true
      - PUBLIC_ORIGIN=http://127.0.0.1:3000
      - PRISMA_DATABASE_URL=postgresql://example:example@teable-db:5432/teable-db
      - BACKEND_CACHE_PROVIDER=redis
      - BACKEND_CACHE_REDIS_URI=redis://default:password@teable-cache:6379/0
  teable-db:
    image: postgres:15
    restart: unless-stopped
    volumes:
      - ./data:/var/lib/postgresql/data
    environment:
      - TZ=$TZ
      - POSTGRES_DB=teable-db
      - POSTGRES_USER=example
      - POSTGRES_PASSWORD=example
  teable-cache:
    image: redis:7.2.4
    restart: unless-stopped
    volumes:
      - ./teable-cache-data:/data
