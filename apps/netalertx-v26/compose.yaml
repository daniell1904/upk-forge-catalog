services:
  netalertx-v26:
    image: jokobsk/netalertx:26.9.0
    restart: unless-stopped
    network_mode: host
    volumes:
      - ${VOL_1}:/data/config
      - ${VOL_2}:/data/db
    environment:
      - TZ=UTC
      - PORT=8080
      - PUID=1000
      - PGID=1000
      - ALWAYS_FRESH_INSTALL=false
