id: umami
name: Umami
author: Community
category: Others
description: Umami is a simple, fast, privacy-focused alternative to Google Analytics.
ugos:
  app_id: com.upkforge.docker.umami
  version: 0.1.0
  port: 3000
  open_type: tab
  tag_type: utility
parameters:
- key: APP_SECRET
  label: APP SECRET
  type: password
- key: POSTGRES_PASSWORD
  label: POSTGRES PASSWORD
  type: password
volumes:
- container_path: /var/lib/postgresql/data
  label: Var lib postgresql data
  user_chosen: false
  default_host_subpath: pgdata
