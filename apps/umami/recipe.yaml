id: umami
name: Umami
author: Community
category: Others
description: Umami is a simple, fast, privacy-focused alternative to Google Analytics.
ugos:
  app_id: com.upkforge.docker.umami
  version: 0.1.0
  port: 3000
  open_type: tab
  tag_type: utility
parameters:
- key: VOL_1
  label: Var lib postgresql data folder
  help: Folder on the NAS for Umami's var lib postgresql data. It is mounted into the container at /var/lib/postgresql/data; Umami has full read and write access to it.
  type: path
- key: APP_SECRET
  label: APP SECRET
  type: password
- key: POSTGRES_PASSWORD
  label: POSTGRES PASSWORD
  type: password
volumes:
- container_path: /var/lib/postgresql/data
  label: Var lib postgresql data
  default_host_subpath: db-var-lib-postgresql-data
