id: nzbfast
name: nzbfast
author: nzbfast
category: Media
description: >-
  nzbfast is a speed-focused Usenet (NZB) downloader written in Rust. It is one small binary with a low memory footprint, and it saturates a fast line with a handful of connections.


  Articles are verified while they arrive, so most jobs finish with no separate verify pass. Repair and unpack run only when they are actually needed, and extraction starts before the last article lands.


  The web dashboard on port 6790 also serves a SABnzbd-compatible API, so Sonarr, Radarr, Prowlarr and friends work with no extra glue. Add an .nzb from the dashboard, or drop one into the watch folder.


  First run: open the dashboard, add your Usenet provider under Settings, and copy the API key it shows you into your *arr apps. If you would rather pin the key yourself so it survives a reinstall, set NZBFAST_APIKEY before the first start. Leave it empty and nzbfast generates one for you.
homepage: https://nzbfast.github.io/nzbfast/
source_code: https://github.com/nzbfast/nzbfast
ugos:
  app_id: com.upkforge.docker.nzbfast
  version: 0.1.0
  port: 6790
  open_type: tab
  tag_type: media
parameters:
- key: VOL_1
  label: Config folder
  help: Folder on the NAS for nzbfast's config. It is mounted into the container at /config; nzbfast has full read and write access to it.
  type: path
- key: VOL_2
  label: Watch folder
  help: Folder on the NAS for nzbfast's watch. It is mounted into the container at /watch; nzbfast has full read and write access to it.
  type: path
- key: VOL_3
  label: Downloads folder
  help: Folder on the NAS for nzbfast's downloads. It is mounted into the container at /downloads; nzbfast has full read and write access to it.
  type: path
volumes:
- container_path: /config
  label: Config
  default_host_subpath: nzbfast-config
- container_path: /watch
  label: Watch
  default_host_subpath: nzbfast-watch
- container_path: /downloads
  label: Downloads
  default_host_subpath: nzbfast-downloads
