services:
  nzbfast:
    image: nzbfast/nzbfast:1.3.1
    restart: unless-stopped
    network_mode: bridge
    ports:
      - 6790:6789
    volumes:
      - ./config:/config
      - ./watch:/watch
      - ${VOL_1}:/downloads
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=$TZ
      - NZBFAST_APIKEY=
