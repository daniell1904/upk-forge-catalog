id: anythingllm
name: AnythingLLM
author: Mintplex Labs
category: AI
description: AnythingLLM is the easiest to use, all-in-one AI application that can do RAG, AI Agents, and much more with no code or infrastructure headaches.
homepage: https://anythingllm.com
source_code: https://github.com/Mintplex-Labs/anything-llm
warnings:
- 'service adds capabilities: SYS_ADMIN'
ugos:
  app_id: com.upkforge.docker.anythingllm
  version: 0.1.0
  port: 3051
  open_type: tab
  tag_type: utility
parameters:
- key: VOL_1
  label: App server storage folder
  help: Folder on the NAS for AnythingLLM's app server storage. It is mounted into the container at /app/server/storage; AnythingLLM has full read and write access to it.
  label_de: App server Speicher-Ordner
  help_de: Ordner auf der NAS für AnythingLLMs App server Speicher. Wird im Container unter /app/server/storage eingebunden; AnythingLLM hat vollen Lese- und Schreibzugriff darauf.
  type: path
volumes:
- container_path: /app/server/storage
  label: App server storage
  default_host_subpath: anythingllm-app-server-storage
