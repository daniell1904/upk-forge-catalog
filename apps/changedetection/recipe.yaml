id: changedetection
name: Change Detection
author: Community
category: Others
description: The best and simplest free open source website change detection, restock monitor and notification service.
ugos:
  app_id: com.upkforge.docker.changedetection
  version: 0.1.0
  port: 5000
  open_type: tab
  tag_type: utility
parameters:
- key: VOL_1
  label: Datastore folder
  help: Folder on the NAS for Change Detection's datastore. It is mounted into the container at /datastore; Change Detection has full read and write access to it.
  type: path
volumes:
- container_path: /datastore
  label: Datastore
  default_host_subpath: changedetection-datastore
