services:
  speedtest-tracker:
    image: linuxserver/speedtest-tracker:1.14.7@sha256:31aa3b5db19ec05f392ed53e26ebb06b73e88e1c915a2799d30d436ef4376041
    restart: unless-stopped
    ports:
      - 8080:80
      - 8443:443
    volumes:
      - /etc/localtime:/etc/localtime
      - ./config:/config
      - ./web:/etc/ssl/web
    environment:
      - PUID=1000
      - PGID=1000
      - DB_CONNECTION=mysql
      - DB_HOST=speedtest-tracker-db
      - DB_PORT=3306
      - DB_DATABASE=speedtest_tracker
      - DB_USERNAME=${DB_PASSWORD}
      - DB_PASSWORD=${DB_PASSWORD}
      - TZ=America/Chicago
  speedtest-tracker-db:
    image: mariadb:10@sha256:be981e4113326ada8d6004174dd09eeaefc03094037f811182a52d4f2e737350
    restart: unless-stopped
    volumes:
      - ./mysql:/var/lib/mysql
    environment:
      - MARIADB_DATABASE=speedtest_tracker
      - MARIADB_USER=${DB_PASSWORD}
      - MARIADB_PASSWORD=${DB_PASSWORD}
      - MARIADB_RANDOM_ROOT_PASSWORD=${MARIADB_RANDOM_ROOT_PASSWORD}
