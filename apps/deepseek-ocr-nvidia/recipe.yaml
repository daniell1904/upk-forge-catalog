id: deepseek-ocr-nvidia
name: DeepSeek OCR(Nvidia GPU)
author: Team
category: AI
description: >-
  DeepSeek OCR is a powerful open-source OCR (Optical Character Recognition) tool based on the advanced DeepSeek-AI model. It enables accurate text extraction from images and document scans via a user-friendly web interface and API. Supports various image formats and offers configurations for image size, cropping, and upload limits. Additionally, DeepSeek OCR features four core recognition modes: Plain OCR for raw text extraction, Describe for intelligent image content descriptions, Find for keyword localization with visual bounding box returns, and Freeform for flexible image understanding tasks based on custom prompts. **Key Features:**

  - High-accuracy text recognition with DeepSeek-OCR, supporting images and multi-page PDF documents

  - Preserves document layout including tables, formulas, and structural formatting

  - Web frontend (React) and REST API (FastAPI) for easy usage and system integration

  - Export results to Markdown, HTML, DOCX, or JSON formats

  - Automatic extraction and embedding of images from PDF files

  - GPU acceleration and Docker deployment for fast and scalable processing **Prerequisites:**

  - version 1.5.2 or higher, or NVIDIA Open Driver version 580 or higher

  - NVIDIA GPU with >= 8 GB VRAM for optimal performance **Learn More:**

  - [DeepSeek OCR App (GitHub)](https://github.com/rdumasia303/deepseek_ocr_app)
source_code: https://github.com/rdumasia303/deepseek_ocr_app
ugos:
  app_id: com.upkforge.docker.deepseekocrnvidia
  version: 0.1.0
  port: 23000
  open_type: tab
  tag_type: utility
parameters:
- key: VOL_1
  label: Models folder
  help: Folder on the NAS for DeepSeek OCR(Nvidia GPU)'s models. It is mounted into the container at /models; DeepSeek OCR(Nvidia GPU) has full read and write access to it.
  label_de: Models-Ordner
  help_de: Ordner auf der NAS für DeepSeek OCR(Nvidia GPU)s Models. Wird im Container unter /models eingebunden; DeepSeek OCR(Nvidia GPU) hat vollen Lese- und Schreibzugriff darauf.
  type: path
volumes:
- container_path: /models
  label: Models
  default_host_subpath: deepseek-ocr-backend-models
