id: resilio-sync
name: resilio-sync
author: self
category: Productivity
description: resilio-sync is a Docker-based application that enables fast and secure file synchronization and sharing.
homepage: https://www.resilio.com/sync/
source_code: https://github.com/linuxserver/docker-resilio-sync
ugos:
  app_id: com.upkforge.docker.resiliosync
  version: 0.1.0
  port: 55555
  open_type: tab
  tag_type: utility
parameters:
- key: VOL_1
  label: Sync folder
  help: Folder on the NAS for resilio-sync's sync. It is mounted into the container at /sync; resilio-sync has full read and write access to it.
  label_de: Sync-Ordner
  help_de: Ordner auf der NAS für resilio-syncs Sync. Wird im Container unter /sync eingebunden; resilio-sync hat vollen Lese- und Schreibzugriff darauf.
  type: path
- key: VOL_2
  label: Config folder
  help: Folder on the NAS for resilio-sync's config. It is mounted into the container at /config; resilio-sync has full read and write access to it.
  label_de: Konfiguration-Ordner
  help_de: Ordner auf der NAS für resilio-syncs Konfiguration. Wird im Container unter /config eingebunden; resilio-sync hat vollen Lese- und Schreibzugriff darauf.
  type: path
- key: VOL_3
  label: Downloads folder
  help: Folder on the NAS for resilio-sync's downloads. It is mounted into the container at /downloads; resilio-sync has full read and write access to it.
  label_de: Downloads-Ordner
  help_de: Ordner auf der NAS für resilio-syncs Downloads. Wird im Container unter /downloads eingebunden; resilio-sync hat vollen Lese- und Schreibzugriff darauf.
  type: path
volumes:
- container_path: /sync
  label: Sync
  default_host_subpath: resilio-sync-sync
- container_path: /config
  label: Config
  default_host_subpath: resilio-sync-config
- container_path: /downloads
  label: Downloads
  default_host_subpath: resilio-sync-downloads
