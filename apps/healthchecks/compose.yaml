services:
  healthchecks:
    image: linuxserver/healthchecks:4.4.20260907
    restart: unless-stopped
    ports:
      - 8000:8000
      - 2525:2525
    volumes:
      - ${VOL_1}:/config
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - SITE_ROOT=http://[YOUR_app_IP]
      - SITE_NAME="app HealthChecks"
      - SUPERUSER_EMAIL=user@example.com
      - SUPERUSER_PASSWORD=${SUPERUSER_PASSWORD}
      - ALLOWED_HOSTS=
      - APPRISE_ENABLED=False
      - CSRF_TRUSTED_ORIGINS=
      - DEBUG=True
      - DEFAULT_FROM_EMAIL=
      - EMAIL_HOST=
      - EMAIL_PORT=
      - EMAIL_HOST_USER=
      - EMAIL_HOST_PASSWORD=
      - EMAIL_USE_TLS=
      - INTEGRATIONS_ALLOW_PRIVATE_IPS=
      - PING_EMAIL_DOMAIN=
      - RP_ID=
      - SECRET_KEY=${SECRET_KEY}
      - SITE_LOGO_URL=
