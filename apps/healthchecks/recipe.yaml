id: healthchecks
name: Healthchecks
author: Community
category: Others
description: Healthchecks is a watchdog for your cron jobs. It's a web server that listens for pings from your cron jobs, plus a web interface.
ugos:
  app_id: com.upkforge.docker.healthchecks
  version: 0.1.0
  port: 8000
  open_type: tab
  tag_type: utility
parameters:
- key: VOL_1
  label: Config folder
  help: Folder on the NAS for Healthchecks's config. It is mounted into the container at /config; Healthchecks has full read and write access to it.
  type: path
- key: SUPERUSER_PASSWORD
  label: SUPERUSER PASSWORD
  type: password
- key: SECRET_KEY
  label: SECRET KEY
  type: password
volumes:
- container_path: /config
  label: Config
  default_host_subpath: healthchecks-config
