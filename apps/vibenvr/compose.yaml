services:
  frontend:
    image: docker.io/spupuz/vibenvr-frontend:1.35.6
    ports:
      - "8087:80"
    volumes:
      - ./data:/data
    environment:
      - TZ=${TZ}
    depends_on:
      - backend
    restart: unless-stopped
    init: true
    networks:
      - vibe-network

  backend:
    image: docker.io/spupuz/vibenvr-backend:1.35.6
    volumes:
      - ./data:/data
    environment:
      - POSTGRES_USER=vibenvr
      - POSTGRES_PASSWORD=${wizard_postgres_password}
      - POSTGRES_DB=vibenvr
      - DATABASE_URL=postgresql://vibenvr:${wizard_postgres_password}@db:5432/vibenvr
      - TZ=${TZ}
      - SECRET_KEY=${wizard_secret_key}
      - WEBHOOK_SECRET=${wizard_webhook_secret}
      - ALLOWED_ORIGINS=${wizard_allowed_origins}
      - COOKIE_SECURE=${wizard_cookie_secure}
    depends_on:
      db:
        condition: service_healthy
      engine:
        condition: service_started
    restart: unless-stopped
    init: true
    entrypoint: ["/bin/sh", "./entrypoint.sh"]
    stop_grace_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - vibe-network

  engine:
    image: docker.io/spupuz/vibenvr-engine:1.35.6
    expose:
      - "8000"
    volumes:
      - ./data:/var/lib/vibe/recordings
    environment:
      - BACKEND_URL=http://backend:5000
      - TZ=${TZ}
      - HW_ACCEL=true
      - HW_ACCEL_TYPE=${wizard_hw_accel_type}
      - WEBHOOK_SECRET=${wizard_webhook_secret}
    devices:
      - /dev/dri:/dev/dri
    shm_size: "512mb"
    entrypoint: ["/bin/sh", "./entrypoint.sh"]
    stop_grace_period: 30s
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    privileged: true
    restart: unless-stopped
    init: true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - vibe-network

  db:
    image: docker.io/postgres:15-alpine
    environment:
      - POSTGRES_USER=vibenvr
      - POSTGRES_PASSWORD=${wizard_postgres_password}
      - POSTGRES_DB=vibenvr
      - TZ=${TZ}
    volumes:
      - ./db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    init: true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - vibe-network

networks:
  vibe-network:
    driver: bridge
