id: rackpeek
name: RackPeek
author: Community
category: Networking
description: A webui and CLI tool to discover, manage, and document your home lab and small-scale IT infrastructure. Track hardware, services, networks, and their relationships using open, non-proprietary YAML.
ugos:
  app_id: com.upkforge.docker.rackpeek
  version: 0.1.0
  port: 8095
  open_type: tab
  tag_type: utility
parameters:
- key: VOL_1
  label: App config folder
  help: Folder on the NAS for RackPeek's app config. It is mounted into the container at /app/config; RackPeek has full read and write access to it.
  label_de: App Konfiguration-Ordner
  help_de: Ordner auf der NAS für RackPeeks App Konfiguration. Wird im Container unter /app/config eingebunden; RackPeek hat vollen Lese- und Schreibzugriff darauf.
  type: path
volumes:
- container_path: /app/config
  label: App config
  default_host_subpath: rackpeek-app-config
