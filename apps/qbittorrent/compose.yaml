services:
  qbittorrent:
    image: ghcr.io/hotio/qbittorrent:release-5.0.4
    restart: unless-stopped
    network_mode: bridge
    ports:
      - 8181:8080
    volumes:
      - ${VOL_1}:/config
      - ${VOL_2}:/DATA
    environment:
      - PGID=1000
      - PUID=1000
      - TZ=$TZ
      - UMASK=002
