id: ihatemoney
name: I Hate Money
author: Community
category: Finance
description: I hate money is a web application made to ease shared budget management. It keeps track of who bought what, when, and for whom; and helps to settle the bills.
ugos:
  app_id: com.upkforge.docker.ihatemoney
  version: 0.1.0
  port: 8001
  open_type: tab
  tag_type: utility
parameters:
- key: VOL_1
  label: Var lib mysql folder
  help: Folder on the NAS for I Hate Money's var lib mysql. It is mounted into the container at /var/lib/mysql; I Hate Money has full read and write access to it.
  type: path
- key: SECRET_KEY
  label: SECRET KEY
  type: password
- key: MYSQL_ROOT_PASSWORD
  label: MYSQL ROOT PASSWORD
  type: password
volumes:
- container_path: /var/lib/mysql
  label: Var lib mysql
  default_host_subpath: ihatemoney-db-var-lib-mysql
