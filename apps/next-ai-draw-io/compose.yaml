services:
  next-ai-draw-io:
    image: ghcr.io/dayuanjiang/next-ai-draw-io:latest
    ports:
      - "3007:3000"
    environment:
      - TZ=${TZ}
      - AI_PROVIDER=${wizard_ai_provider}
      - AI_MODEL=${wizard_ai_model}
      - OPENAI_API_KEY=${wizard_openai_api_key}
      - OPENAI_BASE_URL=${wizard_openai_base_url}
      - ACCESS_CODE_LIST=${wizard_access_code}
      - NEXT_PUBLIC_DRAWIO_BASE_URL=${wizard_drawio_base_url}
    restart: unless-stopped
