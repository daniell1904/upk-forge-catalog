id: python-matter-server
name: Python Matter Server
author: Community
category: Home
description: This project implements a Matter Controller Server over WebSockets using the official Matter (formerly CHIP) SDK as a base and provides both a server and client implementation. The goal of this project is primary to have Matter support in Home Assistant but its universal approach makes it suitable to be used in other projects too.
warnings:
- service uses host networking
ugos:
  app_id: com.upkforge.docker.pythonmatterserver
  version: 0.1.0
  port: 5580
  open_type: tab
  tag_type: utility
volumes:
- container_path: /data/
  label: Data
  user_chosen: false
  default_host_subpath: data
