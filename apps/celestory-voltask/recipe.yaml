id: celestory-voltask
name: Celestory & Voltask
author: Celestory
category: Developer
description: The all-in-one no-code platform for interactive storytelling and Voltask automation engine. Paid license required, no free tier available. Purchase a license at https://celestory.io/pricing
ugos:
  app_id: com.upkforge.docker.celestoryvoltask
  version: 0.1.0
  port: 1500
  open_type: tab
  tag_type: devtool
parameters:
- key: VOL_1
  label: App projectFiles folder
  help: Folder on the NAS for Celestory & Voltask's app projectfiles. It is mounted into the container at /app/projectFiles; Celestory & Voltask has full read and write access to it.
  label_de: App projectFiles-Ordner
  help_de: Ordner auf der NAS für Celestory & Voltasks App projectFiles. Wird im Container unter /app/projectFiles eingebunden; Celestory & Voltask hat vollen Lese- und Schreibzugriff darauf.
  type: path
- key: VOL_2
  label: Usr src app projectFiles folder
  help: Folder on the NAS for Celestory & Voltask's usr src app projectfiles. It is mounted into the container at /usr/src/app/projectFiles; Celestory & Voltask has full read and write access to it.
  label_de: Usr src App projectFiles-Ordner
  help_de: Ordner auf der NAS für Celestory & Voltasks Usr src App projectFiles. Wird im Container unter /usr/src/app/projectFiles eingebunden; Celestory & Voltask hat vollen Lese- und Schreibzugriff darauf.
  type: path
- key: VOL_3
  label: App uploads folder
  help: Folder on the NAS for Celestory & Voltask's app uploads. It is mounted into the container at /app/uploads; Celestory & Voltask has full read and write access to it.
  label_de: App Uploads-Ordner
  help_de: Ordner auf der NAS für Celestory & Voltasks App Uploads. Wird im Container unter /app/uploads eingebunden; Celestory & Voltask hat vollen Lese- und Schreibzugriff darauf.
  type: path
- key: VOL_4
  label: Var lib postgresql data folder
  help: Folder on the NAS for Celestory & Voltask's var lib postgresql data. It is mounted into the container at /var/lib/postgresql/data; Celestory & Voltask has full read and write access to it.
  label_de: Var lib postgresql Daten-Ordner
  help_de: Ordner auf der NAS für Celestory & Voltasks Var lib postgresql Daten. Wird im Container unter /var/lib/postgresql/data eingebunden; Celestory & Voltask hat vollen Lese- und Schreibzugriff darauf.
  type: path
- key: AUTH_CLIENT_SECRET
  label: AUTH CLIENT SECRET
  type: password
- key: AUTH_AUTHORITY_SECRET
  label: AUTH AUTHORITY SECRET
  type: password
- key: ADMIN_USERNAME
  label: ADMIN USERNAME
  type: string
- key: ADMIN_PASSWORD
  label: ADMIN PASSWORD
  type: password
- key: HUB_ORIGIN
  label: HUB ORIGIN
  type: string
- key: API_ORIGIN
  label: API ORIGIN
  type: string
- key: DB_PASSWORD
  label: DB PASSWORD
  type: password
- key: AUTH_REDIRECT_URI
  label: AUTH REDIRECT URI
  type: path
- key: VOLTASK_WEBHOOK_URL
  label: VOLTASK WEBHOOK URL
  type: string
- key: VOLTASK_ADMIN_EMAIL
  label: VOLTASK ADMIN EMAIL
  type: string
- key: VOLTASK_ADMIN_PASSWORD
  label: VOLTASK ADMIN PASSWORD
  type: password
volumes:
- container_path: /app/projectFiles
  label: App projectFiles
  default_host_subpath: api-app-projectfiles
- container_path: /usr/src/app/projectFiles
  label: Usr src app projectFiles
  default_host_subpath: generator-usr-src-app-projectfiles
- container_path: /app/uploads
  label: App uploads
  default_host_subpath: voltask-app-uploads
- container_path: /var/lib/postgresql/data
  label: Var lib postgresql data
  default_host_subpath: db-var-lib-postgresql-data
