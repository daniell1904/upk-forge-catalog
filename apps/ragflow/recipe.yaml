id: ragflow
name: RagFlow
author: RagFlow
category: AI
description: >-
  RagFlow is an open-source RAG (Retrieval-Augmented Generation) engine based on deep document understanding. It enables users to build their own private ChatGPT by leveraging the power of large language models and deep document parsing capabilities. RagFlow supports various document formats including PDF, Word, Markdown, and more, allowing users to create intelligent question-answering systems based on their own documents.


  **Key Features:**

  - Deep document understanding with advanced parsing capabilities

  - Support for multiple document formats (PDF, Word, Markdown, etc.)

  - Private knowledge base with data security assurance

  - Customizable RAG workflows for different use cases

  - Integration with popular large language models

  - Web-based interface for easy management and interaction


  **Hardware Requirements:**

  - CPU >= 4 cores

  - RAM >= 16 GB

  - Disk >= 50 GB


  **Learn More:**

  - [RagFlow Official Website](https://ragflow.io)

  - [RagFlow GitHub Repository](https://github.com/infiniflow/ragflow)
homepage: https://ragflow.io
source_code: https://github.com/infiniflow/ragflow
ugos:
  app_id: com.upkforge.docker.ragflow
  version: 0.1.0
  port: 9380
  open_type: tab
  tag_type: utility
parameters:
- key: VOL_1
  label: Ragflow logs folder
  help: Folder on the NAS for RagFlow's ragflow logs. It is mounted into the container at /ragflow/logs; RagFlow has full read and write access to it.
  type: path
- key: VOL_2
  label: Ragflow history data agent folder
  help: Folder on the NAS for RagFlow's ragflow history data agent. It is mounted into the container at /ragflow/history_data_agent; RagFlow has full read and write access to it.
  type: path
- key: VOL_3
  label: Usr share elasticsearch data folder
  help: Folder on the NAS for RagFlow's usr share elasticsearch data. It is mounted into the container at /usr/share/elasticsearch/data; RagFlow has full read and write access to it.
  type: path
- key: VOL_4
  label: Var infinity folder
  help: Folder on the NAS for RagFlow's var infinity. It is mounted into the container at /var/infinity; RagFlow has full read and write access to it.
  type: path
- key: VOL_5
  label: Data folder
  help: Folder on the NAS for RagFlow's data. It is mounted into the container at /data; RagFlow has full read and write access to it.
  type: path
- key: VOL_6
  label: Var lib mysql folder
  help: Folder on the NAS for RagFlow's var lib mysql. It is mounted into the container at /var/lib/mysql; RagFlow has full read and write access to it.
  type: path
- key: VOL_7
  label: Usr share opensearch data folder
  help: Folder on the NAS for RagFlow's usr share opensearch data. It is mounted into the container at /usr/share/opensearch/data; RagFlow has full read and write access to it.
  type: path
- key: VOL_8
  label: Data folder
  help: Folder on the NAS for RagFlow's data. It is mounted into the container at /data; RagFlow has full read and write access to it.
  type: path
- key: VOL_9
  label: Var run docker.sock folder
  help: Folder on the NAS for RagFlow's var run docker.sock. It is mounted into the container at /var/run/docker.sock; RagFlow has full read and write access to it.
  type: path
- key: ELASTIC_PASSWORD
  label: ELASTIC PASSWORD
  type: password
- key: MYSQL_ROOT_PASSWORD
  label: MYSQL ROOT PASSWORD
  type: password
- key: OPENSEARCH_INITIAL_ADMIN_PASSWORD
  label: OPENSEARCH INITIAL ADMIN PASSWORD
  type: password
volumes:
- container_path: /ragflow/logs
  label: Ragflow logs
  default_host_subpath: ragflow-ragflow-logs
- container_path: /ragflow/history_data_agent
  label: Ragflow history data agent
  default_host_subpath: ragflow-ragflow-history-data-agent
- container_path: /usr/share/elasticsearch/data
  label: Usr share elasticsearch data
  default_host_subpath: ragflow-es01-usr-share-elasticsearch-data
- container_path: /var/infinity
  label: Var infinity
  default_host_subpath: ragflow-infinity-var-infinity
- container_path: /data
  label: Data
  default_host_subpath: ragflow-minio-data
- container_path: /var/lib/mysql
  label: Var lib mysql
  default_host_subpath: ragflow-mysql-var-lib-mysql
- container_path: /usr/share/opensearch/data
  label: Usr share opensearch data
  default_host_subpath: ragflow-opensearch01-usr-share-opensearch-data
- container_path: /data
  label: Data
  default_host_subpath: ragflow-redis-data
- container_path: /var/run/docker.sock
  label: Var run docker.sock
  default_host_subpath: ragflow-sandbox-executor-manager-var-run-docker-sock
