id: coolify
name: Coolify
author: Community
category: Media
description: Coolify is a self-hosted web application that allows you to manage your servers, applications, and services. It provides a simple and intuitive interface for managing your infrastructure, making it easy to deploy and manage your applications. With Coolify, you can easily manage your servers, applications, and services, providing a streamlined experience for managing your infrastructure.
ugos:
  app_id: com.upkforge.docker.coolify
  version: 0.1.0
  port: 8000
  open_type: tab
  tag_type: media
parameters:
- key: VOL_1
  label: Var www html storage app ssh folder
  help: Folder on the NAS for Coolify's var www html storage app ssh. It is mounted into the container at /var/www/html/storage/app/ssh; Coolify has full read and write access to it.
  label_de: Var www html Speicher App ssh-Ordner
  help_de: Ordner auf der NAS für Coolifys Var www html Speicher App ssh. Wird im Container unter /var/www/html/storage/app/ssh eingebunden; Coolify hat vollen Lese- und Schreibzugriff darauf.
  type: path
