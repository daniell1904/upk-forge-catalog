id: pocketbase
name: PocketBase
author: Team
category: Developer
description: PocketBase is an open-source backend solution that combines a real-time database, authentication, file storage, and an admin dashboard into a single, portable executable.
homepage: https://pocketbase.io
source_code: https://github.com/pocketbase/pocketbase
ugos:
  app_id: com.upkforge.docker.pocketbase
  version: 0.1.0
  port: 8090
  open_type: tab
  tag_type: devtool
parameters:
- key: VOL_1
  label: Pb data folder
  help: Folder on the NAS for PocketBase's pb data. It is mounted into the container at /pb_data; PocketBase has full read and write access to it.
  type: path
volumes:
- container_path: /pb_data
  label: Pb data
  default_host_subpath: pocketbase-pb-data
