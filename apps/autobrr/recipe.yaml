id: autobrr
name: Autobrr
author: Autobrr Team
category: Media
description: Autobrr is the modern download automation tool for torrents and usenet. With inspiration and ideas from tools like trackarr, autodl-irssi and flexget we built one tool that can do it all, and then some.
homepage: https://autobrr.com
source_code: https://github.com/autobrr/autobrr
ugos:
