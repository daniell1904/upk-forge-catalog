  help: Folder on the NAS for Autobrr's config. It is mounted into the container at /config; Autobrr has full read and write access to it.
  label_de: Konfiguration-Ordner
  help_de: Ordner auf der NAS für Autobrrs Konfiguration. Wird im Container unter /config eingebunden; Autobrr hat vollen Lese- und Schreibzugriff darauf.
  type: path
volumes:
- container_path: /config
  label: Config
  default_host_subpath: autobrr-config
