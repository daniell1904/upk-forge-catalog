services:
  openhands:
    image: ghcr.io/all-hands-ai/openhands:0.59
    restart: unless-stopped
    ports:
      - 13333:3000
    volumes:
      - ./openhands-var-run-docker-sock:/var/run/docker.sock
      - ./openhands:/.openhands
      - ./workspace:/opt/workspace_base
    environment:
      - SANDBOX_RUNTIME_CONTAINER_IMAGE=ghcr.io/all-hands-ai/runtime:main-nikolaik
      - WORKSPACE_MOUNT_PATH=/DATA/AppData/openhands/workspace
