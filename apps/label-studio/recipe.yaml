id: label-studio
name: Label Studio
author: CorrectRoadH
category: AI
description: Label Studio is an open source data labeling tool. It lets you label data types like audio, text, images, videos, and time series with a simple and straightforward UI and export to various model formats. It can be used to prepare raw data or improve existing training data to get more accurate ML models.
homepage: https://labelstud.io/
source_code: https://github.com/HumanSignal/label-studio
ugos:
  app_id: com.upkforge.docker.labelstudio
  version: 0.1.0
  port: 3080
  open_type: tab
  tag_type: utility
parameters:
- key: VOL_1
  label: Label studio data folder
  help: Folder on the NAS for Label Studio's label studio data. It is mounted into the container at /label-studio/data; Label Studio has full read and write access to it.
  label_de: Label studio Daten-Ordner
  help_de: Ordner auf der NAS für Label Studios Label studio Daten. Wird im Container unter /label-studio/data eingebunden; Label Studio hat vollen Lese- und Schreibzugriff darauf.
  type: path
volumes:
- container_path: /label-studio/data
  label: Label studio data
  default_host_subpath: label-studio-label-studio-data
