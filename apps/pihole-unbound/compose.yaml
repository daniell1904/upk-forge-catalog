services:
  app:
    image: bigbeartechworld/big-bear-pihole-unbound:2026.07.2@sha256:7db29f755beeda43d9e1565399c0b77916533c51ea9e6c05c48e7b0f5675c57f
    restart: unless-stopped
    ports:
      - 53:53
      - 53:53
      - 67:67
      - 8080:80
      - 10443:443
    volumes:
      - ./etc:/etc/pihole/
      - ./dnsmasq.d:/etc/dnsmasq.d/
    environment:
      - TZ=America/Chicago
      - FTLCONF_webserver_api_password=${FTLCONF_webserver_api_password}
      - FTLCONF_dns_upstreams=127.0.0.1#5353
