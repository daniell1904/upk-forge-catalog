services:
  genmon:
    image: bigbeartechworld/big-bear-genmon:2.0.01@sha256:0cc8f42c7859c64b428e0b5eca908c7e67f02880b34520b3b1985558998a897a
    restart: unless-stopped
    ports:
      - 20022:22
      - 38443:443
      - 8000:8000
    volumes:
      - ${VOL_1}:/git/genmon
      - ${VOL_2}:/etc/genmon
      - ${VOL_3}:/var/log
    environment:
      - TZ=America/Chicago
