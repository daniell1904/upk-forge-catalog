id: paperclip
name: Paperclip
author: Community
category: AI
description: Paperclip is an open-source self-hosted board for managing AI coding agents such as Claude Code, Codex, OpenCode, and Gemini CLI. Assign work to agents, run them, and track cost and output from a single dashboard.
ugos:
  app_id: com.upkforge.docker.paperclip
  version: 0.1.0
  port: 3101
  open_type: tab
  tag_type: utility
parameters:
- key: VOL_1
  label: Paperclip folder
  help: Folder on the NAS for Paperclip's paperclip. It is mounted into the container at /paperclip; Paperclip has full read and write access to it.
  label_de: Paperclip-Ordner
  help_de: Ordner auf der NAS für Paperclips Paperclip. Wird im Container unter /paperclip eingebunden; Paperclip hat vollen Lese- und Schreibzugriff darauf.
  type: path
- key: BETTER_AUTH_SECRET
  label: BETTER AUTH SECRET
  type: password
volumes:
- container_path: /paperclip
  label: Paperclip
  default_host_subpath: paperclip-paperclip
