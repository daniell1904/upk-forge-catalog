id: mailpit
name: Mailpit
author: Community
category: Developer
description: Mailpit is a multi-platform email testing tool & API for developers.
ugos:
  app_id: com.upkforge.docker.mailpit
  version: 0.1.0
  port: 8025
  open_type: tab
  tag_type: devtool
parameters:
- key: VOL_1
  label: Data folder
  help: Folder on the NAS for Mailpit's data. It is mounted into the container at /data; Mailpit has full read and write access to it.
  type: path
volumes:
- container_path: /data
  label: Data
  default_host_subpath: app-data
