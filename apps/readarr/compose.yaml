services:
  readarr:
    image: linuxserver/readarr:0.3.10-develop
    restart: unless-stopped
    network_mode: bridge
    ports:
      - 8787:8787
    volumes:
      - ${VOL_1}:/config
      - ${VOL_2}:/books
      - ${VOL_3}:/downloads
    environment:
      - PGID=1000
      - PUID=1000
      - TZ=$TZ
