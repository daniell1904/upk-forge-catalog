id: photoprism
name: PhotoPrism
version: 260728
author: PhotoPrism
category: Media
description: Your AI-Powered Photos App for the Decentralized Web PhotoPrism brings the magic of AI to your home TV, phone, and multiple devices, revolutionizing the way you manage and share your photos. Unlike traditional photo albums that require manual organization, PhotoPrism automatically tags and finds your pictures, making it easier than ever to relive your memories. Whether you're showing family photos on your TV or sharing vacation snapshots on your phone, PhotoPrism makes the experience seamless and enjoyable. PhotoPrism offers a host of features designed to enhance your photo management experience. With powerful search capabilities, automatic tagging, and a user-friendly interface, you'll find it easy to keep your photo collection organized. The app is free to use, with premium options available for those seeking additional features and support. Users can expect a smooth, intuitive experience that blends cutting-edge technology with everyday convenience. Deploying PhotoPrism on private cloud devices offers unparalleled convenience. Enjoy unlimited storage capacity, the speed of your local network, and access from multiple devices without the need for the internet. It's the perfect solution for NAS enthusiasts who value privacy and performance.
homepage: https://photoprism.app
ugos:
  app_id: com.upkforge.docker.photoprism
  version: 0.1.0
  port: 2342
  open_type: tab
  tag_type: media
parameters:
- key: PHOTOPRISM_ADMIN_PASSWORD
  label: Photoprism admin password
  type: password
  changeable: false
  generate_bytes: 24
volumes:
- container_path: /photoprism/storage
  label: Storage
  user_chosen: false
  default_host_subpath: storage
- container_path: /photoprism/originals
  label: Originals
  user_chosen: false
  default_host_subpath: originals
