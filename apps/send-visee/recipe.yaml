id: send-visee
name: Send Visee
author: Community
category: Social
description: A fork of Mozilla's Firefox Send. Mozilla discontinued Send, this fork is a community effort to keep the project up-to-date and alive.
ugos:
  app_id: com.upkforge.docker.sendvisee
  version: 0.1.0
  port: 1443
  open_type: tab
  tag_type: utility
parameters:
- key: VOL_1
  label: Uploads folder
  help: Folder on the NAS for Send Visee's uploads. It is mounted into the container at /uploads; Send Visee has full read and write access to it.
  type: path
- key: VOL_2
  label: Data folder
  help: Folder on the NAS for Send Visee's data. It is mounted into the container at /data; Send Visee has full read and write access to it.
  type: path
- key: APP_DOMAIN
  label: APP DOMAIN
  type: string
volumes:
- container_path: /uploads
  label: Uploads
  default_host_subpath: send-visee-uploads
- container_path: /data
  label: Data
  default_host_subpath: send-visee-redis-data
