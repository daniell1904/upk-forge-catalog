id: goaway
name: GoAway
author: Community
category: Networking
description: GoAway is a lightweight DNS sinkhole that blocks ads, trackers, and malicious domains at the network level. It provides a web-based admin dashboard for management and supports customizable blocking rules with real-time statistics tracking.
warnings:
- 'service adds capabilities: NET_BIND_SERVICE, NET_RAW'
ugos:
  app_id: com.upkforge.docker.goaway
  version: 0.1.0
  port: 53
  open_type: tab
  tag_type: utility
parameters:
- key: VOL_1
  label: App config folder
  help: Folder on the NAS for GoAway's app config. It is mounted into the container at /app/config; GoAway has full read and write access to it.
  label_de: App Konfiguration-Ordner
  help_de: Ordner auf der NAS für GoAways App Konfiguration. Wird im Container unter /app/config eingebunden; GoAway hat vollen Lese- und Schreibzugriff darauf.
  type: path
volumes:
- container_path: /app/config
  label: App config
  default_host_subpath: goaway-app-config
