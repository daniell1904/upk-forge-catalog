id: firefox
name: Firefox
version: 26.08.3
author: jlesage
category: Browser
description: This Image contains a browser-accessible version of Firefox.
homepage: https://github.com/jlesage/docker-firefox
ugos:
  app_id: com.upkforge.docker.firefox
  version: 0.1.0
  port: 5801
  open_type: tab
  tag_type: utility
volumes:
- container_path: /config
  label: Config
  user_chosen: false
  default_host_subpath: config
- container_path: /usr/share/fonts
  label: Fonts
  user_chosen: false
  default_host_subpath: fonts
