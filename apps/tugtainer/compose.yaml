services:
  tugtainer:
    image: quenary/tugtainer:v1.32.0@sha256:62504ee55bc152a8582c9a5b1bfdcc4d30585e7019a05239aa3b4a980273b6df
    restart: unless-stopped
    ports:
      - 9412:80
    volumes:
      - ./data:/tugtainer
      - ./tugtainer-var-run-docker-sock:/var/run/docker.sock
    environment:
      - TZ=UTC
      - LOG_LEVEL=warning
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - ACCESS_TOKEN_LIFETIME_MIN=5
      - REFRESH_TOKEN_LIFETIME_MIN=43200
      - HTTPS=FALSE
