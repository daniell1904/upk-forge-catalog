id: tugtainer
name: Tugtainer
author: Community
category: Developer
description: Tugtainer is a self-hosted app for automating updates of your docker containers with a web UI. It's like watchtower but with more control and a user-friendly interface.
ugos:
  app_id: com.upkforge.docker.tugtainer
  version: 0.1.0
  port: 9412
  open_type: tab
  tag_type: devtool
parameters:
- key: VOL_1
  label: Tugtainer folder
  help: Folder on the NAS for Tugtainer's tugtainer. It is mounted into the container at /tugtainer; Tugtainer has full read and write access to it.
  label_de: Tugtainer-Ordner
  help_de: Ordner auf der NAS für Tugtainers Tugtainer. Wird im Container unter /tugtainer eingebunden; Tugtainer hat vollen Lese- und Schreibzugriff darauf.
  type: path
- key: VOL_2
  label: Var run docker.sock folder
  help: Folder on the NAS for Tugtainer's var run docker.sock. It is mounted into the container at /var/run/docker.sock; Tugtainer has full read and write access to it.
  label_de: Var run docker.sock-Ordner
  help_de: Ordner auf der NAS für Tugtainers Var run docker.sock. Wird im Container unter /var/run/docker.sock eingebunden; Tugtainer hat vollen Lese- und Schreibzugriff darauf.
  type: path
- key: JWT_SECRET_KEY
  label: JWT SECRET KEY
  type: password
volumes:
- container_path: /tugtainer
  label: Tugtainer
  default_host_subpath: tugtainer-tugtainer
- container_path: /var/run/docker.sock
  label: Var run docker.sock
  default_host_subpath: tugtainer-var-run-docker-sock
