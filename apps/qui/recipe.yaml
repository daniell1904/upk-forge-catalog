id: qui
name: Qui
author: Team
category: Media
description: '**One dashboard for all your qBittorrent instances.** Qui is a fast, modern web interface for qBittorrent. Instead of juggling several separate WebUI tabs, you connect every qBittorrent instance to Qui and manage them all from a single, responsive dashboard. It ships as a lightweight single binary, so it stays quick and resource-friendly even when you are watching thousands of torrents. **Automation and cross-seeding built in.** Built by the team behind autobrr, Qui goes well beyond basic torrent listing. It adds powerful rule-based automation, built-in cross-seeding that automatically finds and adds matching torrents across your trackers, scheduled backups with restore, and a clean multi-language interface. Point it at your Torznab-compatible indexers — such as Prowlarr or Jackett — to put cross-seeding on autopilot, then filter, search, and bulk-manage torrents across every instance at once. **Made for your private cloud.** Running Qui on a private cloud device like keeps everything in one place on hardware you control. Pair it with your qBittorrent containers for local-network speeds, full ownership of your data, and a single tidy interface for your entire download stack — accessible from any device in your home.'
homepage: https://getqui.com
source_code: https://github.com/autobrr/qui
ugos:
  app_id: com.upkforge.docker.qui
  version: 0.1.0
  port: 7476
  open_type: tab
  tag_type: media
parameters:
- key: VOL_1
  label: Config folder
  help: Folder on the NAS for Qui's config. It is mounted into the container at /config; Qui has full read and write access to it.
  label_de: Konfiguration-Ordner
  help_de: Ordner auf der NAS für Quis Konfiguration. Wird im Container unter /config eingebunden; Qui hat vollen Lese- und Schreibzugriff darauf.
  type: path
- key: VOL_2
  label: Var lib postgresql data folder
  help: Folder on the NAS for Qui's var lib postgresql data. It is mounted into the container at /var/lib/postgresql/data; Qui has full read and write access to it.
  label_de: Var lib postgresql Daten-Ordner
  help_de: Ordner auf der NAS für Quis Var lib postgresql Daten. Wird im Container unter /var/lib/postgresql/data eingebunden; Qui hat vollen Lese- und Schreibzugriff darauf.
  type: path
- key: POSTGRES_PASSWORD
  label: POSTGRES PASSWORD
  type: password
volumes:
- container_path: /config
  label: Config
  default_host_subpath: qui-config
- container_path: /var/lib/postgresql/data
  label: Var lib postgresql data
  default_host_subpath: postgres-var-lib-postgresql-data
