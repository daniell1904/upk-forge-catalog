id: turbodiffusion-nvidia
name: TurboDiffusion(Nvidia GPU)
author: thu-ml
category: AI
description: >-
  TurboDiffusion is an accelerated text-to-video generation framework based on the Latent Consistency Model (LCM). It leverages various TurboWan2 models to rapidly generate high-quality videos from text descriptions. The framework supports both image and video generation and provides optimized checkpoints for different GPU configurations.


  **Key Features:**

  - Ultra-fast video and image generation

  - Intuitive Gradio WebUI

  - Optimized for different GPU configurations

  - Quantized and unquantized checkpoints

  - Flexible model configuration


  **Hardware Requirements:**

  - Recommended: RTX 3090 or above

  - GPU VRAM: > 30 GB

  - System RAM: > 40 GB

  - CUDA-compatible NVIDIA drivers


  **Learn More:**

  - [TurboDiffusion GitHub](https://github.com/thu-ml/TurboDiffusion)
source_code: https://github.com/thu-ml/TurboDiffusion
ugos:
  app_id: com.upkforge.docker.turbodiffusionnvidia
  version: 0.1.0
  port: 27860
  open_type: tab
  tag_type: utility
parameters:
- key: VOL_1
  label: Workspace TurboDiffusion checkpoints host folder
  help: Folder on the NAS for TurboDiffusion(Nvidia GPU)'s workspace turbodiffusion checkpoints host. It is mounted into the container at /workspace/TurboDiffusion/checkpoints_host; TurboDiffusion(Nvidia GPU) has full read and write access to it.
  label_de: Workspace TurboDiffusion checkpoints host-Ordner
  help_de: Ordner auf der NAS für TurboDiffusion(Nvidia GPU)s Workspace TurboDiffusion checkpoints host. Wird im Container unter /workspace/TurboDiffusion/checkpoints_host eingebunden; TurboDiffusion(Nvidia GPU) hat vollen Lese- und Schreibzugriff darauf.
  type: path
- key: VOL_2
  label: Workspace TurboDiffusion outputs folder
  help: Folder on the NAS for TurboDiffusion(Nvidia GPU)'s workspace turbodiffusion outputs. It is mounted into the container at /workspace/TurboDiffusion/outputs; TurboDiffusion(Nvidia GPU) has full read and write access to it.
  label_de: Workspace TurboDiffusion outputs-Ordner
  help_de: Ordner auf der NAS für TurboDiffusion(Nvidia GPU)s Workspace TurboDiffusion outputs. Wird im Container unter /workspace/TurboDiffusion/outputs eingebunden; TurboDiffusion(Nvidia GPU) hat vollen Lese- und Schreibzugriff darauf.
  type: path
volumes:
- container_path: /workspace/TurboDiffusion/checkpoints_host
  label: Workspace TurboDiffusion checkpoints host
  default_host_subpath: turbodiffusion-workspace-turbodiffusion-checkpoints-host
- container_path: /workspace/TurboDiffusion/outputs
  label: Workspace TurboDiffusion outputs
  default_host_subpath: turbodiffusion-workspace-turbodiffusion-outputs
