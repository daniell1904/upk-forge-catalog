id: faster-whisper
name: Faster-whisper
author: Community
category: AI
description: Faster-whisper is a reimplementation of OpenAI's Whisper model using CTranslate2, which is a fast inference engine for Transformer models. This container provides a Wyoming protocol server for faster-whisper.
ugos:
  app_id: com.upkforge.docker.fasterwhisper
  version: 0.1.0
  port: 10300
  open_type: tab
  tag_type: utility
parameters:
- key: VOL_1
  label: Config folder
  help: Folder on the NAS for Faster-whisper's config. It is mounted into the container at /config; Faster-whisper has full read and write access to it.
  type: path
volumes:
- container_path: /config
  label: Config
  default_host_subpath: faster-whisper-config
