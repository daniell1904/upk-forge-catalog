services:
  faster-whisper:
    image: linuxserver/faster-whisper:3.7.0
    restart: unless-stopped
    ports:
      - 10300:10300
    volumes:
      - ${VOL_1}:/config
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - WHISPER_MODEL=tiny-int8
      - WHISPER_BEAM=1
      - WHISPER_LANG=en
