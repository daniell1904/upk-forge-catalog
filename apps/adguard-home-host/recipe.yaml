id: adguard-home-host
name: AdGuard Home (HOST)
author: Community
category: Networking
description: Use if you're going to use Adguard Home as a DHCP server. AdGuard Home is a network-wide software for blocking ads and tracking. After you set it up, it'll cover all your home devices, and you won't need any client-side software for that. Learn more on our official Github repository.
warnings:
- service uses host networking
ugos:
  app_id: com.upkforge.docker.adguardhomehost
  version: 0.1.0
  port: 10080
  open_type: tab
  tag_type: utility
parameters:
- key: VOL_1
  label: Opt adguardhome work folder
  help: Folder on the NAS for AdGuard Home (HOST)'s opt adguardhome work. It is mounted into the container at /opt/adguardhome/work; AdGuard Home (HOST) has full read and write access to it.
  type: path
- key: VOL_2
  label: Opt adguardhome conf folder
  help: Folder on the NAS for AdGuard Home (HOST)'s opt adguardhome conf. It is mounted into the container at /opt/adguardhome/conf; AdGuard Home (HOST) has full read and write access to it.
  type: path
volumes:
- container_path: /opt/adguardhome/work
  label: Opt adguardhome work
  default_host_subpath: adguard-home-host-opt-adguardhome-work
- container_path: /opt/adguardhome/conf
  label: Opt adguardhome conf
  default_host_subpath: adguard-home-host-opt-adguardhome-conf
