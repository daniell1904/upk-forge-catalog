id: lancache
name: LAN Cache
author: Community
category: Networking
description: Make the most of your network. Get more play for your gamers. Download your games once and serve them out to many people at your LAN.
ugos:
  app_id: com.upkforge.docker.lancache
  version: 0.1.0
  port: 8080
  open_type: tab
  tag_type: utility
parameters:
- key: VOL_1
  label: Data cache folder
  help: Folder on the NAS for LAN Cache's data cache. It is mounted into the container at /data/cache; LAN Cache has full read and write access to it.
  label_de: Daten Cache-Ordner
  help_de: Ordner auf der NAS für LAN Caches Daten Cache. Wird im Container unter /data/cache eingebunden; LAN Cache hat vollen Lese- und Schreibzugriff darauf.
  type: path
- key: VOL_2
  label: Data logs folder
  help: Folder on the NAS for LAN Cache's data logs. It is mounted into the container at /data/logs; LAN Cache has full read and write access to it.
  label_de: Daten Protokolle-Ordner
  help_de: Ordner auf der NAS für LAN Caches Daten Protokolle. Wird im Container unter /data/logs eingebunden; LAN Cache hat vollen Lese- und Schreibzugriff darauf.
  type: path
volumes:
- container_path: /data/cache
  label: Data cache
  default_host_subpath: app-data-cache
- container_path: /data/logs
  label: Data logs
  default_host_subpath: app-data-logs
