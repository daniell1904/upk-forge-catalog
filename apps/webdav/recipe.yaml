id: webdav
name: WebDAV
author: Team
category: Productivity
description: WebDAV is a web-based protocol that allows you to share and manage files over the internet, providing a collaborative environment for file editing and versioning.
source_code: https://github.com/ugeek/docker-webdav
ugos:
  app_id: com.upkforge.docker.webdav
  version: 0.1.0
  port: 5005
  open_type: tab
  tag_type: utility
parameters:
- key: VOL_1
  label: Media folder
  help: Folder on the NAS for WebDAV's media. It is mounted into the container at /media; WebDAV has full read and write access to it.
  label_de: Medien-Ordner
  help_de: Ordner auf der NAS für WebDAVs Medien. Wird im Container unter /media eingebunden; WebDAV hat vollen Lese- und Schreibzugriff darauf.
  type: path
- key: PASSWORD
  label: PASSWORD
  type: password
volumes:
- container_path: /media
  label: Media
  default_host_subpath: webdav-media
