id: postgresql
name: PostgreSQL
author: WisdomSky
category: Developer
description: >-
  PostgreSQL is a powerful, open source object-relational database system with over 35 years of active development that has earned it a strong reputation for reliability, feature robustness, and performance.


  PostgreSQL is a highly stable database backed by more than 20 years of development by the open-source community.


  PostgreSQL is used as a primary database for many web applications as well as mobile and analytics applications.
homepage: https://www.postgresql.org
source_code: https://github.com/postgres/postgres
ugos:
  app_id: com.upkforge.docker.postgresql
  version: 0.1.0
  port: 5432
  open_type: tab
  tag_type: devtool
parameters:
- key: VOL_1
  label: Var lib postgresql data folder
  help: Folder on the NAS for PostgreSQL's var lib postgresql data. It is mounted into the container at /var/lib/postgresql/data; PostgreSQL has full read and write access to it.
  label_de: Var lib postgresql Daten-Ordner
  help_de: Ordner auf der NAS für PostgreSQLs Var lib postgresql Daten. Wird im Container unter /var/lib/postgresql/data eingebunden; PostgreSQL hat vollen Lese- und Schreibzugriff darauf.
  type: path
- key: POSTGRES_PASSWORD
  label: POSTGRES PASSWORD
  type: password
volumes:
- container_path: /var/lib/postgresql/data
  label: Var lib postgresql data
  default_host_subpath: postgresql-var-lib-postgresql-data
