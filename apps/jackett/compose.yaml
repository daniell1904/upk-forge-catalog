services:
  jackett:
    image: linuxserver/jackett:0.24.1985
    restart: unless-stopped
    network_mode: bridge
    ports:
      - 9117:9117
    volumes:
      - ./config:/config
      - ${VOL_1}:/downloads
    environment:
      - AUTO_UPDATE=true
      - PGID=1000
      - PUID=1000
      - TZ=Europe/London
