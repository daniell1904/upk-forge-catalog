id: databag
name: Databag
author: Pierre Balzack
category: Social
description: Databag is a federated chat app for self-hosting that focuses on user privacy and security; the service includes clients for iOS, Android, and browser.
source_code: https://github.com/balzack/databag
ugos:
  app_id: com.upkforge.docker.databag
  version: 0.1.0
  port: 7000
  open_type: tab
  tag_type: utility
parameters:
- key: VOL_1
  label: Var lib databag folder
  help: Folder on the NAS for Databag's var lib databag. It is mounted into the container at /var/lib/databag; Databag has full read and write access to it.
  label_de: Var lib databag-Ordner
  help_de: Ordner auf der NAS für Databags Var lib databag. Wird im Container unter /var/lib/databag eingebunden; Databag hat vollen Lese- und Schreibzugriff darauf.
  type: path
volumes:
- container_path: /var/lib/databag
  label: Var lib databag
  default_host_subpath: databag-var-lib-databag
