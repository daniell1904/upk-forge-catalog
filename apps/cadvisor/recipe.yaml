id: cadvisor
name: cAdvisor
author: Community
category: Networking
description: cAdvisor (Container Advisor) provides container users an understanding of the resource usage and performance characteristics of their running containers. It is a running daemon that collects, aggregates, processes, and exports information about running containers. Specifically, for each container it keeps resource isolation parameters, historical resource usage, histograms of complete historical resource usage and network statistics. This data is exported by container and machine-wide.
ugos:
  app_id: com.upkforge.docker.cadvisor
  version: 0.1.0
  port: 8085
  open_type: tab
  tag_type: utility
parameters:
- key: VOL_1
  label: Rootfs folder
  help: Folder on the NAS for cAdvisor's rootfs. It is mounted into the container at /rootfs; cAdvisor has full read and write access to it.
  type: path
- key: VOL_2
  label: Var run docker.sock folder
  help: Folder on the NAS for cAdvisor's var run docker.sock. It is mounted into the container at /var/run/docker.sock; cAdvisor has full read and write access to it.
  type: path
- key: VOL_3
  label: Var lib docker folder
  help: Folder on the NAS for cAdvisor's var lib docker. It is mounted into the container at /var/lib/docker; cAdvisor has full read and write access to it.
  type: path
volumes:
- container_path: /rootfs
  label: Rootfs
  default_host_subpath: app-rootfs
- container_path: /var/run/docker.sock
  label: Var run docker.sock
  default_host_subpath: app-var-run-docker-sock
- container_path: /var/lib/docker
  label: Var lib docker
  default_host_subpath: app-var-lib-docker
