services:
  app:
    image: gcr.io/cadvisor/cadvisor:v0.55.1@sha256:3de2bd5203120b866d74a9b283b2ffb8ec382fbf9dc321814700c6ea6f44ec57
    restart: unless-stopped
    ports:
      - 8085:8080
    volumes:
      - ./app-rootfs:/rootfs
      - /var/run:/var/run
      - ./app-var-run-docker-sock:/var/run/docker.sock
      - /sys:/sys
      - ./app-var-lib-docker:/var/lib/docker
      - /dev/disk/:/dev/disk
