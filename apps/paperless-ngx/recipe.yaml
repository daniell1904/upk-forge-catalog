id: paperless-ngx
name: Paperless-ngx
version: 3.1.3
author: Paperless-ngx
category: Content
description: Paperless-ngx is a community-supported open-source document management system that transforms your physical documents into a searchable online archive so you can keep, well, less paper.
homepage: https://docs.paperless-ngx.com
ugos:
  app_id: com.upkforge.docker.paperlessngx
  version: 0.1.0
  port: 8000
  open_type: tab
  tag_type: utility
volumes:
- container_path: /usr/src/paperless/data
  label: Data
  user_chosen: false
  default_host_subpath: data
- container_path: /usr/src/paperless/media
  label: Media
  user_chosen: false
  default_host_subpath: media
- container_path: /usr/src/paperless/export
  label: Export
  user_chosen: false
  default_host_subpath: export
- container_path: /usr/src/paperless/consume
  label: Consume
  user_chosen: false
  default_host_subpath: consume
