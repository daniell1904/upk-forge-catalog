id: pihole-updatelists
name: Pi-hole® Updatelists
author: Community
category: Networking
description: The Pi-hole® is a DNS sinkhole that protects your devices from unwanted content without installing any client-side software. This is a fork of the Pi-hole® application that adds the ability to update the lists of blocked domains and regexes.
warnings:
- 'service adds capabilities: NET_ADMIN'
ugos:
  app_id: com.upkforge.docker.piholeupdatelists
  version: 0.1.0
  port: 53
  open_type: tab
  tag_type: utility
parameters:
- key: VOL_1
  label: Etc pihole folder
  help: Folder on the NAS for Pi-hole® Updatelists's etc pihole. It is mounted into the container at /etc/pihole/; Pi-hole® Updatelists has full read and write access to it.
  label_de: Etc pihole-Ordner
  help_de: Ordner auf der NAS für Pi-hole® Updatelistss Etc pihole. Wird im Container unter /etc/pihole/ eingebunden; Pi-hole® Updatelists hat vollen Lese- und Schreibzugriff darauf.
  type: path
- key: VOL_2
  label: Etc pihole updatelists folder
  help: Folder on the NAS for Pi-hole® Updatelists's etc pihole updatelists. It is mounted into the container at /etc/pihole-updatelists/; Pi-hole® Updatelists has full read and write access to it.
  label_de: Etc pihole updatelists-Ordner
  help_de: Ordner auf der NAS für Pi-hole® Updatelistss Etc pihole updatelists. Wird im Container unter /etc/pihole-updatelists/ eingebunden; Pi-hole® Updatelists hat vollen Lese- und Schreibzugriff darauf.
  type: path
- key: VOL_3
  label: Etc dnsmasq.d folder
  help: Folder on the NAS for Pi-hole® Updatelists's etc dnsmasq.d. It is mounted into the container at /etc/dnsmasq.d/; Pi-hole® Updatelists has full read and write access to it.
  label_de: Etc dnsmasq.d-Ordner
  help_de: Ordner auf der NAS für Pi-hole® Updatelistss Etc dnsmasq.d. Wird im Container unter /etc/dnsmasq.d/ eingebunden; Pi-hole® Updatelists hat vollen Lese- und Schreibzugriff darauf.
  type: path
- key: FTLCONF_webserver_api_password
  label: FTLCONF webserver api password
  type: password
volumes:
- container_path: /etc/pihole/
  label: Etc pihole
  default_host_subpath: pihole-updatelists-etc-pihole
- container_path: /etc/pihole-updatelists/
  label: Etc pihole updatelists
  default_host_subpath: pihole-updatelists-etc-pihole-updatelists
- container_path: /etc/dnsmasq.d/
  label: Etc dnsmasq.d
  default_host_subpath: pihole-updatelists-etc-dnsmasq-d
