id: cloudflared
name: Cloudflare Tunnel
version: 2026.9.0
author: WisdomSky
category: Network
description: >-
  Cloudflare Tunnel offers an easy way to expose web servers securely to the internet, without opening up firewall ports and configuring ACLs. Cloudflare Tunnel also ensures requests route through Cloudflare before reaching the web server, so you can be sure attack traffic is stopped with Cloudflare’s WAF and Unmetered DDoS mitigation, and authenticated with Access if you’ve enabled those features for your account. The software provides a seamless way to securely expose web servers to the internet without configuring firewall ports or access control lists (ACLs). All requests are routed through Cloudflare before reaching your web server, leveraging Cloudflare’s Web Application Firewall (WAF) and unmetered DDoS mitigation to block attack traffic, with optional authentication via Cloudflare Access if enabled. With its intuitive Web interface and efficient tunnel management, this tool is the perfect solution for securely deploying web services. **Discover How to Connect to Cloudflare Tunnel**

  Integrating with Cloudflare Tunnel allows you to securely expose local services to the internet without opening firewall ports, enabling seamless remote access. Below are two practical resources to guide you through the setup process:

  1. [**Cloudflare Official Tutorial**](https://developers.cloudflare.com/cloudflare-one/connections/connect-networks/get-started/create-remote-tunnel/): This tutorial provides detailed steps for creating and managing a Cloudflare Tunnel.

  2. [**Phiptech Practical Guide**](https://phiptech.com/how-to-setup-cloudflare-tunnel-and-expose-your-local-service-or-application/): This guide offers a concise, step-by-step walkthrough for setting up Cloudflare Tunnel on local devices like, with practical examples to help users easily expose services to the public internet.
homepage: https://github.com/WisdomSky/Cloudflared-web
warnings:
- service 'cloudflared' uses host networking
ugos:
  app_id: com.upkforge.docker.cloudflared
  version: 0.1.0
  port: 14333
  open_type: tab
  tag_type: utility
volumes:
- container_path: /config
  label: Config
  user_chosen: false
  default_host_subpath: config
- container_path: /root/.cloudflared
  label: .cloudflared
  user_chosen: false
  default_host_subpath: cloudflared
