services:
  pihole:
    image: docker.io/pihole/pihole:2026.07.2
    ports:
      - "8053:80"
      - "53:53/tcp"
      - "53:53/udp"
    volumes:
      - ./etc-pihole:/etc/pihole
      - ./etc-dnsmasq.d:/etc/dnsmasq.d
    environment:
      - TZ=${TZ}
      - WEBPASSWORD=${PIHOLE_PASSWORD}
      - WEB_PORT=80
    restart: unless-stopped
