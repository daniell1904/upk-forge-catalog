id: gem-digest-bot
name: GemDigest Bot
author: Community
category: Others
description: "Simplify your reads, amplify your time! \U0001F4DA✨ GemDigest is a Telegram bot that summarizes articles from any website into bite-sized nuggets, saving you time and energy for what matters most. \U0001F4F1\U0001F44B"
ugos:
  app_id: com.upkforge.docker.gemdigestbot
  version: 0.1.0
  port: 3333
  open_type: tab
  tag_type: utility
parameters:
- key: VOL_1
  label: Gem digest bot extra configs folder
  help: Folder on the NAS for GemDigest Bot's gem digest bot extra configs. It is mounted into the container at /gem_digest_bot/extra_configs; GemDigest Bot has full read and write access to it.
  type: path
- key: TELEGRAM_API_KEY
  label: TELEGRAM API KEY
  type: password
- key: GEMINI_API_KEY
  label: GEMINI API KEY
  type: password
volumes:
- container_path: /gem_digest_bot/extra_configs
  label: Gem digest bot extra configs
  default_host_subpath: gem-digest-bot-gem-digest-bot-extra-configs
