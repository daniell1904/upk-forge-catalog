id: snapdrop
name: snapdrop
author: self
category: Productivity
description: Snapdrop is a Progressive Web App (PWA) that allows you to transfer files between devices in the same network without having to install anything.
homepage: https://snapdrop.net
source_code: https://github.com/RobinLinus/snapdrop
ugos:
  app_id: com.upkforge.docker.snapdrop
  version: 0.1.0
  port: 10443
  open_type: tab
  tag_type: utility
parameters:
- key: VOL_1
  label: Config folder
  help: Folder on the NAS for snapdrop's config. It is mounted into the container at /config; snapdrop has full read and write access to it.
  type: path
volumes:
- container_path: /config
  label: Config
  default_host_subpath: snapdrop-config
