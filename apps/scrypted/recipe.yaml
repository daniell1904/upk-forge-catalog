id: scrypted
name: Scrypted
author: Community
category: Home
description: Scrypted is an open source video integration platform. Using various Plugins, Scrypted can receive streams from a range of cameras and send them to other platforms (HomeKit, Google Home, Alexa, Home Assistant).
warnings:
- service uses host networking
ugos:
  app_id: com.upkforge.docker.scrypted
  version: 0.1.0
  port: 10443
  open_type: tab
  tag_type: utility
parameters:
- key: VOL_1
  label: Server volume folder
  help: Folder on the NAS for Scrypted's server volume. It is mounted into the container at /server/volume; Scrypted has full read and write access to it.
  type: path
- key: VOL_2
  label: Var run docker.sock folder
  help: Folder on the NAS for Scrypted's var run docker.sock. It is mounted into the container at /var/run/docker.sock; Scrypted has full read and write access to it.
  type: path
- key: WATCHTOWER_HTTP_API_TOKEN
  label: WATCHTOWER HTTP API TOKEN
  type: password
volumes:
- container_path: /server/volume
  label: Server volume
  default_host_subpath: scrypted-server-volume
- container_path: /var/run/docker.sock
  label: Var run docker.sock
  default_host_subpath: watchtower-var-run-docker-sock
