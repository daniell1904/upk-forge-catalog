id: dozzle
name: Dozzle
author: Community
category: Developer
description: Dozzle is a real-time log viewer for docker containers.
ugos:
  app_id: com.upkforge.docker.dozzle
  version: 0.1.0
  port: 8888
  open_type: tab
  tag_type: devtool
parameters:
- key: VOL_1
  label: Var run docker.sock folder
  help: Folder on the NAS for Dozzle's var run docker.sock. It is mounted into the container at /var/run/docker.sock; Dozzle has full read and write access to it.
  type: path
volumes:
- container_path: /var/run/docker.sock
  label: Var run docker.sock
  default_host_subpath: app-var-run-docker-sock
