services:
  pocketid:
    image: ghcr.io/pocket-id/pocket-id:v2.14.0
    restart: unless-stopped
    network_mode: bridge
    ports:
      - 1411:1411
    volumes:
      - ${VOL_1}:/app/data
    environment:
      - APP_URL=http://localhost:1411
      - TRUST_PROXY=false
      - MAXMIND_LICENSE_KEY=
      - PUID=1000
      - PGID=1000
