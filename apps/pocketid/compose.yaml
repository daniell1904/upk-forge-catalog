services:
  pocketid:
    image: ghcr.io/pocket-id/pocket-id:v2.7@sha256:45bdeaf3fcd6d07cf8721e98785d93324bb8e65b586498874c05a3d489c8094e
    restart: unless-stopped
    network_mode: bridge
    ports:
      - 1411:1411
    volumes:
      - ./data:/app/data
    environment:
      - APP_URL=http://localhost:1411
      - TRUST_PROXY=false
      - MAXMIND_LICENSE_KEY=
      - PUID=1000
      - PGID=1000
