id: pocketid
name: Pocket ID
author: techieanant
category: Others
description: Simple and easy-to-use OIDC provider that allows users to authenticate with their passkeys to your services.
ugos:
  app_id: com.upkforge.docker.pocketid
  version: 0.1.0
  port: 1411
  open_type: tab
  tag_type: utility
parameters:
- key: VOL_1
  label: App data folder
  help: Folder on the NAS for Pocket ID's app data. It is mounted into the container at /app/data; Pocket ID has full read and write access to it.
  label_de: App Daten-Ordner
  help_de: Ordner auf der NAS für Pocket IDs App Daten. Wird im Container unter /app/data eingebunden; Pocket ID hat vollen Lese- und Schreibzugriff darauf.
  type: path
volumes:
- container_path: /app/data
  label: App data
  default_host_subpath: pocketid-app-data
