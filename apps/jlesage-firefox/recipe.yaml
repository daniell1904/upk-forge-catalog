id: jlesage-firefox
name: Jlesage Firefox
author: Community
category: Others
description: The GUI of the application is accessed through a modern web browser (no installation or configuration needed on the client side) or via any VNC client.
ugos:
  app_id: com.upkforge.docker.jlesagefirefox
  version: 0.1.0
  port: 5800
  open_type: tab
  tag_type: utility
parameters:
- key: VOL_1
  label: Config folder
  help: Folder on the NAS for Jlesage Firefox's config. It is mounted into the container at /config; Jlesage Firefox has full read and write access to it.
  type: path
- key: VNC_PASSWORD
  label: VNC PASSWORD
  type: password
volumes:
- container_path: /config
  label: Config
  default_host_subpath: jlesage-firefox-config
