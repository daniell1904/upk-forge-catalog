id: nextcloud-ls
name: Nextcloud LS
author: Community
category: Media
description: Nextcloud puts your data at your fingertips, under your control. Store your documents, calendar, contacts and photos on a server at home, at one of our providers or in a data center you trust.
ugos:
  app_id: com.upkforge.docker.nextcloudls
  version: 0.1.0
  port: 10443
  open_type: tab
  tag_type: media
parameters:
- key: VOL_1
  label: Config folder
  help: Folder on the NAS for Nextcloud LS's config. It is mounted into the container at /config; Nextcloud LS has full read and write access to it.
  label_de: Konfiguration-Ordner
  help_de: Ordner auf der NAS für Nextcloud LSs Konfiguration. Wird im Container unter /config eingebunden; Nextcloud LS hat vollen Lese- und Schreibzugriff darauf.
  type: path
- key: VOL_2
  label: Data folder
  help: Folder on the NAS for Nextcloud LS's data. It is mounted into the container at /data; Nextcloud LS has full read and write access to it.
  label_de: Daten-Ordner
  help_de: Ordner auf der NAS für Nextcloud LSs Daten. Wird im Container unter /data eingebunden; Nextcloud LS hat vollen Lese- und Schreibzugriff darauf.
  type: path
volumes:
- container_path: /config
  label: Config
  default_host_subpath: nextcloud-ls-config
- container_path: /data
  label: Data
  default_host_subpath: nextcloud-ls-data
