services:
  jlesage-handbrake:
    image: jlesage/handbrake:v26.07.2@sha256:192f02fbdd651e54f7df918d2dca15ba9cc6851b01c7e534809a0277c8cacd84
    restart: unless-stopped
    ports:
      - 5800:5800
    volumes:
      - ./config:/config
      - ./storage:/storage
      - ./watch:/watch
      - ./output:/output
    environment:
      - VNC_PASSWORD=${VNC_PASSWORD}
