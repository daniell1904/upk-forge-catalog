id: jlesage-handbrake
name: Jlesage Handbrake
author: Community
category: Others
description: The GUI of the application is accessed through a modern web browser (no installation or configuration needed on the client side) or via any VNC client.
ugos:
  app_id: com.upkforge.docker.jlesagehandbrake
  version: 0.1.0
  port: 5800
  open_type: tab
  tag_type: utility
parameters:
- key: VNC_PASSWORD
  label: VNC PASSWORD
  type: password
volumes:
- container_path: /config
  label: Config
  user_chosen: false
  default_host_subpath: config
- container_path: /storage
  label: Storage
  user_chosen: false
  default_host_subpath: storage
- container_path: /watch
  label: Watch
  user_chosen: false
  default_host_subpath: watch
- container_path: /output
  label: Output
  user_chosen: false
  default_host_subpath: output
