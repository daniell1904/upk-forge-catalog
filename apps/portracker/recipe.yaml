id: portracker
name: Portracker
author: Community
category: Networking
description: A self-hosted, real-time port monitoring and discovery tool that automatically discovers and maps network services across systems.
ugos:
  app_id: com.upkforge.docker.portracker
  version: 0.1.0
  port: 4999
  open_type: tab
  tag_type: utility
parameters:
- key: VOL_1
  label: Data folder
  help: Folder on the NAS for Portracker's data. It is mounted into the container at /data; Portracker has full read and write access to it.
  label_de: Daten-Ordner
  help_de: Ordner auf der NAS für Portrackers Daten. Wird im Container unter /data eingebunden; Portracker hat vollen Lese- und Schreibzugriff darauf.
  type: path
- key: VOL_2
  label: Var run docker.sock folder
  help: Folder on the NAS for Portracker's var run docker.sock. It is mounted into the container at /var/run/docker.sock; Portracker has full read and write access to it.
  label_de: Var run docker.sock-Ordner
  help_de: Ordner auf der NAS für Portrackers Var run docker.sock. Wird im Container unter /var/run/docker.sock eingebunden; Portracker hat vollen Lese- und Schreibzugriff darauf.
  type: path
volumes:
- container_path: /data
  label: Data
  default_host_subpath: portracker-data
- container_path: /var/run/docker.sock
  label: Var run docker.sock
  default_host_subpath: portracker-var-run-docker-sock
