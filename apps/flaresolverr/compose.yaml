services:
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.4.6
    restart: unless-stopped
    network_mode: bridge
    ports:
      - 8191:8191
    environment:
      - PGID=1000
      - PUID=1000
      - TZ=$TZ
      - UMASK=002
      - LOG_LEVEL=info
      - LOG_HTML=false
      - CAPTCHA_SOLVER=none
