id: wordpress-v7
name: WordPress v7
author: Community
category: Others
description: Initially started as a blogging tool in 2003, it has evolved into a highly flexible CMS that powers over 40% of the web. WordPress 7 requires MySQL 8.0 and is packaged as a new app alongside the legacy WordPress 6 entry.
ugos:
  app_id: com.upkforge.docker.wordpressv7
  version: 0.1.0
  port: 8084
  open_type: tab
  tag_type: utility
parameters:
- key: VOL_1
  label: Var www html folder
  help: Folder on the NAS for WordPress v7's var www html. It is mounted into the container at /var/www/html; WordPress v7 has full read and write access to it.
  type: path
- key: VOL_2
  label: Var lib mysql folder
  help: Folder on the NAS for WordPress v7's var lib mysql. It is mounted into the container at /var/lib/mysql; WordPress v7 has full read and write access to it.
  type: path
- key: WORDPRESS_DB_PASSWORD
  label: WORDPRESS DB PASSWORD
  type: password
volumes:
- container_path: /var/www/html
  label: Var www html
  default_host_subpath: app-var-www-html
- container_path: /var/lib/mysql
  label: Var lib mysql
  default_host_subpath: db-var-lib-mysql
