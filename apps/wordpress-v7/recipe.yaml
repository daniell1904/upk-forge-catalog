id: wordpress-v7
name: WordPress v7
author: Community
category: Others
description: Initially started as a blogging tool in 2003, it has evolved into a highly flexible CMS that powers over 40% of the web. WordPress 7 requires MySQL 8.0 and is packaged as a new app alongside the legacy WordPress 6 entry.
ugos:
  app_id: com.upkforge.docker.wordpressv7
  version: 0.1.0
  port: 8084
  open_type: tab
  tag_type: utility
parameters:
- key: WORDPRESS_DB_PASSWORD
  label: WORDPRESS DB PASSWORD
  type: password
volumes:
- container_path: /var/www/html
  label: Var www html
  user_chosen: false
  default_host_subpath: html
- container_path: /var/lib/mysql
  label: Var lib mysql
  user_chosen: false
  default_host_subpath: mysql
