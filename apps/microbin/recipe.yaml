id: microbin
name: Microbin
author: Community
category: Others
description: Self-hosted, encrypted pastebin alternative with configurable features.
ugos:
  app_id: com.upkforge.docker.microbin
  version: 0.1.0
  port: 8888
  open_type: tab
  tag_type: utility
parameters:
- key: VOL_1
  label: App microbin data folder
  help: Folder on the NAS for Microbin's app microbin data. It is mounted into the container at /app/microbin_data; Microbin has full read and write access to it.
  type: path
- key: MICROBIN_ADMIN_PASSWORD
  label: MICROBIN ADMIN PASSWORD
  type: password
volumes:
- container_path: /app/microbin_data
  label: App microbin data
  default_host_subpath: microbin-app-microbin-data
