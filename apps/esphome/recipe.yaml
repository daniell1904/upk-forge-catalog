id: esphome
name: ESPHome
author: kd9lsv
category: Home
description: ESPHome is a system to control your microcontrollers by simple yet powerful configuration files and control them remotely through Home Automation systems.
homepage: https://esphome.io
source_code: https://github.com/esphome/esphome
warnings:
- service uses host networking
ugos:
  app_id: com.upkforge.docker.esphome
  version: 0.1.0
  port: 6052
  open_type: tab
  tag_type: utility
parameters:
- key: VOL_1
  label: Config folder
  help: Folder on the NAS for ESPHome's config. It is mounted into the container at /config; ESPHome has full read and write access to it.
  label_de: Konfiguration-Ordner
  help_de: Ordner auf der NAS für ESPHomes Konfiguration. Wird im Container unter /config eingebunden; ESPHome hat vollen Lese- und Schreibzugriff darauf.
  type: path
volumes:
- container_path: /config
  label: Config
  default_host_subpath: esphome-config
