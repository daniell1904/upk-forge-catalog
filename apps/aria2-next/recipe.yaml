id: aria2-next
name: Aria2 Next
version: 2.7.5
author: AnInsomniacy
category: Download
homepage: https://github.com/AnInsomniacy/aria2-next
ugos:
  app_id: com.upkforge.docker.aria2next
  version: 0.1.0
  port: 6800
  open_type: tab
  tag_type: download
parameters:
- key: VOL_1
  label: Downloads folder
  help: Folder on the NAS for Aria2 Next's downloads. It is mounted into the container at /downloads; Aria2 Next has full read and write access to it.
  type: path
volumes:
- container_path: /config
  label: Config
  user_chosen: false
  default_host_subpath: config
- container_path: /var/lib/aria2-next
  label: Aria2 next
  user_chosen: false
  default_host_subpath: state
- container_path: /downloads
  label: Downloads
