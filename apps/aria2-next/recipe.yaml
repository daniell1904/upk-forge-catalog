id: aria2-next
name: Aria2 Next
version: 2.7.5
author: AnInsomniacy
category: Download
homepage: https://github.com/AnInsomniacy/aria2-next
ugos:
  app_id: com.upkforge.docker.aria2next
  version: 0.1.0
  port: 6800
  open_type: tab
  tag_type: download
parameters:
- key: VOL_1
  label: Downloads folder
  help: Folder on the NAS for Aria2 Next's downloads. It is mounted into the container at /downloads; Aria2 Next has full read and write access to it.
  label_de: Downloads-Ordner
  help_de: Ordner auf der NAS für Aria2 Nexts Downloads. Wird im Container unter /downloads eingebunden; Aria2 Next hat vollen Lese- und Schreibzugriff darauf.
  type: path
volumes:
- container_path: /config
  label: Config
  user_chosen: false
  default_host_subpath: config
- container_path: /var/lib/aria2-next
  label: Aria2 next
  user_chosen: false
  default_host_subpath: state
- container_path: /downloads
  label: Downloads
