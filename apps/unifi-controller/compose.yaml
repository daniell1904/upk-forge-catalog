services:
  unifi-controller:
    image: linuxserver/unifi-controller:8.0.24
    restart: unless-stopped
    network_mode: bridge
    ports:
      - 3478:3478
      - 10001:10001
      - 8383:8080
      - 8443:8443
      - 1900:1900
      - 8843:8843
      - 8880:8880
      - 6789:6789
      - 5514:5514
    volumes:
      - ${VOL_1}:/config
    environment:
      - MEM_LIMIT=1024
      - MEM_STARTUP=1024
      - PGID=1000
      - PUID=1000
