services:
  hermes:
    image: nousresearch/hermes-agent:v2026.8.16.2
    restart: unless-stopped
    command:
      - gateway
      - run
    ports:
      - 8642:8642
      - 9119:9119
    volumes:
      - ${VOL_1}:/opt/data
    environment:
      - HERMES_DASHBOARD=1
      - HERMES_DASHBOARD_INSECURE=1
