id: lucky
name: Lucky
author: Community
category: Networking
description: A powerful tool for port forwarding, reverse proxy, dynamic DNS, wake-on-LAN, IPv4 NAT traversal, webdav services, task scheduling, and automatic certificate management.
homepage: https://lucky666.cn/
source_code: https://github.com/gdy666/lucky
warnings:
- service uses host networking
ugos:
  app_id: com.upkforge.docker.lucky
  version: 0.1.0
  port: 16601
  open_type: tab
  tag_type: utility
parameters:
- key: VOL_1
  label: Goodluck folder
  help: Folder on the NAS for Lucky's goodluck. It is mounted into the container at /goodluck; Lucky has full read and write access to it.
  label_de: Goodluck-Ordner
  help_de: Ordner auf der NAS für Luckys Goodluck. Wird im Container unter /goodluck eingebunden; Lucky hat vollen Lese- und Schreibzugriff darauf.
  type: path
volumes:
- container_path: /goodluck
  label: Goodluck
  default_host_subpath: lucky-goodluck
