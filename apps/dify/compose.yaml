services:
  config:
    image: ns2kracy/dify-config:latest
    restart: unless-stopped
    volumes:
      - ${VOL_1}:/configs/nginx
      - ${VOL_2}:/configs/ssrf_proxy
      - ${VOL_3}:/configs/sandbox
  api:
    image: langgenius/dify-api:1.17.1
    restart: unless-stopped
    volumes:
      - ${VOL_4}:/app/api/storage
    environment:
      - MODE=api
      - LOG_LEVEL=INFO
      - SECRET_KEY=${SECRET_KEY}
      - CONSOLE_WEB_URL=
      - INIT_PASSWORD=
      - CONSOLE_API_URL=
      - SERVICE_API_URL=
      - APP_WEB_URL=
      - FILES_URL=
      - FILES_ACCESS_TIMEOUT=300
      - MIGRATION_ENABLED=true
      - DB_USERNAME=postgres
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=dify
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${DB_PASSWORD}
      - REDIS_DB=0
      - CELERY_BROKER_URL=redis://:difyai123456@redis:6379/1
      - WEB_API_CORS_ALLOW_ORIGINS=*
      - CONSOLE_CORS_ALLOW_ORIGINS=*
      - STORAGE_TYPE=local
      - STORAGE_LOCAL_PATH=storage
      - VECTOR_STORE=weaviate
      - WEAVIATE_ENDPOINT=http://weaviate:8080
      - WEAVIATE_API_KEY=${WEAVIATE_API_KEY}
      - CODE_EXECUTION_ENDPOINT=http://sandbox:8194
      - CODE_EXECUTION_API_KEY=${CODE_EXECUTION_API_KEY}
      - CODE_MAX_NUMBER=9223372036854775807
      - CODE_MIN_NUMBER=-9223372036854775808
      - CODE_MAX_STRING_LENGTH=80000
      - TEMPLATE_TRANSFORM_MAX_LENGTH=80000
      - CODE_MAX_STRING_ARRAY_LENGTH=30
      - CODE_MAX_OBJECT_ARRAY_LENGTH=30
      - CODE_MAX_NUMBER_ARRAY_LENGTH=1000
      - SSRF_PROXY_HTTP_URL=http://ssrf_proxy:3128
      - SSRF_PROXY_HTTPS_URL=http://ssrf_proxy:3128
      - INDEXING_MAX_SEGMENTATION_TOKENS_LENGTH=1000
  worker:
    image: langgenius/dify-api:1.17.1
    restart: unless-stopped
    volumes:
      - ${VOL_5}:/app/api/storage
    environment:
      - MODE=worker
      - LOG_LEVEL=INFO
      - SECRET_KEY=${SECRET_KEY}
      - DB_USERNAME=postgres
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=dify
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${DB_PASSWORD}
      - REDIS_DB=0
      - REDIS_USE_SSL=false
      - CELERY_BROKER_URL=redis://:difyai123456@redis:6379/1
      - STORAGE_TYPE=local
      - STORAGE_LOCAL_PATH=storage
      - VECTOR_STORE=weaviate
      - WEAVIATE_ENDPOINT=http://weaviate:8080
      - WEAVIATE_API_KEY=${WEAVIATE_API_KEY}
  web:
    image: langgenius/dify-web:1.17.1
    restart: unless-stopped
    environment:
      - CONSOLE_API_URL=
      - APP_API_URL=
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    command: >
      postgres -c 'max_connections=100'
               -c 'shared_buffers=128MB'
               -c 'work_mem=4MB'
               -c 'maintenance_work_mem=64MB'
               -c 'effective_cache_size=4096MB'
    volumes:
      - ${VOL_6}:/var/lib/postgresql/data
    environment:
      - PGUSER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=dify
      - PGDATA=/var/lib/postgresql/data/pgdata
  redis:
    image: redis:6-alpine
    restart: unless-stopped
    command: redis-server --requirepass difyai123456
    volumes:
      - ${VOL_7}:/data
    environment:
      - REDISCLI_AUTH=${DB_PASSWORD}
  weaviate:
    image: semitechnologies/weaviate:1.19.0
    restart: unless-stopped
    volumes:
      - ${VOL_8}:/var/lib/weaviate
    environment:
      - QUERY_DEFAULTS_LIMIT=25
      - AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED=false
      - PERSISTENCE_DATA_PATH=/var/lib/weaviate
      - DEFAULT_VECTORIZER_MODULE=none
      - CLUSTER_HOSTNAME=node1
      - AUTHENTICATION_APIKEY_ENABLED=true
      - AUTHENTICATION_APIKEY_ALLOWED_KEYS=${WEAVIATE_API_KEY}
      - AUTHENTICATION_APIKEY_USERS=hello@dify.ai
      - AUTHORIZATION_ADMINLIST_ENABLED=true
      - AUTHORIZATION_ADMINLIST_USERS=hello@dify.ai
  sandbox:
    image: langgenius/dify-sandbox:0.2.15
    restart: unless-stopped
    volumes:
      - ${VOL_9}:/dependencies
    environment:
      - API_KEY=${CODE_EXECUTION_API_KEY}
      - GIN_MODE=release
      - WORKER_TIMEOUT=15
      - ENABLE_NETWORK=true
      - HTTP_PROXY=http://ssrf_proxy:3128
      - HTTPS_PROXY=http://ssrf_proxy:3128
      - SANDBOX_PORT=8194
  ssrf_proxy:
    image: ubuntu/squid:7.2-26.04_edge
    restart: unless-stopped
    volumes:
      - ${VOL_10}:/etc/squid
    environment:
      - HTTP_PORT=3128
      - COREDUMP_DIR=/var/spool/squid
      - REVERSE_PROXY_PORT=8194
      - SANDBOX_HOST=sandbox
      - SANDBOX_PORT=8194
  nginx:
    image: nginx:1.31.5
    restart: unless-stopped
    ports:
      - 3701:80
    volumes:
      - ${VOL_11}:/etc/nginx
