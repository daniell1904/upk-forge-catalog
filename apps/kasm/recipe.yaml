id: kasm
name: Kasm
author: Community
category: Media
description: The Container Streaming Platform - Streaming containerized apps and desktops to end-users. The Workspaces platform provides enterprise-class orchestration, data loss prevention, and web streaming technology to enable the delivery of containerized workloads to your browser.
warnings:
- service is privileged
ugos:
  app_id: com.upkforge.docker.kasm
  version: 0.1.0
  port: 3000
  open_type: tab
  tag_type: media
parameters:
- key: VOL_1
  label: Opt folder
  help: Folder on the NAS for Kasm's opt. It is mounted into the container at /opt; Kasm has full read and write access to it.
  type: path
- key: VOL_2
  label: Profiles folder
  help: Folder on the NAS for Kasm's profiles. It is mounted into the container at /profiles; Kasm has full read and write access to it.
  type: path
volumes:
- container_path: /opt
  label: Opt
  default_host_subpath: app-opt
- container_path: /profiles
  label: Profiles
  default_host_subpath: app-profiles
