services:
  app:
    image: linuxserver/kasm:1.120.20221218@sha256:6f40f6c999fa626b8e68371298d0a7870b8bbd1696df4cbcb87352e681f7f7cd
    restart: unless-stopped
    network_mode: bridge
    ports:
      - 3000:3000
      - 443:443
    volumes:
      - ${VOL_1}:/opt
      - ${VOL_2}:/profiles
      - /dev/input:/dev/input
      - /run/udev/data:/run/udev/data
    environment:
      - KASM_PORT=443
