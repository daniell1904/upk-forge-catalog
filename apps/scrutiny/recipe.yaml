id: scrutiny
name: Scrutiny
author: Community
category: Others
description: If you run a server with more than a couple of hard drives, you're probably already familiar with S.M.A.R.T and the smartd daemon.
warnings:
- service is privileged
- 'service adds capabilities: SYS_RAWIO'
ugos:
  app_id: com.upkforge.docker.scrutiny
  version: 0.1.0
  port: 38080
  open_type: tab
  tag_type: utility
parameters:
- key: VOL_1
  label: Opt scrutiny config folder
  help: Folder on the NAS for Scrutiny's opt scrutiny config. It is mounted into the container at /opt/scrutiny/config; Scrutiny has full read and write access to it.
  label_de: Opt scrutiny Konfiguration-Ordner
  help_de: Ordner auf der NAS für Scrutinys Opt scrutiny Konfiguration. Wird im Container unter /opt/scrutiny/config eingebunden; Scrutiny hat vollen Lese- und Schreibzugriff darauf.
  type: path
- key: VOL_2
  label: Opt scrutiny influxdb folder
  help: Folder on the NAS for Scrutiny's opt scrutiny influxdb. It is mounted into the container at /opt/scrutiny/influxdb; Scrutiny has full read and write access to it.
  label_de: Opt scrutiny influxdb-Ordner
  help_de: Ordner auf der NAS für Scrutinys Opt scrutiny influxdb. Wird im Container unter /opt/scrutiny/influxdb eingebunden; Scrutiny hat vollen Lese- und Schreibzugriff darauf.
  type: path
volumes:
- container_path: /opt/scrutiny/config
  label: Opt scrutiny config
  default_host_subpath: scrutiny-opt-scrutiny-config
- container_path: /opt/scrutiny/influxdb
  label: Opt scrutiny influxdb
  default_host_subpath: scrutiny-opt-scrutiny-influxdb
