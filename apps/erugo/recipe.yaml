id: erugo
name: Erugo
author: Community
category: Developer
description: A powerful, self-hosted file-sharing platform built with PHP and Laravel with a Vue.js frontend. It offers secure, customizable file-transfer capabilities through an elegant user interface, giving you complete control over your data while providing a seamless experience for both senders and recipients.
ugos:
  app_id: com.upkforge.docker.erugo
  version: 0.1.0
  port: 9997
  open_type: tab
  tag_type: devtool
parameters:
- key: VOL_1
  label: Var www html storage folder
  help: Folder on the NAS for Erugo's var www html storage. It is mounted into the container at /var/www/html/storage; Erugo has full read and write access to it.
  label_de: Var www html Speicher-Ordner
  help_de: Ordner auf der NAS für Erugos Var www html Speicher. Wird im Container unter /var/www/html/storage eingebunden; Erugo hat vollen Lese- und Schreibzugriff darauf.
  type: path
volumes:
- container_path: /var/www/html/storage
  label: Var www html storage
  default_host_subpath: erugo-var-www-html-storage
