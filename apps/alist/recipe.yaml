id: alist
name: Alist
author: Xhofe
category: Productivity
description: Alist transforms how you manage and access your files at home, whether on your TV, phone, or any other device. Unlike traditional cloud storage, Alist offers a unified experience across multiple platforms, making it a breeze to keep your media and documents at your fingertips. With features like easy installation, support for multiple storage providers (local, Aliyundrive, Onedrive, Google Drive), WebDAV support, dark mode, protected routes with password authentication, file previews for videos, audio, office files, PDFs, code, images, package and batch downloads, single sign-on, offline torrent downloads, file encryption, and additional tools like a text editor and Cloudflare workers proxy, Alist ensures a seamless and secure file management experience. Deploying Alist on private cloud devices like brings unmatched convenience with multi-device access, ensuring your files are always within reach and secure, no matter where you are.
homepage: https://alistgo.com/
source_code: https://github.com/AlistGo/alist
ugos:
  app_id: com.upkforge.docker.alist
  version: 0.1.0
  port: 5244
  open_type: tab
  tag_type: utility
volumes:
- container_path: /opt/alist/data
  label: Opt alist data
  user_chosen: false
  default_host_subpath: data
