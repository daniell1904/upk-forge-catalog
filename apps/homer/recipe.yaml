id: homer
name: Homer
author: Community
category: Others
description: A dead simple static HOMepage for your servER to keep your services on hand, from a simple yaml configuration file.
ugos:
  app_id: com.upkforge.docker.homer
  version: 0.1.0
  port: 8080
  open_type: tab
  tag_type: utility
parameters:
- key: VOL_1
  label: Www assets folder
  help: Folder on the NAS for Homer's www assets. It is mounted into the container at /www/assets; Homer has full read and write access to it.
  type: path
volumes:
- container_path: /www/assets
  label: Www assets
  default_host_subpath: app-www-assets
