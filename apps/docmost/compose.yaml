services:
  docmost:
    image: docmost/docmost:0.96.0
    restart: unless-stopped
    ports:
      - 3000:3000
    volumes:
      - ${VOL_1}:/app/data/storage
    environment:
      - APP_URL=http://localhost:3000
      - APP_SECRET=${APP_SECRET}
      - DATABASE_URL=postgresql://docmost:jcui51lw747yuuk4zrpm@docmost-db:5432/docmost?schema=public
      - REDIS_URL=redis://docmost-redis:6379
  docmost-db:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - ${VOL_2}:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=docmost
      - POSTGRES_USER=docmost
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
  docmost-redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    volumes:
      - ${VOL_3}:/data
