services:
  project-management:
    image: eloufirhatim/helper:1.2.3@sha256:200b25415273529ca5c6513b5ce99931e46bee17e2c730c4d3c2cbc53992fd2e
    restart: unless-stopped
    ports:
      - 8000:8000
    volumes:
      - /etc/localtime:/etc/localtime
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=project-management-db
      - DB_PORT=3306
      - DB_DATABASE=project_management
      - DB_USERNAME=project_management
      - DB_PASSWORD=${DB_PASSWORD}
      - MAIL_MAILER=smtp
      - MAIL_HOST=mailpit
      - MAIL_PORT=1025
      - MAIL_USERNAME=
      - MAIL_PASSWORD=
      - MAIL_ENCRYPTION=null
  project-management-db:
    image: mysql:5.7@sha256:4bc6bc963e6d8443453676cae56536f4b8156d78bae03c0145cbe47c2aad73bb
    restart: unless-stopped
    volumes:
      - ./mysql:/var/lib/mysql
    environment:
      - MYSQL_DATABASE=project_management
      - MYSQL_USER=project_management
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
