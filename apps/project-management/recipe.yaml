id: project-management
name: Project Management
author: Community
category: Developer
description: An open source Project management tool based on Laravel and Filament
ugos:
  app_id: com.upkforge.docker.projectmanagement
  version: 0.1.0
  port: 8000
  open_type: tab
  tag_type: devtool
parameters:
- key: VOL_1
  label: Var lib mysql folder
  help: Folder on the NAS for Project Management's var lib mysql. It is mounted into the container at /var/lib/mysql; Project Management has full read and write access to it.
  type: path
- key: DB_PASSWORD
  label: DB PASSWORD
  type: password
volumes:
- container_path: /var/lib/mysql
  label: Var lib mysql
  default_host_subpath: project-management-db-var-lib-mysql
