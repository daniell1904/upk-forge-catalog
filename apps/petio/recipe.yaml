id: petio
name: Petio
author: WisdomSky
category: Media
description: >-
  Petio is a third party companion app available to Plex server owners to allow their users to request, review and discover content. The app is built to appear instantly familiar and intuitive to even the most tech-agnostic users. Petio will help you manage requests from your users, connect to other third party apps such as Sonarr and Radarr, notify users when content is available and track request progress. Petio also allows users to discover media both on and off your server, quickly and easily find related content and review to leave their opinion for other users.


  Petio is an ongoing, forever free, always evolving project currently in alpha prototype stage and now available!
homepage: https://petio.tv
source_code: https://github.com/petio-team/petio
ugos:
  app_id: com.upkforge.docker.petio
  version: 0.1.0
  port: 7777
  open_type: tab
  tag_type: media
parameters:
- key: VOL_1
  label: App api config folder
  help: Folder on the NAS for Petio's app api config. It is mounted into the container at /app/api/config; Petio has full read and write access to it.
  label_de: App api Konfiguration-Ordner
  help_de: Ordner auf der NAS für Petios App api Konfiguration. Wird im Container unter /app/api/config eingebunden; Petio hat vollen Lese- und Schreibzugriff darauf.
  type: path
- key: VOL_2
  label: App logs folder
  help: Folder on the NAS for Petio's app logs. It is mounted into the container at /app/logs; Petio has full read and write access to it.
  label_de: App Protokolle-Ordner
  help_de: Ordner auf der NAS für Petios App Protokolle. Wird im Container unter /app/logs eingebunden; Petio hat vollen Lese- und Schreibzugriff darauf.
  type: path
volumes:
- container_path: /app/api/config
  label: App api config
  default_host_subpath: petio-app-api-config
- container_path: /app/logs
  label: App logs
  default_host_subpath: petio-app-logs
