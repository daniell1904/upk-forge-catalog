id: davis
name: Davis
author: Community
category: Productivity
description: A simple, fully translatable admin interface for sabre/dav based on Symfony 5 and Bootstrap 5, initially inspired by Baïkal. Provides user edition, calendar creation and sharing, and address book creation. The interface is simple and straightforward, responsive, and provides a light and a dark mode.
ugos:
  app_id: com.upkforge.docker.davis
  version: 0.1.0
  port: 9000
  open_type: tab
  tag_type: utility
parameters:
- key: VOL_1
  label: Data folder
  help: Folder on the NAS for Davis's data. It is mounted into the container at /data; Davis has full read and write access to it.
  type: path
- key: VOL_2
  label: Var lib mysql folder
  help: Folder on the NAS for Davis's var lib mysql. It is mounted into the container at /var/lib/mysql; Davis has full read and write access to it.
  type: path
- key: ADMIN_PASSWORD
  label: ADMIN PASSWORD
  type: password
- key: MYSQL_ROOT_PASSWORD
  label: MYSQL ROOT PASSWORD
  type: password
volumes:
- container_path: /data
  label: Data
  default_host_subpath: davis-mailpit-data
- container_path: /var/lib/mysql
  label: Var lib mysql
  default_host_subpath: davis-mysql-var-lib-mysql
