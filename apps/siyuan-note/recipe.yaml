id: siyuan-note
name: SiYuan Note
author: Team
category: Productivity
description: Experience Seamless Knowledge Management with SiYuan. SiYuan redefines knowledge management by seamlessly integrating with your home TV, mobile devices, and other platforms. Unlike traditional knowledge systems, SiYuan offers a cohesive and flexible environment that adapts to your lifestyle, allowing you to access and organize information effortlessly across all your devices. Whether you are a creator or a regular consumer, SiYuan's innovative approach ensures your knowledge is always at your fingertips. Powerful Features, Minimal Cost. SiYuan stands out with its robust set of features, most of which are free, even for commercial use. Enjoy block-level referencing, two-way links, custom attributes, SQL query embeds, and the unique protocol siyuan://. The editor supports block-style, markdown WYSIWYG, list outlines, and block zoom-in. Handle large documents with ease and include mathematical formulas, charts, flowcharts, and more. Capture web content, annotate PDFs, and export in various formats including Markdown, PDF, Word, and HTML. SiYuan also offers AI-powered writing and Q/A chat via OpenAI API, Tesseract OCR, and multi-tab support for a comprehensive and seamless experience. Unlimited Storage, Local Speed, Multi-Device Access. Deploying Alist on private cloud devices brings unparalleled convenience. Enjoy unlimited storage, blazing-fast local network speeds, and access from multiple devices. This setup ensures that your data is always available, secure, and quickly accessible, providing a superior alternative to traditional cloud services.
homepage: https://b3log.org/siyuan/
source_code: https://github.com/siyuan-note/siyuan
ugos:
  app_id: com.upkforge.docker.siyuannote
  version: 0.1.0
  port: 6806
  open_type: tab
  tag_type: utility
parameters:
- key: VOL_1
  label: Siyuan workspace folder
  help: Folder on the NAS for SiYuan Note's siyuan workspace. It is mounted into the container at /siyuan/workspace; SiYuan Note has full read and write access to it.
  label_de: Siyuan workspace-Ordner
  help_de: Ordner auf der NAS für SiYuan Notes Siyuan workspace. Wird im Container unter /siyuan/workspace eingebunden; SiYuan Note hat vollen Lese- und Schreibzugriff darauf.
  type: path
volumes:
- container_path: /siyuan/workspace
  label: Siyuan workspace
  default_host_subpath: siyuan-note-siyuan-workspace
