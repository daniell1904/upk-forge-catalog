id: ejbca-ce
name: EJBCA Community
author: Community
category: Social
description: The open-source public key infrastructure (PKI) and certificate authority (CA) software EJBCA is one of the longest running CA software projects. EJBCA covers all your needs - from certificate enrollment, via certificate management, to certificate validation.
ugos:
  app_id: com.upkforge.docker.ejbcace
  version: 0.1.0
  port: 8080
  open_type: tab
  tag_type: utility
parameters:
- key: VOL_1
  label: Mnt persistent folder
  help: Folder on the NAS for EJBCA Community's mnt persistent. It is mounted into the container at /mnt/persistent; EJBCA Community has full read and write access to it.
  type: path
volumes:
- container_path: /mnt/persistent
  label: Mnt persistent
  default_host_subpath: ejbca-ce-mnt-persistent
