services:
  plant-it:
    image: msdeluise/plant-it-server:0.10.0@sha256:23ddf8660087d6b9f5dbdca2ca09817b84db45cb2d9d6e2e0176e70f514629e7
    restart: unless-stopped
    ports:
      - 3000:3000
      - 8080:8080
    volumes:
      - ${VOL_1}:/upload-dir
      - ${VOL_2}:/certificates
    environment:
      - MYSQL_HOST=plant-it-db
      - MYSQL_PORT=3306
      - MYSQL_USERNAME=root
      - MYSQL_PSW=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=plantit
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXP=1
      - USERS_LIMIT=-1
      - UPLOAD_DIR=/upload-dir
      - API_PORT=8080
      - TREFLE_KEY=
      - LOG_LEVEL=DEBUG
      - ALLOWED_ORIGINS=*
      - CACHE_TTL=86400
      - CACHE_HOST=plant-it-cache
      - CACHE_PORT=6379
      - SSL_ENABLED=false
      - CERTIFICATE_PATH=/certificates/
  plant-it-db:
    image: mysql:26.7.0
    restart: unless-stopped
    ports:
      - 3306:3306
    volumes:
      - ${VOL_3}:/var/lib/mysql
    environment:
      - MYSQL_DATABASE=plantit
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
  plant-it-cache:
    image: redis:8.10.1
    restart: unless-stopped
