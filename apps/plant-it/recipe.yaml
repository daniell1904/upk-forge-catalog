id: plant-it
name: Plant-it
author: Community
category: Others
description: Plant-it is a self-hosted gardening companion app. Useful for keeping track of plant care, receiving notifications about when to water plants, uploading plant images, and more.
ugos:
  app_id: com.upkforge.docker.plantit
  version: 0.1.0
  port: 3000
  open_type: tab
  tag_type: utility
parameters:
- key: VOL_1
  label: Upload dir folder
  help: Folder on the NAS for Plant-it's upload dir. It is mounted into the container at /upload-dir; Plant-it has full read and write access to it.
  type: path
- key: VOL_2
  label: Certificates folder
  help: Folder on the NAS for Plant-it's certificates. It is mounted into the container at /certificates; Plant-it has full read and write access to it.
  type: path
- key: VOL_3
  label: Var lib mysql folder
  help: Folder on the NAS for Plant-it's var lib mysql. It is mounted into the container at /var/lib/mysql; Plant-it has full read and write access to it.
  type: path
- key: MYSQL_ROOT_PASSWORD
  label: MYSQL ROOT PASSWORD
  type: password
- key: JWT_SECRET
  label: JWT SECRET
  type: password
volumes:
- container_path: /upload-dir
  label: Upload dir
  default_host_subpath: plant-it-upload-dir
- container_path: /certificates
  label: Certificates
  default_host_subpath: plant-it-certificates
- container_path: /var/lib/mysql
  label: Var lib mysql
  default_host_subpath: plant-it-db-var-lib-mysql
