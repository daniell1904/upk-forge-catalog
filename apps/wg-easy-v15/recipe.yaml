id: wg-easy-v15
name: WireGuard Easy v15
author: Community
category: Networking
description: "WireGuard Easy v15 - Complete rewrite with new features and improved UI. Access your homeserver from anywhere with this modern VPN solution. NOTE: This is v15 which has breaking changes from v14. If you're currently using v14, please backup your configuration before migrating."
warnings:
- 'service adds capabilities: NET_ADMIN, SYS_MODULE'
ugos:
  app_id: com.upkforge.docker.wgeasyv15
  version: 0.1.0
  port: 51820
  open_type: tab
  tag_type: utility
parameters:
- key: VOL_1
  label: Etc wireguard folder
  help: Folder on the NAS for WireGuard Easy v15's etc wireguard. It is mounted into the container at /etc/wireguard; WireGuard Easy v15 has full read and write access to it.
  label_de: Etc wireguard-Ordner
  help_de: Ordner auf der NAS für WireGuard Easy v15s Etc wireguard. Wird im Container unter /etc/wireguard eingebunden; WireGuard Easy v15 hat vollen Lese- und Schreibzugriff darauf.
  type: path
- key: INIT_PASSWORD
  label: INIT PASSWORD
  type: password
volumes:
- container_path: /etc/wireguard
  label: Etc wireguard
  default_host_subpath: wg-easy-v15-etc-wireguard
