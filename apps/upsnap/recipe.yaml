id: upsnap
name: Upsnap
author: Community
category: Others
description: A simple wake on lan web app written with SvelteKit, Go and PocketBase.
warnings:
- service uses host networking
ugos:
  app_id: com.upkforge.docker.upsnap
  version: 0.1.0
  port: 8090
  open_type: tab
  tag_type: utility
parameters:
- key: VOL_1
  label: App pb data folder
  help: Folder on the NAS for Upsnap's app pb data. It is mounted into the container at /app/pb_data; Upsnap has full read and write access to it.
  label_de: App pb Daten-Ordner
  help_de: Ordner auf der NAS für Upsnaps App pb Daten. Wird im Container unter /app/pb_data eingebunden; Upsnap hat vollen Lese- und Schreibzugriff darauf.
  type: path
volumes:
- container_path: /app/pb_data
  label: App pb data
  default_host_subpath: upsnap-app-pb-data
