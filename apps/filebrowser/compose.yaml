services:
  filebrowser:
    image: filebrowser/filebrowser:v2.63.23-s6@sha256:ee4ac79e52966a5f6247f99c7d667c1debfb277a3a61ab829f505aa8f4c74b21
    restart: unless-stopped
    ports:
      - 8080:80
    volumes:
      - ./filebrowser-srv-app-data:/srv/app-data
      - ${VOL_1}:/srv/documents
      - ${VOL_2}:/srv/downloads
      - ./filebrowser-srv-gallery:/srv/gallery
      - ${VOL_3}:/srv/media
      - ./data/db:/database
      - ./data/config:/config
    environment:
      - PUID=0
      - PGID=0
