id: grafana
name: Grafana
author: Team
category: Developer
description: 'Grafana open source is open source visualization and analytics software.Visualizations: Fast and flexible client side graphs with a multitude of options. Panel plugins offer many different ways to visualize metrics and logs. Dynamic Dashboards: Create dynamic & reusable dashboards with template variables that appear as dropdowns at the top of the dashboard. Explore Metrics: Explore your data through ad-hoc queries and dynamic drilldown. Split view and compare different time ranges, queries and data sources side by side. Explore Logs: Experience the magic of switching from metrics to logs with preserved label filters. Quickly search through all your logs or streaming them live. Alerting: Visually define alert rules for your most important metrics. Grafana will continuously evaluate and send notifications to systems like Slack, PagerDuty, VictorOps, OpsGenie. Mixed Data Sources: Mix different data sources in the same graph! You can specify a data source on a per-query basis. This works for even custom datasources.'
homepage: https://grafana.com/
source_code: https://github.com/grafana/grafana
ugos:
  app_id: com.upkforge.docker.grafana
  version: 0.1.0
  port: 3003
  open_type: tab
  tag_type: devtool
parameters:
- key: VOL_1
  label: Var lib grafana folder
  help: Folder on the NAS for Grafana's var lib grafana. It is mounted into the container at /var/lib/grafana; Grafana has full read and write access to it.
  type: path
volumes:
- container_path: /var/lib/grafana
  label: Var lib grafana
  default_host_subpath: grafana-var-lib-grafana
