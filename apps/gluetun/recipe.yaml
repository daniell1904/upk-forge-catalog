id: gluetun
name: Gluetun
author: Community
category: Networking
description: Lightweight swiss-knife-like VPN client to multiple VPN service providers
warnings:
- 'service adds capabilities: NET_ADMIN'
ugos:
  app_id: com.upkforge.docker.gluetun
  version: 0.1.0
  port: 8888
  open_type: tab
  tag_type: utility
parameters:
- key: VOL_1
  label: Gluetun folder
  help: Folder on the NAS for Gluetun's gluetun. It is mounted into the container at /gluetun; Gluetun has full read and write access to it.
  label_de: Gluetun-Ordner
  help_de: Ordner auf der NAS für Gluetuns Gluetun. Wird im Container unter /gluetun eingebunden; Gluetun hat vollen Lese- und Schreibzugriff darauf.
  type: path
volumes:
- container_path: /gluetun
  label: Gluetun
  default_host_subpath: gluetun-gluetun
