services:
  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:15.4.0
    ports:
      - "51821:51821"
      - "51820:51820/udp"
    volumes:
      - ./config:/etc/wireguard
    environment:
      - TZ=${TZ}
      - INIT_ENABLED=true
      - INIT_USERNAME=admin
      - INIT_PASSWORD=${wizard_password}
      - INIT_HOST=${wizard_wg_host}
      - INIT_PORT=51820
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv4.ip_forward=1
    restart: unless-stopped
