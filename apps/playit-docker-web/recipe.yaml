id: playit-docker-web
name: Playit Docker Web
author: Community
category: Networking
description: Playit.gg is a global proxy that allows anyone to host a server without port forwarding. We use tunneling. Only the server needs to run the program, not every player!
warnings:
- service uses host networking
ugos:
  app_id: com.upkforge.docker.playitdockerweb
  version: 0.1.0
  port: 8008
  open_type: tab
  tag_type: utility
volumes:
- container_path: /config
  label: Config
  user_chosen: false
  default_host_subpath: config
