id: playit-docker-web
name: Playit Docker Web
author: Community
category: Networking
description: Playit.gg is a global proxy that allows anyone to host a server without port forwarding. We use tunneling. Only the server needs to run the program, not every player!
warnings:
- service uses host networking
ugos:
  app_id: com.upkforge.docker.playitdockerweb
  version: 0.1.0
  port: 8008
  open_type: tab
  tag_type: utility
parameters:
- key: VOL_1
  label: Config folder
  help: Folder on the NAS for Playit Docker Web's config. It is mounted into the container at /config; Playit Docker Web has full read and write access to it.
  type: path
volumes:
- container_path: /config
  label: Config
  default_host_subpath: playit-docker-web-config
