id: jfa-go
name: jfa-go
author: Community
category: Media
description: jfa-go is a user management app for Jellyfin (and Emby as 2nd class) that provides invite-based account creation as well as other features that make one's instance much easier to manage.
ugos:
  app_id: com.upkforge.docker.jfago
  version: 0.1.0
  port: 8056
  open_type: tab
  tag_type: media
parameters:
- key: VOL_1
  label: Data folder
  help: Folder on the NAS for jfa-go's data. It is mounted into the container at /data; jfa-go has full read and write access to it.
  label_de: Daten-Ordner
  help_de: Ordner auf der NAS für jfa-gos Daten. Wird im Container unter /data eingebunden; jfa-go hat vollen Lese- und Schreibzugriff darauf.
  type: path
- key: VOL_2
  label: Jf folder
  help: Folder on the NAS for jfa-go's jf. It is mounted into the container at /jf; jfa-go has full read and write access to it.
  label_de: Jf-Ordner
  help_de: Ordner auf der NAS für jfa-gos Jf. Wird im Container unter /jf eingebunden; jfa-go hat vollen Lese- und Schreibzugriff darauf.
  type: path
volumes:
- container_path: /data
  label: Data
  default_host_subpath: jfa-go-data
- container_path: /jf
  label: Jf
  default_host_subpath: jfa-go-jf
